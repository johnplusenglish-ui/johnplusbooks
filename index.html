<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book42 — the reading diary</title>
<meta name="description" content="Every monthly pick from Book42, our Telegram book club, since 2021 — a year-by-year gallery.">
<style>
/* Outfit, self-hosted — was Google Fonts, but that file is actually a single
   variable font (wght 100-900) reused for every weight Google served, so
   vendoring it is just two small files instead of a whole third-party round trip. */
@font-face{
  font-family:'Outfit';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url('fonts/outfit-latin.woff2') format('woff2-variations'),
      url('fonts/outfit-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face{
  font-family:'Outfit';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url('fonts/outfit-latin-ext.woff2') format('woff2-variations'),
      url('fonts/outfit-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
:root{
  --bg:#fbf9f5;
  --card-bg:#ffffff;
  --ink:#1b1b1f;
  --ink-soft:#5a5a63;
  --line:#e7e3da;
  --accent:#3159d1;
  --radius:20px;
  --shadow-lo:0 1px 2px rgba(20,20,30,.06);
  --shadow-md:0 12px 30px -12px rgba(20,20,30,.22);
  --shadow-hi:0 24px 60px -18px rgba(20,20,30,.32);
}
*{box-sizing:border-box}
html, body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Outfit',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  overflow:hidden;
}
img{max-width:100%;display:block}
a{color:inherit}

/* ---------- topbar ---------- */
.topbar{
  flex:none;
  display:flex; align-items:center; gap:1.25rem;
  padding:.9rem 1.5rem;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex; align-items:baseline; gap:.5rem;
  font-family:inherit; font-weight:800; font-size:1.1rem; letter-spacing:-.01em; white-space:nowrap;
  appearance:none; background:none; border:none; padding:0; color:inherit; cursor:pointer;
}
.brand .brand-name{transition:opacity .15s}
.brand:hover .brand-name{opacity:.7}
.brand small{font-weight:500; font-size:.68rem; color:var(--ink-soft); letter-spacing:.08em; text-transform:uppercase}
.brand-42{color:#1592a8}
/* overflow-x:auto also turns the vertical axis into a scroll box (a `visible`
   value on one axis computes to `auto` when the other isn't visible), and the
   pills used to stretch flush to that clip edge — exactly 0px of tolerance, so
   on a high-DPI phone the bottom hairline of the rounded border was cut off.
   Centre them and keep real room above/below; the negative margin cancels the
   padding again so the topbar's height is unchanged. */
.year-nav{
  display:flex; align-items:center; gap:.4rem; flex:1;
  overflow-x:auto; scrollbar-width:none;
  padding-block:.3rem; margin-block:-.3rem;
}
.year-nav::-webkit-scrollbar{display:none}
.year-nav button{
  flex:none;
  appearance:none; font:inherit;
  font-size:.85rem; font-weight:600;
  padding:.42rem .85rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  cursor:pointer;
  color:var(--ink-soft);
  transition:background .15s, color .15s, border-color .15s;
}
.year-nav button[data-active="true"]{
  background:var(--yr-color, var(--accent));
  border-color:var(--yr-color, var(--accent));
  color:#fff;
}
.editmode-btn{
  flex:none;
  font-size:.75rem; font-weight:600;
  padding:.42rem .8rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  cursor:pointer;
  color:var(--ink-soft);
}
.editmode-btn[data-on="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.tg-link{
  flex:none;
  display:inline-flex; align-items:center; gap:.42rem;
  font-size:.78rem; font-weight:600;
  padding:.42rem .8rem;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--ink-soft);
  text-decoration:none;
  white-space:nowrap;
  transition:color .15s, border-color .15s, background .15s;
}
.tg-link:hover{
  color:#229ED9;
  border-color:#229ED9;
  background:color-mix(in srgb, #229ED9 7%, transparent);
}
.tg-link svg{width:15px; height:15px; fill:currentColor; flex:none}

/* ---------- year section (one full-height panel per year, swapped via tabs) ---------- */
main#years{flex:1 1 auto; min-height:0; overflow:hidden}
.year-section{display:none; flex-direction:column; height:100%; padding:1rem 1.5rem 1.25rem; min-height:0}
.year-section.active{display:flex}
.year-head{flex:none; max-width:1180px; width:100%; margin:0 auto; display:flex; align-items:baseline; gap:1rem; margin-bottom:.6rem}
.year-head .num{font-size:clamp(2rem,5vw,3.2rem); font-weight:900; letter-spacing:-.03em; color:var(--yr-color); line-height:1}
.year-head .meta{font-size:.85rem; color:var(--ink-soft); font-weight:500}
.year-head .meta b{color:var(--ink); font-weight:700}

/* ---------- carousel ---------- */
.carousel-wrap{position:relative; flex:1 1 auto; min-height:0; display:flex}
.carousel{
  position:relative;
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  touch-action:pan-y;
  user-select:none;
  cursor:grab;
  outline:none;
}
.carousel.dragging{cursor:grabbing}
.card{
  position:absolute;
  /* width/height are set explicitly in px by layout() in JS, not derived
     here — see that function for why aspect-ratio + max-width isn't safe */
  border-radius:5px;
  overflow:hidden;
  background:var(--card-bg);
  box-shadow:var(--shadow-md);
  transition:transform .38s cubic-bezier(.22,1,.36,1), opacity .38s ease, box-shadow .38s ease;
  will-change:transform;
  cursor:pointer;
}
.card.is-active{box-shadow:var(--shadow-hi); cursor:zoom-in}
.card.is-active.is-break{cursor:default}
.card .cover-img{width:100%; height:100%; object-fit:cover; background:#eee}
.card .placeholder{
  width:100%; height:100%;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:1.1rem;
  background:linear-gradient(160deg, color-mix(in srgb, var(--yr-color) 70%, #111) 0%, color-mix(in srgb, var(--yr-color) 35%, #111) 100%);
  color:#fff;
}
.card .placeholder .p-icon{opacity:.5; margin-bottom:auto}
.card .placeholder .p-title{font-weight:800; font-size:1rem; line-height:1.25}
.card .placeholder .p-author{font-size:.78rem; opacity:.8; margin-top:.3rem}
.card .badge{
  position:absolute; top:.6rem; left:.6rem;
  font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:rgba(255,255,255,.92); color:var(--ink);
  padding:.32rem .6rem; border-radius:999px;
}
.card .nf-badge{
  position:absolute; top:.6rem; right:.6rem;
  font-size:.62rem; font-weight:700;
  background:rgba(20,20,25,.75); color:#fff;
  padding:.32rem .55rem; border-radius:999px;
}
.card .gradient{
  position:absolute; inset:auto 0 0 0; height:55%;
  background:linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
  pointer-events:none;
}
.card .card-foot{
  position:absolute; left:0; right:0; bottom:0; padding:.85rem;
  color:#fff;
}
.card .card-foot .t{font-weight:700; font-size:.85rem; line-height:1.2}
.card .card-foot .a{font-size:.72rem; opacity:.85; margin-top:.15rem; font-style:italic}
.card.is-break{cursor:default}
.card .edit-btn{
  position:absolute; bottom:.6rem; right:.6rem;
  width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,.92); border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  opacity:0; transition:opacity .15s;
}
body.edit-mode .card.is-active .edit-btn{opacity:1}
.card .edit-btn svg{width:13px; height:13px; stroke:var(--ink)}

.carousel-nav{
  flex:none;
  display:flex; align-items:center; justify-content:center; gap:1rem;
  margin-top:.4rem;
}
.nav-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--card-bg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:border-color .15s, transform .1s;
}
.nav-btn:hover{border-color:var(--yr-color)}
.nav-btn:active{transform:scale(.92)}
.nav-btn svg{width:16px; height:16px; stroke:var(--ink)}
.dots{display:flex; gap:.4rem; flex-wrap:wrap; max-width:220px; justify-content:center}
.dot{width:6px; height:6px; border-radius:50%; background:var(--line); cursor:pointer; transition:background .15s, transform .15s}
.dot[data-active="true"]{background:var(--yr-color); transform:scale(1.5)}

.click-hint{
  flex:none;
  text-align:center;
  font-size:.68rem; font-weight:500; letter-spacing:.09em;
  color:var(--ink-soft); opacity:.5;
  margin-top:.5rem;
  pointer-events:none;
}

/* ---------- detail panel ---------- */
.book-detail{
  flex:none;
  max-width:640px; width:100%; margin:.5rem auto 0;
  padding:0 1.5rem 1.6rem;   /* room to breathe under the Goodreads link */
  text-align:center;
}
.book-detail .d-period{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yr-color)}
.book-detail h3{font-size:1.25rem; font-weight:800; letter-spacing:-.01em; margin:.3rem 0 .15rem}
.book-detail .d-author{font-size:.9rem; color:var(--ink-soft); font-style:italic}
.book-detail .d-sub{font-size:.78rem; color:var(--ink-soft); margin-top:.35rem}
.book-detail .d-link{
  display:inline-block; margin-top:.5rem; font-size:.76rem; font-weight:600;
  color:var(--yr-color); text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px;
}

/* ---------- now panel ----------
   The site was otherwise entirely past tense: a complete record of what the
   club HAS read and no way to tell what it's reading right now. This is its
   own tab rather than a banner above the carousels on purpose — the year
   sections are height:100% and their card sizing measures the leftover
   vertical space, so anything stacked above them would eat into the covers
   on every year at once. A sibling section costs them nothing. */
.now-section{justify-content:center; overflow-y:auto}
.now-inner{width:100%; max-width:940px; margin:auto; padding:.5rem 0 1rem}
.now-kicker{
  font-size:.72rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--yr-color); margin-bottom:1.1rem;
}
.now-grid{display:flex; gap:2.4rem; align-items:center}
.now-cover{
  flex:none; width:220px; padding:0; border:none; background:none;
  border-radius:5px; overflow:hidden; box-shadow:var(--shadow-hi);
  cursor:zoom-in; transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.now-cover:hover{transform:translateY(-4px)}
.now-cover img{display:block; width:100%; aspect-ratio:2/3; object-fit:cover; background:#eee}
.now-info{min-width:0}
.now-period{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yr-color)}
.now-title{font-size:2rem; font-weight:800; letter-spacing:-.02em; margin:.3rem 0 .2rem; line-height:1.1}
.now-author{font-size:1rem; color:var(--ink-soft); font-style:italic}
.now-sub{font-size:.8rem; color:var(--ink-soft); margin-top:.4rem}
.now-teaser{font-size:.92rem; line-height:1.6; color:var(--ink); margin:1rem 0 0; max-width:52ch}
.now-meta-row{display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-top:1.2rem}
.now-pill{
  display:inline-block; padding:.42rem .85rem; border-radius:999px;
  background:color-mix(in srgb, var(--yr-color) 12%, transparent);
  color:var(--yr-color); font-size:.78rem; font-weight:700;
}
.now-date{font-size:.8rem; color:var(--ink-soft)}
.now-open{
  margin-top:1.2rem; padding:.6rem 1.1rem; border-radius:999px;
  border:1px solid var(--yr-color); background:none; color:var(--yr-color);
  font-family:inherit; font-size:.82rem; font-weight:600; cursor:pointer;
  transition:background .15s, color .15s;
}
.now-open:hover{background:var(--yr-color); color:#fff}
.now-next{
  display:flex; align-items:center; gap:.9rem;
  margin-top:2rem; padding-top:1.4rem; border-top:1px solid var(--line);
}
.now-next-label{
  font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-soft);
}
.now-next img{width:34px; height:51px; object-fit:cover; border-radius:3px; background:#eee}
.now-next-title{font-size:.88rem; font-weight:700}
.now-next-title span{font-weight:400; font-style:italic; color:var(--ink-soft)}
@media (max-width:760px){
  .now-grid{flex-direction:column; align-items:flex-start; gap:1.4rem}
  .now-cover{width:150px}
  .now-title{font-size:1.5rem}
}

/* ---------- favourites tab ---------- */
/* The tab is neutral ink rather than one of the year colours, because it cuts
   across every year; the per-row colour is that book's own year, so the list
   doubles as a colour map of when the club read each one. */
.faves-section{overflow:hidden}
.faves-scroll{flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; padding:.4rem 0 2.5rem}
.faves-inner{width:100%; max-width:860px; margin:0 auto}
.faves-block + .faves-block{margin-top:2.6rem; padding-top:2.2rem; border-top:1px solid var(--line)}
.faves-kicker{
  font-size:.72rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--yr-color);
}
.faves-head{font-size:1.6rem; font-weight:800; letter-spacing:-.02em; margin:.4rem 0 .35rem; line-height:1.15}
.faves-lede{font-size:.84rem; line-height:1.6; color:var(--ink-soft); margin:0 0 1.5rem; max-width:58ch}

/* John's shelf */
.shelf-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1.6rem}
.shelf-item{display:flex; gap:1.1rem; align-items:flex-start; width:100%; text-align:left;
  font-family:inherit; color:inherit; background:none; border:none; padding:0}
button.shelf-item{cursor:pointer}
.shelf-rank{
  flex:none; width:1.6rem; padding-top:.1rem; text-align:right;
  font-size:1rem; font-weight:800; color:var(--c); font-variant-numeric:tabular-nums;
}
.shelf-cover{flex:none; width:66px; border-radius:4px; overflow:hidden; box-shadow:var(--shadow-md); background:#eee}
.shelf-cover img{display:block; width:100%; aspect-ratio:2/3; object-fit:cover;
  transition:transform .25s cubic-bezier(.22,1,.36,1)}
button.shelf-item:hover .shelf-cover img{transform:scale(1.04)}
.shelf-body{min-width:0; flex:1 1 auto}
/* these are spans (a <button> may not contain block-level children in valid
   HTML), so each one has to be told to behave like a line of its own */
.shelf-title{display:block; font-size:1.02rem; font-weight:800; letter-spacing:-.01em; line-height:1.2}
.shelf-author{display:block; font-size:.8rem; color:var(--ink-soft); font-style:italic; margin-top:.15rem}
.shelf-note{display:block; font-size:.88rem; line-height:1.6; margin:.55rem 0 0; max-width:52ch}
.shelf-tag{
  display:inline-block; margin-top:.6rem; padding:.25rem .55rem; border-radius:4px;
  font-size:.68rem; font-weight:700; letter-spacing:.02em;
  color:var(--c); background:color-mix(in srgb, var(--c) 10%, var(--card-bg));
}

/* the club's verdict */
.fav-list{list-style:none; margin:0; padding:0}
.fav-row{
  display:flex; align-items:center; gap:.95rem; width:100%; text-align:left;
  padding:.65rem .55rem; border:none; border-bottom:1px solid var(--line);
  background:none; font-family:inherit; color:inherit; cursor:pointer; border-radius:8px;
  transition:background .15s;
}
.fav-row:hover{background:color-mix(in srgb, var(--c) 7%, transparent)}
.fav-rank{
  flex:none; width:1.5rem; text-align:right;
  font-size:.95rem; font-weight:800; color:var(--c); font-variant-numeric:tabular-nums;
}
.fav-cover{flex:none; width:38px; height:57px; object-fit:cover; border-radius:3px;
  background:#eee; box-shadow:var(--shadow-lo)}
.fav-main{flex:1 1 auto; min-width:0}
.fav-title{display:block; font-size:.93rem; font-weight:700; line-height:1.25}
.fav-author{display:block; font-size:.74rem; color:var(--ink-soft); margin-top:.12rem}
.fav-score{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:.22rem}
.fav-num{font-size:.76rem; font-weight:700; white-space:nowrap}
.fav-num small{font-weight:500; font-size:.72rem; color:var(--ink-soft)}
.fav-empty{font-size:.85rem; color:var(--ink-soft)}

/* what the club said — the same notes that live inside each book modal,
   gathered in one place so they're actually findable */
.cnote-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.9rem}
.cnote-card{
  display:flex; gap:1rem; align-items:flex-start; width:100%; text-align:left;
  padding:1rem 1.15rem; border:1px solid var(--line); border-radius:9px;
  background:var(--card-bg); font-family:inherit; color:inherit; cursor:pointer;
  transition:border-color .15s, background .15s;
}
.cnote-card:hover{border-color:color-mix(in srgb, var(--c) 45%, var(--line));
  background:color-mix(in srgb, var(--c) 4%, var(--card-bg))}
.cnote-cover{flex:none; width:44px; height:66px; object-fit:cover; border-radius:3px;
  background:#eee; box-shadow:var(--shadow-lo)}
.cnote-body{min-width:0; flex:1 1 auto}
.cnote-text{display:block; font-size:.9rem; line-height:1.6; font-style:italic}
.cnote-by{display:block; margin-top:.55rem; font-size:.75rem; color:var(--ink-soft)}
.cnote-by b{color:var(--ink); font-weight:700; font-style:normal}
.cnote-by .cnote-book{color:var(--c); font-weight:600}
.cnote-by .cnote-score{font-weight:700; color:var(--ink)}
.faves-more{
  margin-top:1.3rem; padding:.5rem 1rem; border-radius:999px;
  border:1px solid var(--line); background:none; color:var(--ink-soft);
  font-family:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
  transition:border-color .15s, color .15s;
}
.faves-more:hover{border-color:var(--ink-soft); color:var(--ink)}
@media (max-width:680px){
  .faves-inner{padding:0 .1rem}
  .shelf-cover{width:54px}
  .shelf-rank, .fav-rank{width:1.2rem}
  .fav-row{gap:.7rem; padding:.6rem .3rem}
  .fav-score .star-row{display:none}   /* the number carries it once space is tight */
}

/* ---------- nobel tab ---------- */
.nobel-section{overflow:hidden}
.nobel-scroll{flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; padding:.4rem 0 2.5rem}
.nobel-inner{width:100%; max-width:1180px; margin:0 auto}
.nob-grid{
  list-style:none; margin:0; padding:0;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:1.6rem 1.3rem;
}
.nob-card{
  display:block; width:100%; padding:0; border:none; background:none; text-align:left;
  font-family:inherit; color:inherit; cursor:pointer;
}
.nob-cover{
  position:relative; border-radius:5px; overflow:hidden; background:#eee;
  box-shadow:var(--shadow-md); transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;
}
.nob-card:hover .nob-cover{transform:translateY(-5px); box-shadow:var(--shadow-hi)}
.nob-cover img{display:block; width:100%; aspect-ratio:2/3; object-fit:cover}
.nob-badge{
  position:absolute; top:.45rem; left:.45rem;
  padding:.2rem .45rem; border-radius:4px;
  background:rgba(20,20,25,.72); color:#fff;
  font-size:.66rem; font-weight:700; letter-spacing:.02em;
  backdrop-filter:blur(2px);
}
.nob-flag{
  position:absolute; right:.45rem; bottom:.45rem; width:18px; height:18px; border-radius:50%;
  background:var(--bc); box-shadow:0 0 0 2px rgba(255,255,255,.85);
}
.nob-who{display:block; margin-top:.55rem; font-size:.8rem; font-weight:700; line-height:1.25}
.nob-work{display:block; margin-top:.1rem; font-size:.72rem; color:var(--ink-soft); font-style:italic; line-height:1.3}

/* prize toggle */
.prz-switch{display:inline-flex; gap:.35rem; margin-bottom:1.4rem; padding:.25rem;
  border:1px solid var(--line); border-radius:999px; background:var(--card-bg)}
.prz-tab{
  appearance:none; font:inherit; font-size:.82rem; font-weight:700;
  padding:.4rem 1rem; border-radius:999px; border:none; background:none;
  color:var(--ink-soft); cursor:pointer; transition:background .15s, color .15s;
}
.prz-tab:hover{color:var(--ink)}
.prz-tab[data-active="true"]{background:var(--pc); color:#fff}
.nob-foot:empty{display:none}

/* detail panel — same shell as the book modal, different innards */
.nm-kicker{font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--yr-color)}
.nm-name{font-size:1.7rem; font-weight:800; letter-spacing:-.02em; margin:.35rem 0 .2rem; line-height:1.15}
.nm-sub{font-size:.8rem; color:var(--ink-soft)}
.nm-cite{
  margin:1.1rem 0 0; padding:.9rem 1.1rem; border-radius:9px;
  background:color-mix(in srgb, var(--yr-color) 7%, var(--bg));
  font-size:.9rem; line-height:1.6; font-style:italic;
}
.nm-cite cite{display:block; margin-top:.5rem; font-style:normal; font-size:.72rem; color:var(--ink-soft)}
.nm-work{margin-top:1.4rem; padding-top:1.2rem; border-top:1px solid var(--line)}
.nm-work-head{font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft)}
.nm-work-title{font-size:1.05rem; font-weight:800; margin-top:.35rem}
.nm-teaser{font-size:.92rem; line-height:1.6; margin:.5rem 0 0}
.nm-links{display:flex; flex-wrap:wrap; gap:1.2rem; margin-top:1.4rem}
.nm-links a{
  font-size:.8rem; font-weight:600; color:var(--yr-color); text-decoration:none;
  border-bottom:1px solid currentColor; padding-bottom:1px;
}
.nm-read{
  display:inline-block; margin-top:1.2rem; padding:.5rem .8rem; border-radius:6px; border:none;
  background:color-mix(in srgb, var(--bc) 12%, var(--card-bg)); color:var(--bc);
  font-family:inherit; font-size:.75rem; font-weight:700; cursor:pointer;
}
.nm-read:hover{background:color-mix(in srgb, var(--bc) 22%, var(--card-bg))}
.nob-foot{
  margin-top:2.4rem; padding-top:1.4rem; border-top:1px solid var(--line);
  font-size:.8rem; line-height:1.7; color:var(--ink-soft);
}
.nob-foot button{
  border:none; background:none; padding:0; font:inherit; font-weight:700;
  color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);
}
.nob-foot button:hover{border-bottom-color:currentColor}
@media (max-width:680px){
  .nobel-inner{padding:0 .1rem}
  .nob-grid{grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:1.2rem .9rem}
  .nm-name{font-size:1.35rem}
}

/* ---------- squared-off year grid (opt-in with ?grid) ----------
   Deliberately reuses .nob-grid / .nob-card from the prize galleries rather
   than restyling: the whole point of the alternative is that a year should
   look like the rest of the site. */
.year-grid-scroll{flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; padding:.2rem 0 2rem}
.year-grid-inner{width:100%; max-width:1180px; margin:0 auto}
.year-grid-inner .nob-badge{background:color-mix(in srgb, var(--yr-color) 88%, #000)}
.card-break{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
  aspect-ratio:2/3; border-radius:5px; background:var(--card-bg);
  border:1px dashed var(--line); color:var(--ink-soft); text-align:center; padding:.8rem;
}
.card-break .p-title{font-size:.8rem; font-weight:700; color:var(--ink)}
.card-break .p-author{font-size:.72rem}

/* ---------- export modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; z-index:520;
  background:rgba(20,20,25,.45);
  display:none; align-items:center; justify-content:center; padding:1.5rem;
}
.modal-backdrop[data-show="true"]{display:flex}
.modal-box{background:#fff; border-radius:16px; padding:1.4rem; width:100%; max-width:480px; box-shadow:var(--shadow-hi)}
.modal-box .modal-title{font-weight:700; font-size:.95rem; margin-bottom:.6rem}
.modal-box textarea{
  width:100%; height:140px; font-family:monospace; font-size:.72rem;
  padding:.7rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  resize:vertical;
}
.modal-actions{display:flex; gap:.5rem; margin-top:.7rem; justify-content:flex-end}
.modal-actions button{
  font-size:.75rem; font-weight:600; padding:.5rem 1rem;
  border-radius:8px; border:1px solid var(--line); background:var(--card-bg); cursor:pointer;
}
.modal-actions button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}

/* ---------- book detail modal ---------- */
.book-modal{
  /* must clear the carousel cards, which carry inline z-index up to 100 */
  position:fixed; inset:0; z-index:500;
  background:rgba(18,18,24,.55);
  backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center;
  padding:1.5rem;
  opacity:0; transition:opacity .18s ease;
}
.book-modal[data-show="true"]{display:flex; opacity:1}
.book-panel{
  position:relative;
  background:var(--card-bg);
  border-radius:10px;
  width:100%; max-width:840px;
  max-height:88vh;
  overflow-y:auto;
  box-shadow:var(--shadow-hi);
  padding:2rem;
  transform:translateY(8px) scale(.985);
  transition:transform .22s cubic-bezier(.22,1,.36,1);
}
.book-modal[data-show="true"] .book-panel{transform:none}
.book-close{
  position:absolute; top:.9rem; right:.9rem;
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--card-bg);
  font-size:1.15rem; line-height:1; color:var(--ink-soft);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
/* step through the year's other books without leaving the modal — and without
   losing your place, see captureAnchor() */
.book-step{
  position:absolute; top:.9rem; right:3.4rem;
  display:flex; gap:.35rem;
}
.book-step button{
  width:34px; height:34px; border-radius:50%; padding:0;
  border:1px solid var(--line); background:var(--card-bg);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:border-color .15s;
}
.book-step button:hover{border-color:var(--yr-color)}
.book-step svg{
  width:15px; height:15px;
  fill:none; stroke:var(--ink-soft); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
@media (max-width:680px){
  .book-step{top:auto; bottom:.9rem; right:.9rem}
}
.book-close:hover{background:var(--bg)}
.book-grid{display:flex; gap:2rem; align-items:flex-start}
.book-grid .m-cover{
  flex:none; width:230px; aspect-ratio:2/3;
  border-radius:5px; overflow:hidden; background:#eee;
  box-shadow:var(--shadow-md);
}
.book-grid .m-cover img{width:100%; height:100%; object-fit:cover}
.book-info{flex:1 1 auto; min-width:0}
.book-info .m-period{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yr-color)}
.book-info h2{font-size:1.7rem; font-weight:900; letter-spacing:-.015em; line-height:1.15; margin:.35rem 0 .25rem}
.book-info .m-author{font-size:1rem; color:var(--ink-soft); font-style:italic}
.book-info .m-sub{font-size:.8rem; color:var(--ink-soft); margin-top:.45rem}

/* ---------- star ratings ----------
   Each row stacks two identical strips of 5 stars: a grey background strip and
   a gold foreground strip clipped to a % width. Clipping a continuous strip
   (rather than styling 5 separate icons) is what lets a value like 3.7 render
   as a genuinely partial star, and lets the input track the pointer smoothly. */
.m-rating{display:none; align-items:center; gap:.9rem; flex-wrap:wrap; margin-top:.85rem}
.m-rating[data-ready="true"]{display:flex}
.rating-avg{display:flex; align-items:center; gap:.5rem}
.rating-avg-text{font-size:.78rem; color:var(--ink-soft)}
.rating-yours{display:flex; align-items:center; gap:.5rem; padding-left:.9rem; border-left:1px solid var(--line)}
.rating-yours-label{font-size:.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em}
.star-row{position:relative; display:inline-block; line-height:0}
.star-row-bg, .star-row-fg{display:flex; gap:1px}
.star-row-fg{position:absolute; inset:0 auto 0 0; overflow:hidden; white-space:nowrap}
.star-row svg{width:16px; height:16px; flex:none}
.star-row-bg svg{fill:var(--line)}
.star-row-fg svg{fill:#f0a72e}
.rating-input .star-row{cursor:pointer}
.rating-input .star-row svg{width:19px; height:19px}
.rating-input .star-row-fg svg{fill:var(--yr-color)}
.rating-input:focus-visible .star-row{outline:2px solid var(--yr-color); outline-offset:3px; border-radius:3px}
.rating-yours-note{font-size:.72rem; font-weight:600; color:var(--ink-soft); opacity:0; transition:opacity .2s ease}
.rating-yours-note[data-show="true"]{opacity:1}
.rating-yours-note[data-error="true"]{color:#c0392b}

.m-genres{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.85rem}
.m-genres:empty{display:none}
.genre-tag{
  font-size:.7rem; font-weight:600; letter-spacing:.01em;
  color:var(--yr-color);
  background:color-mix(in srgb, var(--yr-color) 9%, var(--card-bg));
  padding:.28rem .6rem; border-radius:4px;
}
/* non-fiction rides in the same row as the genres, but neutral so it reads
   as a different kind of label rather than another genre */
.genre-tag.is-nf{
  color:var(--ink-soft);
  background:var(--bg);
  box-shadow:inset 0 0 0 1px var(--line);
}

.m-teaser{
  margin:1.1rem 0 0;
  font-size:.95rem; line-height:1.6; color:var(--ink);
  padding-left:.9rem; border-left:2px solid var(--yr-color);
}
.m-teaser:empty{display:none}

/* Sections used to be separated by 1.6rem while the items INSIDE them sat
   0.9rem apart — barely more space between two different sections than between
   two quotes in one, and both section heads styled identically, so the whole
   lower half of the modal read as one undifferentiated stream. A hairline rule
   plus real breathing room does the separating; the quotes themselves stay
   unboxed so the panel doesn't turn into a stack of cards. */
.m-blurbs{
  margin-top:1.9rem; padding-top:1.35rem;
  border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:1.2rem;
}
.m-blurbs .blurbs-head{
  font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
}
.blurb{margin:0}
.blurb q{font-size:.92rem; line-height:1.5; color:var(--ink); font-style:italic; quotes:'"' '"'}
.blurb cite{
  display:block; margin-top:.3rem;
  font-size:.75rem; font-style:normal; font-weight:600; color:var(--ink-soft);
}
/* ---------- club notes (one line per member, alongside their star rating) ---------- */
.m-notes{
  display:none;
  margin-top:1.9rem; padding-top:1.35rem;
  border-top:1px solid var(--line);
  flex-direction:column; gap:1rem;
}
.m-notes[data-ready="true"]{display:flex}
.notes-head{
  font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
}
.notes-list{display:flex; flex-direction:column; gap:.6rem}
.notes-list:empty{display:none}
/* Club notes DO get a panel, unlike the press quotes: they're a different kind
   of thing (members talking, not published criticism), the tint groups them
   against the white modal, and it gives the write-a-note form below something
   to belong to. Own note is marked by tinting the fill, not a colour stripe. */
.club-note{
  position:relative;
  display:flex; flex-direction:column; gap:.6rem;
  padding:1rem 1.15rem;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:9px;
}
/* Your own note is edited in place from this pencil rather than by leaving the
   write-form permanently open underneath, which just repeated the note you had
   already written. Same idiom as the cover-edit pencil on the carousel cards. */
.cn-edit{
  position:absolute; right:.6rem; bottom:.6rem;
  width:26px; height:26px; border-radius:50%; padding:0;
  border:1px solid var(--line); background:var(--card-bg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:border-color .15s;
}
.cn-edit:hover{border-color:var(--yr-color)}
.cn-edit svg{
  width:12px; height:12px;
  fill:none; stroke:var(--ink-soft); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
.club-note[data-mine="true"] .cn-by{padding-right:2.2rem}
.club-note[data-mine="true"]{
  background:color-mix(in srgb, var(--yr-color) 5%, var(--bg));
  border-color:color-mix(in srgb, var(--yr-color) 30%, var(--line));
}
/* italic to match the press quotes above — both are someone being quoted */
.club-note .cn-text{font-size:.92rem; line-height:1.6; color:var(--ink); font-style:italic}
/* the byline used to be one run of text ("John 5.0 · yours") sitting .3rem under
   the note, which read as cramped. Now three separately-weighted tokens spaced
   by flex gap, with real room above them. */
.club-note .cn-by{
  display:flex; align-items:baseline; gap:.55rem; flex-wrap:wrap;
  font-size:.74rem; font-weight:700; color:var(--ink-soft);
}
.club-note .cn-by .cn-score{color:var(--yr-color)}
.club-note .cn-by .cn-mine{font-weight:500; opacity:.6}
.notes-empty{font-size:.85rem; color:var(--ink-soft); font-style:italic}
.note-form{display:flex; flex-direction:column; gap:.5rem; margin-top:.2rem}
/* the score lives in the edit form too, so the pencil edits the whole review —
   score and note together — rather than only the words */
.note-rating-row{display:flex; align-items:center; gap:.7rem; margin-bottom:.15rem}
.note-rating-label{
  font-size:.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft);
}
.note-form input, .note-form textarea{
  font-family:inherit; font-size:.88rem; color:var(--ink);
  border:1px solid var(--line); border-radius:7px; padding:.55rem .7rem;
  background:var(--card-bg); resize:none; width:100%;
}
.note-form input:focus, .note-form textarea:focus{outline:none; border-color:var(--yr-color)}
.note-form input{max-width:220px}
.note-actions{display:flex; align-items:center; gap:.7rem; flex-wrap:wrap}
.note-count{font-size:.72rem; color:var(--ink-soft); margin-right:auto}
.note-state{font-size:.72rem; font-weight:600; color:var(--ink-soft); opacity:0; transition:opacity .2s}
.note-state[data-show="true"]{opacity:1}
.note-state[data-error="true"]{color:#c0392b}
.note-save{
  padding:.45rem .9rem; border-radius:999px; border:1px solid var(--yr-color);
  background:var(--yr-color); color:#fff;
  font-family:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
  transition:opacity .15s;
}
.note-save[disabled]{opacity:.4; cursor:not-allowed}
.note-cancel{
  border:none; background:none; padding:.45rem .2rem;
  font-family:inherit; font-size:.78rem; font-weight:600; color:var(--ink-soft);
  cursor:pointer;
}
.note-cancel:hover{color:var(--ink)}
.note-hint{font-size:.76rem; color:var(--ink-soft); font-style:italic}

.m-link{
  display:inline-block; margin-top:1.4rem; font-size:.8rem; font-weight:600;
  color:var(--yr-color); text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px;
}
@media (max-width:680px){
  .book-panel{padding:1.4rem}
  .book-grid{flex-direction:column; gap:1.2rem; align-items:center}
  .book-grid .m-cover{width:170px}
  .book-info{text-align:center}
  .m-teaser{text-align:left}
  .m-blurbs{text-align:left}
  .m-notes{text-align:left}
  .note-form input{max-width:none}
}

/* ---------- edit popover ---------- */
.edit-pop{
  position:absolute; z-index:540; width:220px;
  background:#fff; border-radius:12px; box-shadow:var(--shadow-hi);
  padding:.8rem; font-size:.75rem; display:none;
}
.edit-pop[data-show="true"]{display:block}
.edit-pop input{width:100%; font-size:.75rem; padding:.4rem .5rem; border-radius:6px; border:1px solid var(--line); margin-bottom:.4rem}
.edit-pop .row{display:flex; gap:.4rem}
.edit-pop button{flex:1; font-size:.7rem; font-weight:600; padding:.4rem; border-radius:6px; border:1px solid var(--line); background:var(--bg); cursor:pointer}
.edit-pop button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}

@media (max-width:560px){
  .brand small{display:none}
  .tg-link span{display:none}          /* icon only once space is tight */
  .tg-link{padding:.42rem .55rem}
}
</style>
</head>
<body>

<header class="topbar">
  <button type="button" class="brand" id="brandHome" aria-label="Back to what we're reading now"><span class="brand-name">book<span class="brand-42">42</span></span> <small>reading diary</small></button>
  <nav class="year-nav" id="yearNav"></nav>
  <a class="tg-link" href="https://t.me/book42channel" target="_blank" rel="noopener"
     title="Book42 on Telegram" aria-label="Book42 on Telegram">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    <span>Telegram</span>
  </a>
  <button class="editmode-btn" id="exportBtn" type="button" style="display:none">Export edits</button>
  <button class="editmode-btn" id="editModeBtn" type="button" style="display:none">Edit covers</button>
</header>

<main id="years"></main>

<div class="modal-backdrop" id="exportBackdrop">
  <div class="modal-box">
    <div class="modal-title">Your cover edits — paste this back to me to make permanent</div>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-actions">
      <button type="button" id="closeExportBtn">Close</button>
      <button type="button" class="primary" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<div class="book-modal" id="bookModal" aria-hidden="true">
  <div class="book-panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="book-close" id="bookClose" type="button" aria-label="Close">&times;</button>
    <div class="book-step" id="bookStep">
      <button type="button" id="bookPrev" aria-label="Previous book this year"></button>
      <button type="button" id="bookNext" aria-label="Next book this year"></button>
    </div>
    <div class="book-grid">
      <div class="m-cover"><img id="mCover" alt=""></div>
      <div class="book-info">
        <div class="m-period" id="mPeriod"></div>
        <h2 id="mTitle"></h2>
        <div class="m-author" id="mAuthor"></div>
        <div class="m-sub" id="mSub"></div>
        <div class="m-rating" id="mRating">
          <div class="rating-avg">
            <span class="star-row" id="ratingAvgStars" aria-hidden="true"></span>
            <span class="rating-avg-text" id="ratingAvgText"></span>
          </div>
          <div class="rating-yours">
            <span class="rating-yours-label">Your rating</span>
            <span class="star-row rating-input" id="ratingInput"
                  role="slider" tabindex="0" aria-label="Your rating"
                  aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="0"></span>
            <span class="rating-yours-note" id="ratingNote">Saved</span>
          </div>
        </div>
        <div class="m-genres" id="mGenres"></div>
        <p class="m-teaser" id="mTeaser"></p>
        <div class="m-blurbs" id="mBlurbs"></div>
        <div class="m-notes" id="mNotes">
          <div class="notes-head">What the club said</div>
          <div class="notes-list" id="notesList"></div>
          <div class="note-form" id="noteForm">
            <div class="note-rating-row">
              <span class="note-rating-label">Your score</span>
              <span class="star-row rating-input" id="noteRating"
                    role="slider" tabindex="0" aria-label="Your rating"
                    aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="0"></span>
            </div>
            <input type="text" id="noteName" maxlength="40" placeholder="Your name (optional)" autocomplete="name">
            <textarea id="noteText" maxlength="280" rows="2" placeholder="One line on what you thought…"></textarea>
            <div class="note-actions">
              <span class="note-count" id="noteCount">0/280</span>
              <span class="note-state" id="noteState"></span>
              <button type="button" class="note-cancel" id="noteCancel">Cancel</button>
              <button type="button" class="note-save" id="noteSave">Save note</button>
            </div>
          </div>
          <div class="note-hint" id="noteHint">Rate the book above to leave a note.</div>
        </div>
        <a class="m-link" id="mLink" target="_blank" rel="noopener">View on Goodreads &#8599;</a>
      </div>
    </div>
  </div>
</div>

<div class="edit-pop" id="editPop">
  <input type="text" id="editUrl" placeholder="Paste image URL…">
  <div class="row">
    <button type="button" id="editReset">Reset</button>
    <button type="button" class="primary" id="editApply">Use</button>
  </div>
