eet-orange-tree/"},{"quote":"Written with immense tenderness, My Sweet Orange Tree eschews simple nostalgia…","attribution":"The Irish Times","url":"https://pushkinpress.com/book/my-sweet-orange-tree/"},{"quote":"This is a story full of sorrowful tenderness. Little Zezé is so likeable","attribution":"Cao Wenxuan, winner of the Hans Christian Andersen Prize","url":"https://pushkinpress.com/book/my-sweet-orange-tree/"}],"genres":["Coming of Age","Literary Fiction","Brazilian"]},"Brave New World":{"teaser":"In a future World State, humans are bred in bottles, conditioned for contentment and kept docile by a drug called soma. One man begins to feel out of step.","blurbs":[{"quote":"A masterpiece of speculation... As vibrant, fresh, and somehow shocking…","attribution":"Margaret Atwood","url":"https://www.penguin.co.uk/books/56119/brave-new-world-by-aldous-huxley/9780099518471"},{"quote":"A grave warning... Provoking, stimulating, shocking and dazzling","attribution":"The Observer","url":"https://www.penguin.co.uk/books/56119/brave-new-world-by-aldous-huxley/9780099518471"},{"quote":"The most accomplished novel Huxley has yet written","attribution":"Rebecca West","url":"https://en.wikipedia.org/wiki/Brave_New_World"}],"genres":["Dystopia","Science Fiction","Classic"]},"Force of Nature":{"teaser":"Five colleagues set out on a corporate hiking retreat deep in the Australian bush. Only four walk out. Federal agent Aaron Falk has his own reason to care.","blurbs":[{"quote":"Jane Harper, the new Queen of Crime...Even more impressive than The Dry","attribution":"The Sunday Times","url":"https://www.waterstones.com/book/force-of-nature/jane-harper/9780349142128"},{"quote":"Powerful, intriguing and recommended...Harper is wonderful at evoking fear and unease","attribution":"The Times","url":"https://www.waterstones.com/book/force-of-nature/jane-harper/9780349142128"},{"quote":"Harper once again shows herself to be a storytelling force to be reckoned with","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781250105639"}],"genres":["Crime","Thriller"]},"The Murder of Roger Ackroyd":{"teaser":"In a quiet English village, a wealthy man is found stabbed in his study only hours after learning a dangerous secret. Hercule Poirot, retired next door, investigates.","blurbs":[{"quote":"A classic – the book has worthily earned its fame.","attribution":"Irish Independent","url":"https://www.waterstones.com/book/the-murder-of-roger-ackroyd/agatha-christie/9780007527526"},{"quote":"One of the landmarks of detective literature.","attribution":"H.R.F. Keating, Crime & Mystery: The 100 Best Books","url":"https://www.waterstones.com/book/the-murder-of-roger-ackroyd/agatha-christie/9780007527526"},{"quote":"Miss Christie is not only an expert technician and a remarkably good story-teller...","attribution":"The New York Times Book Review","url":"https://en.wikipedia.org/wiki/The_Murder_of_Roger_Ackroyd"}],"genres":["Crime","Golden Age Mystery","Classic"]},"Flowers for Algernon":{"teaser":"Charlie Gordon, a gentle bakery worker with an IQ of 68, volunteers for experimental surgery to make him clever. His own progress reports tell the story.","blurbs":[{"quote":"A masterpiece of poignant brilliance . . . heartbreaking, and utterly, completely brilliant","attribution":"The Guardian","url":"https://www.orionbooks.co.uk/titles/daniel-keyes/flowers-for-algernon-2/9781857989380/"},{"quote":"Strikingly original","attribution":"Publishers Weekly","url":"https://www.orionbooks.co.uk/titles/daniel-keyes/flowers-for-algernon-2/9781857989380/"},{"quote":"Heartbreaking and beautiful. Required reading, as far as I am concerned","attribution":"Wil Wheaton","url":"https://www.orionbooks.co.uk/titles/daniel-keyes/flowers-for-algernon-2/9781857989380/"}],"genres":["Science Fiction","Literary Fiction","Classic"]},"The Princess Bride":{"teaser":"Buttercup is the most beautiful woman in the world and her true love Westley is lost at sea. What follows involves pirates, giants, fencing, revenge and true love.","blurbs":[{"quote":"Nutball funny . . . A 'classic' medieval melodrama...","attribution":"Newsweek","url":"https://www.barnesandnoble.com/w/the-princess-bride-william-goldman/1100617233"},{"quote":"One of the most laconic, tightly-plotted tales of mythical morality you'll ever read","attribution":"Uncut","url":"https://www.waterstones.com/book/the-princess-bride/william-goldman/9780747545187"},{"quote":"There's nothing fluffy about The Princess Bride. The rocket-powered narrative tricks you...","attribution":"Neon","url":"https://www.waterstones.com/book/the-princess-bride/william-goldman/9780747545187"}],"genres":["Fantasy","Adventure","Comedy"]},"A Thousand Splendid Suns":{"teaser":"Two Afghan women, born a generation apart and strangers to each other, are thrown together in a single Kabul household as thirty years of war reshape their country.","blurbs":[{"quote":"A Thousand Splendid Suns is an ambitious work.","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/391566/a-thousand-splendid-suns-by-khaled-hosseini/"},{"quote":"Spectacular. . . . Hosseini's writing makes our hearts ache, our stomachs clench...","attribution":"USA Today","url":"https://www.penguinrandomhouse.com/books/391566/a-thousand-splendid-suns-by-khaled-hosseini/"},{"quote":"...a brave, honorable, big-hearted book","attribution":"The Washington Post Book World","url":"https://www.penguinrandomhouse.com/books/391566/a-thousand-splendid-suns-by-khaled-hosseini/"}],"genres":["Historical Fiction","Literary Fiction"]},"I'm Not Scared":{"teaser":"During a scorching 1978 summer, nine-year-old Michele roams the wheat fields around his tiny southern Italian village and stumbles on something hidden near an abandoned farmhouse.","blurbs":[{"quote":"A deft masterpiece with never a false note","attribution":"The Guardian","url":"https://canongate.co.uk/books/112-im-not-scared/"},{"quote":"The new Italian word for talent is Ammaniti","attribution":"The Times","url":"https://canongate.co.uk/books/112-im-not-scared/"},{"quote":"An exquisite parable","attribution":"Daily Telegraph","url":"https://canongate.co.uk/books/112-im-not-scared/"}],"genres":["Literary Thriller","Coming of Age","Italian Fiction"]},"Man's Search for Meaning":{"teaser":"A psychiatrist's account of surviving the Nazi concentration camps, and the therapy he built from it: the argument that our deepest drive is the search for meaning.","blurbs":[{"quote":"One of the great books of our time.","attribution":"Harold S. Kushner, author of When Bad Things Happen to Good People","url":"https://www.beacon.org/Mans-Search-for-Meaning-P602.aspx"},{"quote":"One of the outstanding contributions to psychological thought in the last fifty years.","attribution":"Carl R. Rogers","url":"https://www.beacon.org/Mans-Search-for-Meaning-P602.aspx"},{"quote":"[O]ne of the most significant books of the 20th century.","attribution":"O, the Oprah Magazine","url":"https://www.beacon.org/Mans-Search-for-Meaning-P602.aspx"}],"genres":["Memoir","Psychology"]},"Guards! Guards!":{"teaser":"Ankh-Morpork's shambolic Night Watch faces a dragon conjured by a secret society, reinforced by a hugely tall, dwarf-raised recruit who takes the law rather too seriously.","blurbs":[{"quote":"This is one of Pratchett's best books. Hilarious and highly recommended","attribution":"The Times","url":"https://www.penguin.co.uk/books/328779/guards-guards-by-terry-pratchett/9781804990674"},{"quote":"One of our greatest fantasists, and beyond a doubt the funniest","attribution":"George R.R. Martin","url":"https://www.penguin.co.uk/books/328779/guards-guards-by-terry-pratchett/9781804990674"},{"quote":"[Pratchett's] spectacular inventiveness makes the Discworld series one of the perennial joys of modern fiction","attribution":"Mail on Sunday","url":"https://www.penguin.co.uk/books/328779/guards-guards-by-terry-pratchett/9781804990674"}],"genres":["Fantasy","Comedy","Discworld"]},"A Gentleman in Moscow":{"teaser":"In 1922 an unrepentant Russian count is sentenced to house arrest in a grand Moscow hotel, and sets about making a life inside it while history churns outside.","blurbs":[{"quote":"The novel buzzes with the energy of numerous adventures, love affairs, [and] twists of fate.","attribution":"The Wall Street Journal","url":"https://www.penguinrandomhouse.com/books/311564/a-gentleman-in-moscow-by-amor-towles/"},{"quote":"How delightful that in an era as crude as ours this finely composed novel...","attribution":"The Washington Post","url":"https://www.penguinrandomhouse.com/books/311564/a-gentleman-in-moscow-by-amor-towles/"},{"quote":"This is an old fashioned sort of romance, filled with delicious detail.","attribution":"Louise Erdrich","url":"https://www.penguinrandomhouse.com/books/311564/a-gentleman-in-moscow-by-amor-towles/"}],"genres":["Historical Fiction","Literary Fiction"]},"Contact":{"teaser":"A radio astronomer hunting for extraterrestrial intelligence picks up an unmistakable signal from the star Vega, triggering a worldwide scientific, political and religious scramble to decode it.","blurbs":[{"quote":"The range and depth of ideas is quite uncommon","attribution":"The New York Times Book Review","url":"https://www.orbit-books.co.uk/titles/carl-sagan-4/contact/9780356518848/"},{"quote":"Sagan's informed and dramatically enacted speculations into the mysteries of the universe . . .","attribution":"Publishers Weekly","url":"https://www.orbit-books.co.uk/titles/carl-sagan-4/contact/9780356518848/"},{"quote":"Stunning and satisfying","attribution":"Los Angeles Times","url":"https://www.orbit-books.co.uk/titles/carl-sagan-4/contact/9780356518848/"}],"genres":["Science Fiction","First Contact"]},"My Brilliant Friend":{"teaser":"Two clever girls grow up in a poor, violent neighbourhood on the edge of 1950s Naples, their fierce friendship shaping them even as their futures start to diverge.","blurbs":[{"quote":"Ferrante has captured the intensity of childhood friendships – their all-consuming nature, the passions...","attribution":"The Guardian","url":"https://www.europaeditions.com/reviews/book/a75d5f12-500c-41ef-945a-01a401e449cf"},{"quote":"Cinematic in the density of its detail.","attribution":"Times Literary Supplement","url":"https://www.europaeditions.com/reviews/book/a75d5f12-500c-41ef-945a-01a401e449cf"},{"quote":"Ferrante, beautifully translated by Ann Goldstein...writes with a ferocious, intimate urgency.","attribution":"San Francisco Chronicle","url":"https://www.europaeditions.com/reviews/book/a75d5f12-500c-41ef-945a-01a401e449cf"}],"genres":["Literary Fiction","Coming of Age","Italian Fiction"]},"The House in the Cerulean Sea":{"teaser":"A rule-following caseworker for magical youth is sent to inspect a remote island orphanage housing six highly unusual children and their enigmatic guardian, and finds his careful world unsettled.","blurbs":[{"quote":"A witty, wholesome fantasy that's likely to cause heart-swelling","attribution":"The Washington Post","url":"https://www.waterstones.com/book/the-house-in-the-cerulean-sea/tj-klune/9781529087949"},{"quote":"I loved it. It is like being wrapped up in a big gay blanket.","attribution":"V. E. Schwab, author of Gallant","url":"https://www.waterstones.com/book/the-house-in-the-cerulean-sea/tj-klune/9781529087949"},{"quote":"This tale of found family is hopeful to its core.","attribution":"Publishers Weekly","url":"https://www.waterstones.com/book/the-house-in-the-cerulean-sea/tj-klune/9781529087949"}],"genres":["Fantasy","Romance","Feel-good"]},"The Story of a New Name":{"teaser":"The second Neapolitan novel follows Elena and Lila into young adulthood, as marriage, study and ambition pull the two friends along sharply different paths in and beyond Naples.","blurbs":[{"quote":"Imagine if Jane Austen got angry and you'll have some idea of how explosive...","attribution":"The Australian","url":"https://www.europaeditions.com/book/9781609451349/the-story-of-a-new-name"},{"quote":"one of the great novelists of our time","attribution":"The New York Times","url":"https://www.europaeditions.com/book/9781609451349/the-story-of-a-new-name"},{"quote":"Brilliant . . . captivating and insightful . . .","attribution":"Booklist (starred review)","url":"https://www.europaeditions.com/book/9781609451349/the-story-of-a-new-name"}],"genres":["Literary Fiction","Italian Fiction"]},"The Pleasures of Reading in an Age of Distraction":{"teaser":"A literature professor argues against dutiful, self-improving reading and makes the case for reading at whim: following delight and curiosity instead of lists, guilt or prescriptions.","blurbs":[{"quote":"Delightful yet discombobulating","attribution":"The Wall Street Journal","url":"https://www.waterstones.com/book/the-pleasures-of-reading-in-an-age-of-distraction/alan-jacobs/9780199747498"},{"quote":"what could be nicer to read than a book about how nice reading is?","attribution":"Steven Poole, The Guardian","url":"https://www.waterstones.com/book/the-pleasures-of-reading-in-an-age-of-distraction/alan-jacobs/9780199747498"},{"quote":"A vigorous and friendly exhortation to get back into the kind of reading...","attribution":"Library Journal","url":"https://www.waterstones.com/book/the-pleasures-of-reading-in-an-age-of-distraction/alan-jacobs/9780199747498"}],"genres":["Essays","Books About Books"]},"Billy Summers":{"teaser":"A sniper-for-hire with a personal code takes one last contract, moving into a quiet town under a false name and posing as a writer while he waits.","blurbs":[{"quote":"Murder most foul and mayhem most entertaining. Another worthy page-turner from a protean master.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/stephen-king/billy-summers/"},{"quote":"a dazzlingly shapeshifting novel that, like its antihero, only pretends to be easy to pigeonhole","attribution":"The Sunday Times","url":"https://bookmarks.reviews/reviews/billy-summers/"},{"quote":"…And it's [King's] best book in years","attribution":"The Guardian","url":"https://bookmarks.reviews/reviews/billy-summers/"}],"genres":["Thriller","Crime"]},"Moby-Dick":{"teaser":"Ishmael signs aboard the whaler Pequod and discovers that its captain, Ahab, has bent the whole voyage to one purpose: hunting the white whale that took his leg.","blurbs":[{"quote":"High philosophy, liberal feeling, abstruse metaphysics popularly phrased, soaring speculation, a style as many-coloured…","attribution":"London Morning Advertiser (1851)","url":"https://bookmarks.reviews/the-original-1851-reviews-of-moby-dick/"},{"quote":"the artist has succeeded in investing objects apparently the most unattractive with an absorbing fascination","attribution":"John Bull (1851)","url":"https://bookmarks.reviews/the-original-1851-reviews-of-moby-dick/"},{"quote":"surpasses any of the former productions of this highly successful author","attribution":"George Ripley, Harper's New Monthly Magazine (1851)","url":"https://bookmarks.reviews/the-original-1851-reviews-of-moby-dick/"}],"genres":["Classic","Adventure","Sea Story"]},"Beach Read":{"teaser":"A romance novelist who has stopped believing in love and a literary writer with writer's block end up neighbours for a summer, and dare each other to swap genres.","blurbs":[{"quote":"Readers are sure to fall hard for this meta, heartfelt take on the romance genre.","attribution":"Publishers Weekly (starred review)","url":"https://www.penguinrandomhouse.com/books/608898/beach-read-by-emily-henry/"},{"quote":"A heartfelt look at taking second chances, in life and in love.","attribution":"Kirkus Reviews","url":"https://www.penguinrandomhouse.com/books/608898/beach-read-by-emily-henry/"},{"quote":"That Henry can manage to both pack a fierce emotional wallop and spear literary posturing…","attribution":"Entertainment Weekly","url":"https://www.penguinrandomhouse.com/books/608898/beach-read-by-emily-henry/"}],"genres":["Romance","Contemporary"]},"The Silent Patient":{"teaser":"A celebrated London painter shoots her husband and then never speaks again. Years later a criminal psychotherapist takes a post at her secure unit, determined to make her talk.","blurbs":[{"quote":"That rarest of beasts: the perfect thriller.","attribution":"A. J. Finn, author of The Woman in the Window","url":"https://celadonbooks.com/book/the-silent-patient/"},{"quote":"Smart, sophisticated storytelling freighted with real suspense—a very fine novel by any standard.","attribution":"Lee Child","url":"https://celadonbooks.com/book/the-silent-patient/"},{"quote":"Alex Michaelides has written one of the best psychological thrillers I have ever read.","attribution":"Blake Crouch, author of Dark Matter","url":"https://celadonbooks.com/book/the-silent-patient/"}],"genres":["Psychological Thriller","Mystery"]},"Rock Paper Scissors":{"teaser":"A couple whose ten-year marriage is failing spend a weekend at a remote converted chapel in the Scottish Highlands. Both are keeping things back, and the snow is closing in.","blurbs":[{"quote":"This complicated gothic thriller of dueling spouses and homicidal writers is cleverly plotted…","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/alice-feeney/rock-paper-scissors-feeney/"},{"quote":"Feeney's signature misdirection sets up gasp-worthy twists down the stretch…","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781250266101"},{"quote":"This book was highly unpredictable with a unique premise.","attribution":"The Concord Insider","url":"https://www.theconcordinsider.com/2022/03/24/book-rock-paper-scissors/"}],"genres":["Psychological Thriller","Domestic Suspense"]},"Rebecca":{"teaser":"A shy young bride arrives at Manderley, her new husband's grand Cornish estate, and finds the house and its staff still ruled by the memory of his first wife.","blurbs":[{"quote":"One of the most influential novels of the twentieth century","attribution":"Sarah Waters","url":"https://www.virago.co.uk/titles/daphne-du-maurier-2/rebecca/9780349010267/"},{"quote":"Excellent entertainment... du Maurier created a scale by which modern women can measure their feelings.","attribution":"Stephen King","url":"https://www.hachettebookgroup.com/titles/daphne-du-maurier/rebecca/9780316575201/"},{"quote":"Rebecca is a masterpiece in which du Maurier pulls off several spectacular high-wire acts…","attribution":"Jim Crace, The Guardian","url":"https://www.virago.co.uk/titles/daphne-du-maurier-2/rebecca/9780349010267/"}],"genres":["Gothic","Suspense","Classic"]},"The Book Thief":{"teaser":"In Nazi Germany a foster girl outside Munich learns to read, steals books wherever she can find them, and shares them with the neighbours sheltering in the cellar. Death narrates.","blurbs":[{"quote":"Elegant, philosophical and moving...Beautiful and important.","attribution":"Kirkus Reviews (starred review)","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780375842207"},{"quote":"Brilliant and hugely ambitious…It's the kind of book that can be life-changing","attribution":"The New York Times","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780375842207"},{"quote":"Zusak doesn't sugarcoat anything, but he makes his ostensibly gloomy subject bearable…","attribution":"Time Magazine","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780375842207"}],"genres":["Historical Fiction","Second World War","Young Adult"]},"Call For The Dead":{"teaser":"A Foreign Office civil servant kills himself after a routine security interview, and George Smiley, quiet and unglamorous, refuses to accept the obvious explanation. Le Carré's first novel.","blurbs":[{"quote":"A subtle and acute story of counterespionage marked by restraint, indirection, and intelligence.","attribution":"The New York Times Book Review","url":"https://www.penguinrandomhouse.com/books/312131/call-for-the-dead-by-john-le-carre/"},{"quote":"Intelligent, thrilling, surprising … makes most cloak-and-dagger stuff taste of cardboard.","attribution":"Sunday Telegraph (London)","url":"https://www.penguinrandomhouse.com/books/312131/call-for-the-dead-by-john-le-carre/"},{"quote":"Brilliant. Realistic. Constant suspense…excellent writing.","attribution":"The Observer (London)","url":"https://www.penguinrandomhouse.com/books/312131/call-for-the-dead-by-john-le-carre/"}],"genres":["Spy Fiction","Crime"]},"The First Fifteen Lives of Harry August":{"teaser":"Harry August dies and is born again into the same life, over and over, remembering everything. In his eleventh life a dying girl brings him a message about the end of the world.","blurbs":[{"quote":"…is one of the top ten books I've ever read.","attribution":"James Dashner, author of The Maze Runner","url":"https://www.hachettebookgroup.com/titles/claire-north/the-first-fifteen-lives-of-harry-august/9780316399623/"},{"quote":"An astonishing re-invention of the time travel narrative. Bold, magical and masterful.","attribution":"Mike Carey","url":"https://www.hachettebookgroup.com/titles/claire-north/the-first-fifteen-lives-of-harry-august/9780316399623/"},{"quote":"A subtle study of friendship, love and the complexity of existence.","attribution":"Eric Brown, The Guardian","url":"https://www.hachettebookgroup.com/titles/claire-north/the-first-fifteen-lives-of-harry-august/9780316399623/"}],"genres":["Science Fiction","Time Loop"]},"One Hundred Years of Solitude":{"teaser":"Seven generations of the Buendía family rise and fall in Macondo, the remote town they founded, where the miraculous and the everyday are impossible to tell apart.","blurbs":[{"quote":"The greatest novel in any language of the last 50 years","attribution":"Salman Rushdie","url":"https://www.penguin.com.au/books/one-hundred-years-of-solitude-9780241968581"},{"quote":"Should be required reading for the entire human race","attribution":"The New York Times","url":"https://www.penguin.com.au/books/one-hundred-years-of-solitude-9780241968581"},{"quote":"The book that sort of saved my life","attribution":"Emma Thompson","url":"https://www.penguin.com.au/books/one-hundred-years-of-solitude-9780241968581"}],"genres":["Magical Realism","Classic","Latin American"]},"The Wind-Up Bird Chronicle":{"teaser":"An unemployed Tokyo man's search for his wife's missing cat pulls him into a widening mystery of strange callers, dry wells and unresolved wartime history.","blurbs":[{"quote":"Dreamlike and compelling…. Murakami is a genius.","attribution":"Chicago Tribune","url":"https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/"},{"quote":"Seductive…. A labyrinth designed by a master, at once familiar and irresistibly strange.","attribution":"San Francisco Chronicle","url":"https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/"},{"quote":"A significant advance in Murakami's art … a bold and generous book.","attribution":"The New York Times Book Review","url":"https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/"}],"genres":["Magical Realism","Literary Fiction","Japanese Fiction"]},"East of Eden":{"teaser":"In California's Salinas Valley, two families across three generations replay the rivalry of Cain and Abel, wrestling with inheritance, jealousy and whether a person can choose to be good.","blurbs":[{"quote":"A novel planned on the grandest possible scale . . .","attribution":"The New York Herald Tribune","url":"https://www.penguinrandomhouse.com/books/354458/east-of-eden-by-john-steinbeck-introduction-by-david-wyatt-suggestions-for-further-explorationby-susan-shillinglaw/"},{"quote":"A fantasia and myth . . . A strange and original work of art","attribution":"The New York Times Book Review","url":"https://www.penguinrandomhouse.com/books/354458/east-of-eden-by-john-steinbeck-introduction-by-david-wyatt-suggestions-for-further-explorationby-susan-shillinglaw/"},{"quote":"A moving, crying pageant with wilderness strengths.","attribution":"Carl Sandburg","url":"https://www.penguinrandomhouse.com/books/354458/east-of-eden-by-john-steinbeck-introduction-by-david-wyatt-suggestions-for-further-explorationby-susan-shillinglaw/"}],"genres":["Literary Fiction","Family Saga","Classic"]},"Of Mice and Men":{"teaser":"Two migrant ranch hands, quick-witted George and the powerful, gentle Lennie, drift through Depression-era California chasing a shared dream of a small farm of their own.","blurbs":[{"quote":"Of Mice and Men is a thriller, a gripping tale running to novelette length…","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/354251/of-mice-and-men-by-john-steinbeck/"},{"quote":"Brutality and tenderness mingle in these strangely moving pages.","attribution":"Chicago Tribune","url":"https://www.penguinrandomhouse.com/books/354251/of-mice-and-men-by-john-steinbeck/"},{"quote":"A short tale of much power and beauty.","attribution":"Times Literary Supplement [London]","url":"https://www.penguinrandomhouse.com/books/354251/of-mice-and-men-by-john-steinbeck/"}],"genres":["Classic","Literary Fiction","Novella"]},"The Seven Husbands of Evelyn Hugo":{"teaser":"A reclusive Hollywood legend finally agrees to tell her life story, choosing an unknown magazine journalist to hear the truth behind her glamorous career and seven marriages.","blurbs":[{"quote":"Reid's heroine reveals her darkest secrets as if she were wiping off makeup…","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/taylor-jenkins-reid/the-seven-husbands-of-evelyn-hugo/"},{"quote":"Riveting, heart-wrenching and full of Old Hollywood glamour","attribution":"BuzzFeed","url":"https://www.simonandschuster.co.uk/books/The-Seven-Husbands-of-Evelyn-Hugo/Taylor-Jenkins-Reid/9781398515697"},{"quote":"This wildly addictive journey of a reclusive Hollywood starlet and her tumultuous Tinseltown journey…","attribution":"PopSugar","url":"https://www.simonandschuster.co.uk/books/The-Seven-Husbands-of-Evelyn-Hugo/Taylor-Jenkins-Reid/9781398515697"}],"genres":["Historical Fiction","Romance"]},"The Boy, the Mole, the Fox and the Horse":{"teaser":"An illustrated book of brief, hand-lettered conversations between four unlikely friends, wandering through ink-and-watercolour landscapes and talking about kindness, fear, courage and asking for help.","blurbs":[{"quote":"Simply, the world needs Charlie's work right now.","attribution":"Miranda Hart","url":"https://www.penguin.co.uk/books/439667/the-boy-the-mole-the-fox-and-the-horse-by-mackesy-charlie/9781529105100"},{"quote":"A wonderful work of art and a wonderful window into the human heart.","attribution":"Richard Curtis","url":"https://www.penguin.co.uk/books/439667/the-boy-the-mole-the-fox-and-the-horse-by-mackesy-charlie/9781529105100"},{"quote":"Those in need of peace will find it between the covers…","attribution":"The New York Times","url":"https://www.penguin.co.uk/books/439667/the-boy-the-mole-the-fox-and-the-horse-by-mackesy-charlie/9781529105100"}],"genres":["Illustrated","Philosophy","Feel-good"]},"Happy Place":{"teaser":"Harriet and Wyn broke up months ago but never told their closest friends, so they fake being a couple through one last annual week together in Maine.","blurbs":[{"quote":"This has the makings of a rom-com classic.","attribution":"Publishers Weekly","url":"https://www.penguinrandomhouse.com/books/704944/happy-place-by-emily-henry/"},{"quote":"Another knock-out from the champ. The woman doesn't miss.","attribution":"Taylor Jenkins Reid","url":"https://www.penguinrandomhouse.com/books/704944/happy-place-by-emily-henry/"},{"quote":"Henry's latest rom-com is a charming, heartwarming read about second-chance romance.","attribution":"USA Today","url":"https://www.penguinrandomhouse.com/books/704944/happy-place-by-emily-henry/"}],"genres":["Romance","Contemporary"]},"The Bitch":{"teaser":"On Colombia's storm-battered Pacific coast, a childless woman living in poverty takes in an orphaned puppy, and the fierce bond that grows between them unsettles everything around her.","blurbs":[{"quote":"Unforgettable. . . a powerful, jolting tale about class, motherhood and rage.","attribution":"The Guardian","url":"https://www.barnesandnoble.com/w/the-bitch-pilar-quintana/1133785089"},{"quote":"A perfect book.","attribution":"Kiran Desai, author of The Loneliness of Sonia and Sunny","url":"https://www.barnesandnoble.com/w/the-bitch-pilar-quintana/1133785089"},{"quote":"A somber and sensitive dog-and-owner tale scrubbed clean of the genre's usual sweetness.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/pilar-quintana/bitch-quintana/"}],"genres":["Literary Fiction","Colombian","Novella"]},"The Paper Menagerie and Other Stories":{"teaser":"Fifteen speculative short stories ranging across science fiction, fantasy and alternate history, returning again and again to family, memory, immigration and the weight of the past.","blurbs":[{"quote":"I have never been so moved by a collection of short fiction.","attribution":"Amal El-Mohtar, NPR","url":"https://www.npr.org/2016/03/13/468942030/no-paper-tiger-this-menagerie-is-full-of-fierce-feeling"},{"quote":"Gracefully written and often profoundly moving, these stories are high-water marks of contemporary speculative fiction.","attribution":"Publishers Weekly (starred review)","url":"https://kenliu.name/blog/book/the-paper-menagerie-and-other-stories/"},{"quote":"These remarkable stories highlight Liu's themes of family, love, and…","attribution":"Library Journal (starred review)","url":"https://kenliu.name/blog/book/the-paper-menagerie-and-other-stories/"}],"genres":["Science Fiction","Short Stories","Fantasy"]},"A Man Called Ove":{"teaser":"A curmudgeonly Swedish widower with strong opinions about rules, cars and neighbours finds his rigid solitude repeatedly invaded by the boisterous young family who move in next door.","blurbs":[{"quote":"...it would be hard to beat grumpy Ove and his hidden, generous heart.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/fredrik-backman/a-man-called-ove/"},{"quote":"...a fuzzy crowd-pleaser that serves up laughs to accompany a thoughtful reflection on loss...","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781476738024"},{"quote":"It's warm, funny, and ultimately almost unbearably moving.","attribution":"Daily Mail","url":"https://www.hachette.com.au/fredrik-backman/a-man-called-ove-the-global-bestselling-phenomenon"}],"genres":["Contemporary Fiction","Humour","Feel-good"]},"We Have Always Lived in the Castle":{"teaser":"Merricat Blackwood lives with her adored sister Constance and ailing uncle in a grand house shunned by the nearby village, until a cousin arrives and unsettles their cloistered routine.","blurbs":[{"quote":"Her greatest book ... at once whimsical and harrowing","attribution":"Donna Tartt","url":"https://www.penguin.co.uk/books/133431/we-have-always-lived-in-the-castle-by-jackson-shirley/9780241685044"},{"quote":"...you have missed out on something marvellous.","attribution":"Neil Gaiman","url":"https://www.penguin.co.uk/books/133431/we-have-always-lived-in-the-castle-by-jackson-shirley/9780241685044"},{"quote":"A masterpiece of Gothic suspense.","attribution":"Joyce Carol Oates","url":"https://www.penguin.co.uk/books/133431/we-have-always-lived-in-the-castle-by-jackson-shirley/9780241685044"}],"genres":["Gothic","Mystery","Classic"]},"How to Know a Person":{"teaser":"Brooks argues that truly seeing another person is a learnable skill, drawing on psychology, philosophy and his own failures to offer practical ways to listen, converse and understand.","blurbs":[{"quote":"A hands-on guide to making meaningful human connections.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/david-brooks/how-to-know-a-person/"},{"quote":"Original and useful… Brooks is a chatty, likeable guide","attribution":"The TLS (Times Literary Supplement)","url":"https://www.penguin.com.au/books/how-to-know-a-person-9780241670293"},{"quote":"I raced through the book, which is well-structured and engagingly written","attribution":"Sophie McBain, The New Statesman","url":"https://www.penguin.com.au/books/how-to-know-a-person-9780241670293"}],"genres":["Psychology","Relationships"]},"The Secret History":{"teaser":"A scholarship student joins an elite, insular circle of classics undergraduates at a small Vermont college, where an intoxicating world of Greek and privilege drifts toward moral catastrophe.","blurbs":[{"quote":"Powerful . . . Enthralling . . . A ferociously well-paced entertainment.","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/176619/the-secret-history-by-donna-tartt/"},{"quote":"A beautifully written story, well-told, funny, sad, scary, and impossible to leave alone...","attribution":"John Grisham","url":"https://www.penguinrandomhouse.com/books/176619/the-secret-history-by-donna-tartt/"},{"quote":"A smart, craftsman-like, viscerally compelling novel.","attribution":"Time","url":"https://www.penguinrandomhouse.com/books/176619/the-secret-history-by-donna-tartt/"}],"genres":["Literary Fiction","Dark Academia","Mystery"]},"The Stranger":{"teaser":"In French Algiers, an emotionally detached young clerk drifts through his mother's funeral, an easy love affair, and a sun-struck act of violence that leaves society to judge his indifference.","blurbs":[{"quote":"Matthew Ward has done Camus and us a great service.","attribution":"Chicago Sun-Times","url":"https://www.penguinrandomhouse.com/books/23477/the-stranger-by-albert-camus-translated-by-matthew-ward-introduction-by-keith-gore/"},{"quote":"No book in contemporary literature points with such soberness and directness...","attribution":"The New Republic","url":"https://newrepublic.com/article/115492/albert-camus-stranger"}],"genres":["Classic","Philosophical Fiction","Existentialism"]},"The Remains of the Day":{"teaser":"An ageing English butler takes a motoring holiday through the West Country in 1956, reflecting on decades of service at Darlington Hall and on the housekeeper he once worked beside.","blurbs":[{"quote":"An intricate and dazzling novel.","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/85611/the-remains-of-the-day-by-kazuo-ishiguro-introduction-by-salman-rushdie/"},{"quote":"A perfect novel. I couldn't put it down.","attribution":"Ann Beattie","url":"https://www.penguinrandomhouse.com/books/85611/the-remains-of-the-day-by-kazuo-ishiguro-introduction-by-salman-rushdie/"},{"quote":"Brilliant and quietly devastating.","attribution":"Newsweek","url":"https://www.penguinrandomhouse.com/books/85611/the-remains-of-the-day-by-kazuo-ishiguro-introduction-by-salman-rushdie/"}],"genres":["Literary Fiction","Historical Fiction"]},"Solaris":{"teaser":"A psychologist arrives at a research station orbiting a planet covered by a vast, possibly sentient ocean, where the crew are being confronted by impossible visitors drawn from their memories.","blurbs":[{"quote":"It all gleams with portent.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/stanislaw-lem/solaris/"},{"quote":"A novel that makes you reevaluate the nature of intelligence itself.","attribution":"Anne McCaffrey","url":"https://www.abebooks.com/9780156027601/Solaris-Novel-Lem-Stanislaw-0156027607/plp"},{"quote":"Solaris, a quintessential novel of science fiction's New Wave movement...","attribution":"Reactor","url":"https://reactormag.com/2019/08/01/embracing-the-impossible-puzzle-of-stanislaw-lems-solaris/"}],"genres":["Science Fiction","Philosophical Fiction"]},"Piranesi":{"teaser":"A man lives alone in an infinite labyrinth of statue-filled halls washed by tides, keeping meticulous journals, until signs of another presence begin to unsettle his ordered world.","blurbs":[{"quote":"Weird and haunting and excellent.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/susanna-clarke/piranesi/"},{"quote":"...sure to be recognized as one of the year's most inventive novels.","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781635575637"},{"quote":"rich, wondrous, full of aching joy and sweet sorrow","attribution":"The New York Times Book Review","url":"https://bookmarks.reviews/reviews/all/piranesi/"}],"genres":["Fantasy","Mystery","Literary Fiction"]},"The Nightingale":{"teaser":"Two French sisters take very different paths through the Nazi occupation, one sheltering her family in an occupied village, the other drawn into dangerous resistance work.","blurbs":[{"quote":"Hannah's latest is a page-turner that will no doubt have readers reaching for tissues.","attribution":"Booklist","url":"https://kristinhannah.com/books/the-nightingale/praise/"},{"quote":"...a respectful and absorbing page-turner.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/kristin-hannah/the-nightingale-hannah/"},{"quote":"The author ably depicts war's horrors through the eyes of these two women...","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9780312577223"}],"genres":["Historical Fiction","Second World War"]},"Spring Snow":{"teaser":"Tokyo, 1912. Kiyoaki Matsugae, the beautiful and aloof son of a newly ennobled family, realises far too late what he feels for Satoko, the aristocratic girl promised elsewhere.","blurbs":[{"quote":"An austere love story, probably my favourite of his novels","attribution":"David Mitchell, Independent on Sunday","url":"https://www.penguin.co.uk/books/1091191/spring-snow-by-mishima-yukio/9780099282990"},{"quote":"Perfect beauty…. A classic of Japanese literature.","attribution":"Chicago Sun-Times","url":"https://www.penguinrandomhouse.com/books/115345/spring-snow-by-yukio-mishima/"},{"quote":"Mishima's novels exude a monstrous and compulsive weirdness...","attribution":"Angela Carter","url":"https://www.penguin.co.uk/books/1091191/spring-snow-by-mishima-yukio/9780099282990"}],"genres":["Literary Fiction","Japanese Fiction","Historical Fiction"]},"I Who Have Never Known Men":{"teaser":"A girl who has never known the world above is caged underground with thirty-nine women who remember it. She alone keeps asking why.","blurbs":[{"quote":"A consistently gripping experience.","attribution":"TLS","url":"https://www.transitbooks.org/books/iwhohaveneverknownmen"},{"quote":"the book's austere mystery...provides a richly allusive consideration of human life.","attribution":"Deborah Eisenberg, The New York Review of Books","url":"https://www.transitbooks.org/books/iwhohaveneverknownmen"},{"quote":"[I] couldn't put it down. . . It's a deceptively simple but wholly propulsive story","attribution":"Laila Lalami, author of The Dream Hotel","url":"https://www.transitbooks.org/books/iwhohaveneverknownmen"}],"genres":["Dystopia","Speculative Fiction","Literary Fiction"]},"Journey by Moonlight":{"teaser":"On his Italian honeymoon, a respectable Budapest bourgeois slips away from his new wife and drifts back toward the intoxicating friends of his youth.","blurbs":[{"quote":"No one who has read it has failed to love it.","attribution":"Nicholas Lezard, The Guardian","url":"https://parnassusbooks.net/book/9781590177730"},{"quote":"A stealthy masterpiece...both comic and beautiful.","attribution":"The Telegraph","url":"https://parnassusbooks.net/book/9781590177730"},{"quote":"A writer of immense subtlety and generosity...","attribution":"Ali Smith","url":"https://parnassusbooks.net/book/9781590177730"}],"genres":["Literary Fiction","Hungarian","Classic"]},"The Mountains Sing":{"teaser":"Across the twentieth century in Hanoi, a grandmother tells her granddaughter how the Trần family survived land reform, famine and war, one story at a time.","blurbs":[{"quote":"A sweeping tale of one family's shifting fortunes in Vietnam across half a century...","attribution":"Kirkus Reviews","url":"https://www.hachettebookgroup.com/titles/que-mai-phan-nguyen/the-mountains-sing/9781643751351/"},{"quote":"This brilliant, unsparing love letter to Vietnam will move readers.","attribution":"Publishers Weekly","url":"https://www.hachettebookgroup.com/titles/que-mai-phan-nguyen/the-mountains-sing/9781643751351/"},{"quote":"an epic account of Việt Nam's painful 20th century history...","attribution":"Viet Thanh Nguyen, author of The Sympathizer","url":"https://www.hachettebookgroup.com/titles/que-mai-phan-nguyen/the-mountains-sing/9781643751351/"}],"genres":["Historical Fiction","Family Saga","Vietnamese"]},"Circe":{"teaser":"Born a slighted daughter of the sun god and exiled to a lonely island, the witch Circe teaches herself sorcery as gods and mortals wash up on her shore.","blurbs":[{"quote":"An epic spanning thousands of years that's also a keep-you-up-all-night page turner.","attribution":"Ann Patchett","url":"https://madelinemiller.com/circe/"},{"quote":"A bold and subversive retelling of the goddess's story...","attribution":"The New York Times","url":"https://madelinemiller.com/circe/"},{"quote":"Luminous... Deft and compassionate... A compelling and engagingly feminist piece of ancient fantasy.","attribution":"Daily Telegraph","url":"https://madelinemiller.com/circe/"}],"genres":["Mythology","Fantasy","Historical Fiction"]},"The Count of Monte Cristo":{"teaser":"A young sailor on the eve of everything he wants is denounced by jealous friends and imprisoned without trial, and begins to imagine a reckoning.","blurbs":[{"quote":"A piece of perfect storytelling.","attribution":"Robert Louis Stevenson","url":"https://www.penguinrandomhouse.com/books/286345/the-count-of-monte-cristo-by-alexandre-dumas-pere-translated-with-an-introduction-and-notes-by-robin-buss-cover-ilustration-by-coralie-bickford-smith/"},{"quote":"Dumas was . . . a summit of art.","attribution":"George Bernard Shaw","url":"https://parnassusbooks.net/book/9780553213508"},{"quote":"No matter how many times I revisit it, I find new lines to appreciate...","attribution":"V. E. Schwab, The New York Times Book Review","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780140449266"}],"genres":["Classic","Adventure","Revenge"]},"Wuthering Heights":{"teaser":"A foundling brought home to a bleak Yorkshire farmhouse forms a bond with the daughter of the house that outlasts cruelty, class and two generations.","blurbs":[{"quote":"It is as if she could tear up all that we know human beings by...","attribution":"Virginia Woolf","url":"https://parnassusbooks.net/book/9780375756443"},{"quote":"Only Emily Brontë exposes her imagination to the dark spirit.","attribution":"V.S. Pritchett","url":"https://parnassusbooks.net/book/9780375756443"},{"quote":"the first novel I've read for an age, and the best...","attribution":"Dante Gabriel Rossetti","url":"https://en.wikipedia.org/wiki/Wuthering_Heights"}],"genres":["Gothic","Classic","Romance"]},"The Tokyo Zodiac Murders":{"teaser":"An eccentric artist is found dead in a locked studio, his diary describing a macabre scheme involving seven young women. Forty years later, an astrologer reopens the case.","blurbs":[{"quote":"An ebullient mystery classic that foreshadows the subgenre of intricate 'how-dunits.'","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/soji-shimada/the-tokyo-zodiac-murders/"},{"quote":"The solution is one of the most original that I've ever read","attribution":"Anthony Horowitz","url":"https://www.londonreviewbookshop.co.uk/stock/the-tokyo-zodiac-murders-soji-shimada"},{"quote":"The great Soji Shimada virtually invented the 'logic problem' sub-genre.","attribution":"The Guardian","url":"https://www.penguinrandomhouse.com/books/250981/the-tokyo-zodiac-murders-by-soji-shimada/"}],"genres":["Crime","Locked Room Mystery","Japanese Fiction"]},"Stoner":{"teaser":"The son of Missouri farmers discovers English literature almost by accident and stays at the university for life, quietly weathering a cold marriage and departmental warfare.","blurbs":[{"quote":"something rarer than a great novel — it is a perfect novel...","attribution":"Morris Dickstein, The New York Times Book Review","url":"https://www.nyrb.com/products/stoner"},{"quote":"It is a marvelous discovery for everyone who loves literature.","attribution":"Ian McEwan, BBC Radio 4","url":"https://www.nyrb.com/products/stoner"},{"quote":"One of the great forgotten novels of the past century.","attribution":"Colum McCann, The Guardian","url":"https://www.nyrb.com/products/stoner"}],"genres":["Literary Fiction","Campus Novel","Classic"]},"The Dispossessed":{"teaser":"A brilliant physicist from a poor anarchist moon becomes the first in generations to cross to the rich, propertied world his people once abandoned.","blurbs":[{"quote":"A seamless creation: every thing is made up, nothing seems arbitrary.","attribution":"The New York Times Book Review","url":"https://prologuebookshop.com/book/9780060512750"},{"quote":"This remains a challenging and urgent book.","attribution":"The Guardian","url":"https://prologuebookshop.com/book/9780060512750"},{"quote":"One of the great American political novels.","attribution":"Los Angeles Review of Books","url":"https://prologuebookshop.com/book/9780060512750"}],"genres":["Science Fiction","Utopian Fiction","Political"]},"The Song of Achilles":{"teaser":"Patroclus, an exiled prince, is taken in by Achilles, the golden son of a sea goddess. Their bond deepens as Greece marches on Troy and prophecy closes in.","blurbs":[{"quote":"A captivating retelling of the Iliad and events leading up to it...","attribution":"Donna Tartt, The Times","url":"https://madelinemiller.com/the-song-of-achilles/"},{"quote":"...a startlingly original work of art by an incredibly talented new novelist.","attribution":"Ann Patchett","url":"https://madelinemiller.com/the-song-of-achilles/"},{"quote":"A ravishingly vivid and convincing version of one of the most legendary of love stories.","attribution":"Emma Donoghue","url":"https://madelinemiller.com/the-song-of-achilles/"}],"genres":["Mythology","Historical Fiction","Romance"]}};

/* ---------- Nobel Prize in Literature ----------

const NOBEL = [{"y":2025,"name":"László Krasznahorkai","born":1954,"country":"Hungary","cite":"for his compelling and visionary oeuvre that, in the midst of apocalyptic terror, reaffirms the power of art","book":"Satantango","teaser":"On a collapsing collective farm in rain-soaked Hungary the villagers are waiting to leave, when a man they had believed dead walks back in promising deliverance.","cover":"covers/nobel/2025.jpg","wiki":"https://en.wikipedia.org/wiki/László_Krasznahorkai","genres":["Literary Fiction","Hungarian","Apocalyptic"]},{"y":2024,"name":"Han Kang","born":1970,"country":"South Korea","cite":"for her intense poetic prose that confronts historical traumas and exposes the fragility of human life","book":"The Vegetarian","teaser":"After a violent dream a quiet Seoul housewife stops eating meat. Her refusal hardens, and the attempts to force her back are told by the three people closest to her.","cover":"covers/nobel/2024.jpg","wiki":"https://en.wikipedia.org/wiki/Han_Kang","genres":["Literary Fiction","Korean","Psychological"]},{"y":2023,"name":"Jon Fosse","born":1959,"country":"Norway","cite":"for his innovative plays and prose which give voice to the unsayable","book":"Septology","teaser":"An ageing painter in western Norway looks at an unfinished canvas and, across seven parts and almost no full stops, keeps meeting a version of himself who made every other choice.","cover":"covers/nobel/2023.jpg","wiki":"https://en.wikipedia.org/wiki/Jon_Fosse","genres":["Literary Fiction","Norwegian","Stream of Consciousness"]},{"y":2022,"name":"Annie Ernaux","born":1940,"country":"France","cite":"for the courage and clinical acuity with which she uncovers the roots, estrangements and  collective restraints of personal memory","book":"The Years","teaser":"Six decades of French life told through a collective “we”, tracking a woman and a country from postwar rationing to the internet without ever saying “I”.","cover":"covers/nobel/2022.jpg","wiki":"https://en.wikipedia.org/wiki/Annie_Ernaux","genres":["Memoir","French","Autofiction"]},{"y":2021,"name":"Abdulrazak Gurnah","born":1948,"country":"Zanzibar","cite":"for his uncompromising and compassionate penetration of the effects of colonialism and the fate of the refugee in the gulf between cultures and continents","now":"Tanzania","book":"Paradise","teaser":"A boy in colonial East Africa is handed to a merchant to settle his father's debt, and travels inland with a trading caravan on the eve of the First World War.","cover":"covers/nobel/2021.jpg","wiki":"https://en.wikipedia.org/wiki/Abdulrazak_Gurnah","genres":["Historical Fiction","East African","Coming of Age"]},{"y":2020,"name":"Louise Glück","born":1943,"country":"USA","cite":"for her unmistakable poetic voice that with austere beauty makes individual existence universal","died":2023,"book":"The Wild Iris","teaser":"A garden speaks. Flowers, a gardener and a distant, unreliable god argue about suffering and renewal across a single New England growing season.","cover":"covers/nobel/2020.jpg","wiki":"https://en.wikipedia.org/wiki/Louise_Glück","genres":["Poetry","American","Nature"]},{"y":2019,"name":"Peter Handke","born":1942,"country":"Austria","cite":"for an influential work that with linguistic ingenuity has explored the periphery and the specificity of human experience","book":"A Sorrow Beyond Dreams","teaser":"Written weeks after his mother's suicide, Handke tries to reconstruct her life in rural Austria and keeps catching himself turning her into a literary figure.","cover":"covers/nobel/2019.jpg","wiki":"https://en.wikipedia.org/wiki/Peter_Handke","genres":["Memoir","Austrian","Grief"]},{"y":2018,"name":"Olga Tokarczuk","born":1962,"country":"Poland","cite":"for a narrative imagination that with encyclopedic passion represents the crossing of boundaries as a form of life","book":"The Books of Jacob","teaser":"The eighteenth-century mystic Jacob Frank declares himself the messiah and leads thousands of Polish Jews across borders, faiths and empires. The pages are numbered backwards.","cover":"covers/nobel/2018.jpg","wiki":"https://en.wikipedia.org/wiki/Olga_Tokarczuk","genres":["Historical Fiction","Polish","Epic"]},{"y":2017,"name":"Kazuo Ishiguro","born":1954,"country":"Japan","cite":"who, in novels of great emotional force, has uncovered the abyss beneath our illusory sense of connection with the world","book":"The Remains of the Day","teaser":"An English butler drives west in 1956 and reviews a lifetime of service to a man he chose not to see clearly, and a housekeeper he never spoke to honestly.","cover":"covers/nobel/2017.jpg","wiki":"https://en.wikipedia.org/wiki/Kazuo_Ishiguro","genres":["Literary Fiction","Historical Fiction"]},{"y":2016,"name":"Bob Dylan","born":1941,"country":"USA","cite":"for having created new poetic expressions within the great American song tradition","book":"Chronicles: Volume One","teaser":"Dylan's own account of arriving in New York in 1961, and of two later moments when he had to rebuild what he was doing from almost nothing.","cover":"covers/nobel/2016.jpg","wiki":"https://en.wikipedia.org/wiki/Bob_Dylan","genres":["Memoir","American","Music"]},{"y":2015,"name":"Svetlana Alexievich","born":1948,"country":"Ukraine","cite":"for her polyphonic writings, a monument to suffering and courage in our time","book":"Second-hand Time","teaser":"Hundreds of ordinary Soviet citizens describe, in their own words, what happened to them when the country they had been built for stopped existing.","cover":"covers/nobel/2015.jpg","wiki":"https://en.wikipedia.org/wiki/Svetlana_Alexievich","genres":["Oral History","Belarusian","Soviet Union"]},{"y":2014,"name":"Patrick Modiano","born":1945,"country":"France","cite":"for the art of memory with which he has evoked the most ungraspable human destinies and\r\nuncovered the life-world of the occupation","book":"Missing Person","teaser":"A detective with amnesia investigates the only case that matters, his own identity, through the paper trail of occupied Paris.","cover":"covers/nobel/2014.jpg","wiki":"https://en.wikipedia.org/wiki/Patrick_Modiano","genres":["Literary Fiction","French","Memory"]},{"y":2013,"name":"Alice Munro","born":1931,"country":"Canada","cite":"master of the contemporary short story","died":2024,"book":"Dear Life","teaser":"Fourteen stories set mostly in small-town Ontario, where a decision made in one afternoon turns out to have been the whole of a life.","cover":"covers/nobel/2013.jpg","wiki":"https://en.wikipedia.org/wiki/Alice_Munro","genres":["Short Stories","Canadian","Small Town"]},{"y":2012,"name":"Mo Yan","born":1956,"country":"China","cite":"who with hallucinatory realism merges folk tales, history and the contemporary","book":"Red Sorghum","teaser":"Three generations of a family in a sorghum-growing county in Shandong, from bandit romance to the Japanese invasion, pieced together by a grandson.","cover":"covers/nobel/2012.jpg","wiki":"https://en.wikipedia.org/wiki/Mo_Yan","genres":["Historical Fiction","Chinese","Magical Realism"]},{"y":2011,"name":"Tomas Tranströmer","born":1931,"country":"Sweden","cite":"because, through his condensed, translucent images, he gives us fresh access to reality","died":2015,"book":"The Half-Finished Heaven","teaser":"Poems that begin in an ordinary Swedish afternoon, a car, a hospital corridor, a frozen lake, and open without warning onto something vast.","cover":"covers/nobel/2011.jpg","wiki":"https://en.wikipedia.org/wiki/Tomas_Tranströmer","genres":["Poetry","Swedish","Nature"]},{"y":2010,"name":"Mario Vargas Llosa","born":1936,"country":"Peru","cite":"for his cartography of structures of power and his trenchant images of the individual's resistance, revolt, and defeat","died":2025,"book":"The Feast of the Goat","teaser":"The last day of the Trujillo dictatorship in the Dominican Republic, seen by the dictator, by his assassins waiting in a car, and by a woman returning after thirty-five years.","cover":"covers/nobel/2010.jpg","wiki":"https://en.wikipedia.org/wiki/Mario_Vargas_Llosa","genres":["Historical Fiction","Peruvian","Political"]},{"y":2009,"name":"Herta Müller","born":1953,"country":"Romania","cite":"who, with the concentration of poetry and the frankness of prose, depicts the landscape of the dispossessed","book":"The Land of Green Plums","teaser":"Four young friends under Ceaușescu try to keep speaking honestly to each other while the state sets out to make that impossible.","cover":"covers/nobel/2009.jpg","wiki":"https://en.wikipedia.org/wiki/Herta_Müller","genres":["Literary Fiction","Romanian","Dictatorship"]},{"y":2008,"name":"Jean-Marie Gustave Le Clézio","born":1940,"country":"France","cite":"author of new departures, poetic adventure and sensual ecstasy, explorer of a humanity beyond and below the reigning civilization","book":"Desert","teaser":"Two stories braided together: a Saharan people driven north by colonial troops in 1909, and a girl from a shanty town who becomes briefly, uselessly famous in Marseille.","cover":"covers/nobel/2008.jpg","wiki":"https://en.wikipedia.org/wiki/J._M._G._Le_Clézio","genres":["Literary Fiction","French","Colonialism"]},{"y":2007,"name":"Doris Lessing","born":1919,"country":"Persia","cite":"that epicist of the female experience, who with scepticism, fire and visionary power has subjected a divided civilisation to scrutiny","died":2013,"now":"Iran","book":"The Golden Notebook","teaser":"A writer keeps four separate notebooks to stop her life fragmenting, and the novel takes them apart to show what the effort costs her.","cover":"covers/nobel/2007.jpg","wiki":"https://en.wikipedia.org/wiki/Doris_Lessing","genres":["Literary Fiction","British","Feminism"]},{"y":2006,"name":"Orhan Pamuk","born":1952,"country":"Turkey","cite":"who in the quest for the melancholic soul of his native city has discovered new symbols for the clash and interlacing of cultures","book":"My Name Is Red","teaser":"A miniaturist is murdered in 1590s function slug(b){
  return (b.year+'-'+b.period+'-'+(b.title||'break')).toLowerCase().replace(/[^a-z0-9]+/g,'-');
}

/* Every slug that names a real pick. Rows in the ratings table that match
   nothing here (a slug left over from testing, a book since removed from DATA)
   are dropped on the way in, so they can't quietly skew the club leaderboard. */
const VALID_SLUGS = new Set(DATA.filter(b=>!b.break).map(slug));

/* ---------- star ratings (Supabase, no accounts) ----------
   Anyone can rate; a random id cached in this browser's localStorage identifies
   the DEVICE, not a person, so a return visit updates its own vote instead of
   duplicating it. That's the whole boundary a no-login system can offer — see
   the RLS policies in supabase_setup.sql for the actual enforcement.
   SUPABASE_URL/SUPABASE_ANON_KEY start blank; until they're filled in, the
   feature just stays invisible (see .m-rating[data-ready]) — the rest of the
   site works exactly as before. */
const SUPABASE_URL = 'https://uovqsqnxcgvefxpxntcj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VTOzRUebaH_xQAs4wngfug_jCVCeCFB';
const RATINGS_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

const VOTER_KEY = 'jpbooks-voter-id';
function getVoterId(){
  let id = localStorage.getItem(VOTER_KEY);
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'v-'+Date.now()+'-'+Math.random().toString(16).slice(2));
    localStorage.setItem(VOTER_KEY, id);
  }
  return id;
}

const STAR_PATH = 'M12 2.5l2.9 6.06 6.6.82-4.85 4.6 1.28 6.6L12 17.5l-5.93 3.08 1.28-6.6L2.5 9.38l6.6-.82Z';
function starRowSVG(){
  return Array.from({length:5}, ()=>`<svg viewBox="0 0 24 24"><path d="${STAR_PATH}"/></svg>`).join('');
}
function starRowHTML(){
  return `<span class="star-row-bg">${starRowSVG()}</span><span class="star-row-fg" style="width:0%">${starRowSVG()}</span>`;
}
function setStarFill(rowEl, fraction){
  const fg = rowEl && rowEl.querySelector('.star-row-fg');
  if(fg) fg.style.width = (Math.max(0, Math.min(1, fraction)) * 100) + '%';

let ratingsCache = {};             // bookSlug -> { sum, count, mine }
let ratingsVoters = 0;             // how many distinct devices have rated anything
let notesCache = {};               // bookSlug -> [{ name, text, rating, at, mine }] newest first
let currentModalSlug = null;       // which book the open modal's rating row talks to
let currentModalBook = null;

/* A note lives on the same row as its author's rating: same (book_slug, voter_id)
   primary key, so one person gets one rating and one note per book and a return
   visit edits both rather than piling up duplicates. That's also why a rating is
   required before a note — `rating` is NOT NULL, and "here's a score, here's why"
   is the shape the club actually wants anyway. */
const NAME_KEY = 'jpbooks-display-name';
const NOTE_MAX = 280;
let editingNote = false;   // is the write-form open on top of your existing note?
/* The score being edited in the form. Unlike the star row at the top of the
   modal (which commits the instant you click, so a first rating is one tap),
   this one is a draft: it saves with the note on Update, and Cancel throws it
   away along with the text. That's what makes the pencil "edit my review"
   rather than "edit my words". */
let draftRating = 0;
const RATING_COLS = 'book_slug,voter_id,rating';
const NOTE_COLS   = RATING_COLS + ',comment,display_name,updated_at';
/* Flips to false if the comment/display_name columns aren't in the table yet, so
   the site can ship ahead of the migration without the notes request taking the
   ratings down with it. */
let notesAvailable = true;

async function loadRatings(){
  if(!RATINGS_ENABLED) return;
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
  try{
    let res = await fetch(`${SUPABASE_URL}/rest/v1/book_ratings?select=${NOTE_COLS}`, { headers });
    if(!res.ok){
      // most likely the notes columns don't exist yet — fall back to ratings alone
      notesAvailable = false;
      res = await fetch(`${SUPABASE_URL}/rest/v1/book_ratings?select=${RATING_COLS}`, { headers });
      if(!res.ok) return;
    }
    const rows = await res.json();
    const me = getVoterId();
    const next = {}, nextNotes = {};
    const voters = new Set();
    rows.forEach(r=>{
      if(!VALID_SLUGS.has(r.book_slug)) return;   // not a book on this site
      voters.add(r.voter_id);
      const s = next[r.book_slug] || (next[r.book_slug] = {sum:0, count:0, mine:0});
      s.sum += Number(r.rating); s.count += 1;
      const isMine = r.voter_id === me;
      if(isMine) s.mine = Number(r.rating);
      const text = (r.comment || '').trim();
      if(text){
        (nextNotes[r.book_slug] || (nextNotes[r.book_slug] = [])).push({
          name: (r.display_name || '').trim() || 'Anonymous',
          text, rating: Number(r.rating), at: r.updated_at || '', mine: isMine
        });
      }
    });
    Object.values(nextNotes).forEach(list => list.sort((a,b)=> (b.at||'').localeCompare(a.at||'')));
    ratingsCache = next;
    notesCache = nextNotes;
    ratingsVoters = voters.size;
  } catch(e){ /* offline, or not configured yet — the widget just stays hidden this visit */ }
  // a modal may already be open and waiting on this fetch to resolve
  if(currentModalBook){
    renderRatingUI(currentModalBook, currentModalSlug);
    renderNotesUI(currentModalSlug);
  }
  renderFaves();   // the club leaderboard is nothing but this data, sorted
}

function aggFor(bslug){
  return ratingsCache[bslug] || (ratingsCache[bslug] = {sum:0, count:0, mine:0});
}

function renderRatingUI(book, bslug){
  const wrap = document.getElementById('mRating');
  if(!RATINGS_ENABLED){ wrap.dataset.ready = 'false'; return; }
  wrap.dataset.ready = 'true';

  const agg = aggFor(bslug);
  const avg = agg.count ? agg.sum / agg.count : 0;

  const avgRow = document.getElementById('ratingAvgStars');
  avgRow.innerHTML = starRowHTML();
  setStarFill(avgRow, avg / 5);
  document.getElementById('ratingAvgText').textContent =
    agg.count ? `${avg.toFixed(1)} (${agg.count} rating${agg.count===1?'':'s'})` : 'No ratings yet';

  const inputRow = document.getElementById('ratingInput');
  inputRow.innerHTML = starRowHTML();
  setStarFill(inputRow, (agg.mine || 0) / 5);
  inputRow.setAttribute('aria-valuenow', agg.mine || 0.5);
  inputRow.setAttribute('aria-valuetext', agg.mine ? `${agg.mine} stars` : 'not yet rated');
  const note = document.getElementById('ratingNote');
  note.dataset.show = 'false';
  note.dataset.error = 'false';
}

async function commitRating(value){
  if(!currentModalSlug) return;
  const slug = currentModalSlug, book = currentModalBook;
  const note = document.getElementById('ratingNote');

  submitRatingLocal(slug, value);           // optimistic cache update, instant
  draftRating = value;                      // keep the form's score in step with the top row
  renderRatingUI(book, slug);
  note.textContent = 'Saving…';
  note.dataset.show = 'true';

  const ok = await submitRatingRemote(slug, value);   // the actual network write — this is the part
                                                        // that used to be silently fire-and-forget, so a
                                                        // quick refresh right after tapping (very natural
                                                        // "did that save?" behaviour) could cancel it before
                                                        // it landed, with the UI having already claimed success
  if(currentModalSlug !== slug) return;   // the visitor moved on to another book while this was in flight

  if(ok){
    note.dataset.error = 'false';
    note.textContent = 'Saved';
    renderNotesUI(slug);   // first rating on this book unlocks the note form
    clearTimeout(commitRating._t);
    commitRating._t = setTimeout(()=>{ note.dataset.show = 'false'; }, 1800);
  } else {
    note.dataset.error = 'true';
    note.textContent = 'Not saved — tap a star to retry';
    // left showing (no auto-hide) so a real failure is visible instead of silently vanishing
  }
}

function submitRatingLocal(bookSlug, value){
  const agg = aggFor(bookSlug);
  agg.sum += agg.mine ? (value - agg.mine) : value;
  if(!agg.mine) agg.count += 1;
  agg.mine = value;
}

async function submitRatingRemote(bookSlug, value, attempt){
  if(!RATINGS_ENABLED) return true;   // nothing to persist to — the local-only cache is the whole story
  attempt = attempt || 1;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/book_ratings`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ book_slug: bookSlug, voter_id: getVoterId(), rating: value })
    });
    if(!res.ok){
      console.error('rating save failed', res.status, await res.text().catch(()=>''));
      return false;
    }
    return true;
  } catch(e){
    console.error('rating save failed (network)', e);
    if(attempt < 2) return submitRatingRemote(bookSlug, value, attempt + 1);  // one retry for a transient blip
    return false;
  }
}

/* Notes are typed by anonymous visitors and rendered back to every other
   visitor, so every field goes through here before it touches innerHTML. */
function escHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderNotesUI(bslug){
  const wrap = document.getElementById('mNotes');
  if(!RATINGS_ENABLED || !notesAvailable || !bslug){ wrap.dataset.ready = 'false'; return; }
  wrap.dataset.ready = 'true';

  const list = notesCache[bslug] || [];
  const mine = list.find(n=>n.mine);
  // while editing, your own note is replaced by the form rather than shown twice
  document.getElementById('notesList').innerHTML = list
    .filter(n => !(n.mine && editingNote))
    .map(n=>`
    <div class="club-note" data-mine="${n.mine ? 'true' : 'false'}">
      <div class="cn-text">${escHTML(n.text)}</div>
      <div class="cn-by">
        <span class="cn-name">${escHTML(n.name)}</span>
        <span class="cn-score">${n.rating.toFixed(1)}</span>
        ${n.mine ? '<span class="cn-mine">yours</span>' : ''}
      </div>
      ${n.mine ? `<button type="button" class="cn-edit" aria-label="Edit your note">${ICON_PENCIL}</button>` : ''}
    </div>`).join('');

  const nameEl = document.getElementById('noteName');
  const textEl = document.getElementById('noteText');
  const savedName = localStorage.getItem(NAME_KEY) || '';
  nameEl.value = (mine && mine.name !== 'Anonymous') ? mine.name : savedName;
  textEl.value = mine ? mine.text : '';
  updateNoteCount();

  // a note rides on a rating row, so there has to be a rating first; once you
  // have a note the form stays closed until the pencil opens it
  const rated = !!aggFor(bslug).mine;
  const showForm = rated && (!mine || editingNote);
  document.getElementById('noteForm').style.display = showForm ? 'flex' : 'none';
  if(showForm){
    const rr = document.getElementById('noteRating');
    rr.innerHTML = starRowHTML();
    setStarFill(rr, (draftRating || 0) / 5);
    rr.setAttribute('aria-valuenow', draftRating || 0);
  }
  document.getElementById('noteHint').style.display = rated ? 'none' : 'block';
  document.getElementById('noteCancel').style.display = (mine && editingNote) ? 'inline' : 'none';
  document.getElementById('noteSave').textContent = mine ? 'Update note' : 'Save note';

  const state = document.getElementById('noteState');
  state.dataset.show = 'false';
  state.dataset.error = 'false';
}

function updateNoteCount(){
  const len = document.getElementById('noteText').value.length;
  document.getElementById('noteCount').textContent = `${len}/${NOTE_MAX}`;
}

async function commitNote(){
  if(!currentModalSlug) return;
  const slug = currentModalSlug;
  const agg = aggFor(slug);
  if(!agg.mine) return;                     // no rating row to attach the note to yet

  const state = document.getElementById('noteState');
  const btn = document.getElementById('noteSave');
  const text = document.getElementById('noteText').value.trim().slice(0, NOTE_MAX);
  const name = document.getElementById('noteName').value.trim().slice(0, 40);
  const prevMine = agg.mine;
  const rating = draftRating || prevMine;   // the score as edited in this form
  localStorage.setItem(NAME_KEY, name);

  /* Same honesty rule the star rating had to learn: never say "Saved" until the
     POST has actually come back, or a visitor who taps and immediately refreshes
     gets told it worked while the request dies with the page. */
  btn.disabled = true;
  state.dataset.error = 'false';
  state.dataset.show = 'true';
  state.textContent = 'Saving…';

  const ok = await submitNoteRemote(slug, rating, text, name);
  btn.disabled = false;
  if(currentModalSlug !== slug) return;     // moved on to another book mid-flight

  if(ok){
    // the same write carries the score, so fold any change into the average too
    if(rating !== prevMine){
      submitRatingLocal(slug, rating);
      renderRatingUI(currentModalBook, slug);
    }
    const rest = (notesCache[slug] || []).filter(n=>!n.mine);
    if(text) rest.unshift({ name: name || 'Anonymous', text, rating, at: new Date().toISOString(), mine: true });
    notesCache[slug] = rest;
    editingNote = false;                    // saved, so collapse back to the note card
    renderNotesUI(slug);                    // this resets the state line, so set it after
    state.dataset.show = 'true';
    state.textContent = text ? 'Saved' : 'Note removed';
    clearTimeout(commitNote._t);
    commitNote._t = setTimeout(()=>{ state.dataset.show = 'false'; }, 1800);
  } else {
    state.dataset.error = 'true';
    state.textContent = 'Not saved — try again';
  }
}

function ratingValueFromEvent(rowEl, e){
  const r = rowEl.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const frac = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return Math.max(0.5, Math.min(5, Math.ceil(frac * 10) / 2));   // snapped to the nearest half star
}

const MONTH_NAMES = ['january','february','march','april','may','june','july',
                     'august','september','october','november','december'];
function periodStartMonth(b){
  const p = String(b.period || '').toLowerCase();
  const q = p.match(/quarter\s*([1-4])/);
  if(q) return (Number(q[1]) - 1) * 3;
  const m = MONTH_NAMES.findIndex(name => p.startsWith(name));
  return m < 0 ? 0 : m;
}
function isUpcoming(b){
  const now = new Date();
  // compared by month, not by day: a book is "current" for the whole of its month
  return (b.year * 12 + periodStartMonth(b)) > (now.getFullYear() * 12 + now.getMonth());
}

function countdownFor(iso){
  if(!iso) return null;
  const when = new Date(iso);
  if(isNaN(when)) return null;
  const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  // counted in whole calendar days, so "tomorrow" means tomorrow's date, not 24 hours
  const days = Math.round((midnight(when) - midnight(new Date())) / 86400000);
  const label = days > 1  ? `Discussion in ${days} days`
              : days === 1 ? 'Discussion tomorrow'
              : days === 0 ? 'Discussion today'
              : 'Last discussed';
  const hasTime = when.getHours() || when.getMinutes();
  const date = when.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'})
             + (hasTime ? ', ' + when.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}) : '');
  return { label, date };
}

/* ---------- favourites tab ----------
   Two answers to the same question. The top half is John's own shelf, kept by
   hand in SHELF. The bottom half is the club's, and is derived entirely from
   the ratings table — nothing to maintain, it just tracks whatever people vote. */

/* A straight average puts a book with one five-star vote above a book four
   people loved, which is not what "the club's favourite" means. So the ORDER
   uses the standard weighted average — a book is pulled toward the site-wide
   mean until enough people have voted on it — while the number on screen stays
   the real average, because that's the honest thing to show. */
const FAV_PRIOR = 3;    // votes' worth of pull toward the mean
const FAV_TOP   = 10;
/* The ranked list also asks for a second opinion. With a dozen readers, one
   person's five stars is a personal favourite, not the club's verdict — those
   books are still all there behind "show all", counted honestly. */
const FAV_MIN_N = 2;

function clubRanking(){
  const rows = [];
  let sum = 0, count = 0;
  DATA.forEach(b=>{
    if(b.break) return;
    const agg = ratingsCache[slug(b)];
    if(!agg || !agg.count) return;
    sum += agg.sum; count += agg.count;
    rows.push({ book:b, avg: agg.sum / agg.count, n: agg.count });
  });
  const mean = count ? sum / count : 0;
  rows.forEach(r=>{ r.weighted = (r.n * r.avg + FAV_PRIOR * mean) / (r.n + FAV_PRIOR); });
  rows.sort((a,b)=> b.weighted - a.weighted || b.n - a.n || a.book.title.localeCompare(b.book.title));
  return { rows, count, mean };
}

/* A shelf entry that names a Book42 pick inherits everything from DATA, so the
   usual entry is just a title and a line; anything else has to bring its own. */
function shelfEntries(){
  return SHELF.map(item=>{
    const pick = DATA.find(b=>!b.break && b.title === item.title) || null;
    return {
      title: item.title,
      author: item.author || (pick ? pick.author : ''),
      cover: item.cover || (pick ? coverFor(pick) : null),
      note: item.note || '',
      pick
    };
  });
}

/* ---------- Prizes tab ----------
   Two prizes, one tab, one gallery component. They are shaped differently on
   purpose: the Nobel honours a writer, so its card leads with the laureate and
   carries one representative book; the Booker honours a book, so its card leads
   with the title. Everything else — grid, panel, club cross-links — is shared. */

/* Accents and initials are enough to tie a Book42 author to a laureate:
   "J. M. Coetzee" and "John Maxwell Coetzee" share a surname and a first
   initial, while two different writers sharing a surname almost never do. */
function plainName(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // strip combining accents
            .toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function sameAuthor(a, b){
  const x = plainName(a).split(' '), y = plainName(b).split(' ');
  if(!x[0] || !y[0]) return false;
  return x[x.length-1] === y[y.length-1] && x[0][0] === y[0][0];
}
function plainTitle(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}

/* laureate name -> the club's picks by that author, across ALL laureates since
   1901, so a pick by a pre-1984 winner still gets credited in the footnote */
const laureateReads = {};
DATA.forEach(b=>{
  if(b.break) return;
  NOBEL_NAMES.forEach(pair=>{
    if(sameAuthor(b.author, pair[1])){
      (laureateReads[pair[1]] || (laureateReads[pair[1]] = [])).push({ book:b, nobelYear:pair[0] });
    }
  });
});

function lifeLine(e){
  const where = e.country + (e.now ? ` (now ${e.now})` : '');
  const when  = e.died ? `${e.born}–${e.died}` : `b. ${e.born}`;
  return `${where} · ${when}`;
}
// "a, b and c" rather than a bare comma list, since these read as a sentence
function listJoin(parts){
  if(parts.length < 2) return parts.join('');
  return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length-1];
}

   tabs use. Opt in with ?grid on the URL (same idiom as ?edit) so both can be

const GRID_YEARS = new URLSearchParams(location.search).has('grid');

years.forEach(y=>{
  /* The newest year is the one still in progress, so it opens on the most
     recent pick — you land on "what we're reading now". Finished years stay in
     reading order, which is how a diary reads back. */
  const isCurrentYear = (y === years[0]);

    ? DATA.filter(b=>b.year===y).slice().reverse()

                aria-label="${escHTML(b.title)}, ${escHTML(b.period)} ${y}">
              <span class="nob-cover">
                ${cover ? `<img src="${cover}" alt="${escHTML(b.title)} cover" loading="lazy" decoding="async">` : ''}
                <span class="nob-badge">${escHTML(b.period)}</span>

    yearsRoot.appendChild(sec);
