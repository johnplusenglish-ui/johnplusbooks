       with no-op render/layout rather than being absent. */
    carousels[y] = { items, active:0, cardEls:[], render(){}, layout(){} };
    return;
  }

  const section = document.createElement('section');
  section.className = 'year-section';
  section.id = 'y'+y;
  section.style.setProperty('--yr-color', color);

  const nonBreakCount = items.filter(b=>!b.break).length;
  section.innerHTML = `
    <div class="year-head">
      <span class="num">${y}</span>
      <span class="meta"><b>${nonBreakCount}</b> book${nonBreakCount===1?'':'s'}</span>
    </div>
    <div class="carousel-wrap">
      <div class="carousel" data-year="${y}"></div>
    </div>
    <div class="click-hint">click for more</div>
    <div class="carousel-nav">
      <button class="nav-btn" data-dir="-1" data-year="${y}">${ICON_CHEV_L}</button>
      <div class="dots" data-year="${y}"></div>
      <button class="nav-btn" data-dir="1" data-year="${y}">${ICON_CHEV_R}</button>
    </div>
    <div class="book-detail" data-year="${y}"></div>
  `;
  yearsRoot.appendChild(section);

  const carouselEl = section.querySelector('.carousel');
  const carouselWrapEl = section.querySelector('.carousel-wrap');
  const dotsEl = section.querySelector('.dots');
  const detailEl = section.querySelector('.book-detail');

  const cardEls = items.map((b, i)=>{
    const el = document.createElement('div');
    el.className = 'card' + (b.break ? ' is-break' : '');
    el.dataset.index = i;

    if(b.break){
      el.innerHTML = `
        <div class="placeholder">
          ${ICON_BOOK}
          <div class="p-title">${b.note || 'Break'}</div>
          <div class="p-author">${b.period}</div>
        </div>
      `;
    } else {
      const cover = coverFor(b);
      const coverHtml = cover
        ? `<img class="cover-img" src="${cover}" alt="${b.title} cover" loading="lazy" decoding="async">`
        : `<div class="placeholder">${ICON_BOOK}<div class="p-title">${b.title}</div><div class="p-author">${b.author}</div></div>`;
      el.innerHTML = `
        ${coverHtml}
        <div class="gradient"></div>
        <span class="badge">${b.period}</span>
        ${b.nonfiction ? '<span class="nf-badge">Non-fiction</span>' : ''}
        <div class="card-foot">
          <div class="t">${b.title}</div>
          <div class="a">${b.author}</div>
        </div>
        <button class="edit-btn" type="button" aria-label="Edit cover">${ICON_PENCIL}</button>
      `;
    }
    carouselEl.appendChild(el);
    return el;
  });

  items.forEach((b,i)=>{
    if(b.break) return;
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.dataset.index = i;
    dot.addEventListener('click', ()=> setActive(y, i));
    dotsEl.appendChild(dot);
  });

  carousels[y] = { items, cardEls, active: 0, dotsEl, detailEl, carouselEl };

  function sizeCards(){
    const st = carousels[y];
    /* Both dimensions are computed here and set explicitly in px — not left to
       CSS height:96% + aspect-ratio + max-width. Two real cross-browser bugs
       lived in that combo: (1) Safari doesn't reliably resolve a percentage
       height through this many nested flex containers onto an abspos
       descendant, and (2) once max-width:44vw becomes the binding constraint
       (any narrow phone), aspect-ratio and an explicit height stop agreeing
       on which one has to give — browsers are allowed to just break the
       ratio there, and did. Doing the 2:3 math ourselves removes both. */
    /* .carousel-wrap normally flex-grows to claim all leftover vertical room
       (that's how cards get to be as large as the screen allows) — but on a
       narrow phone the card's WIDTH is the tighter constraint, so the card
       ends up shorter than that box, and centering it inside a box far
       taller than it needs leaves a dead gap between the card and the
       controls right below (click for more / dots / arrows). Fix: measure
       against the flex-grown ceiling first (clearing any previous lock so
       resize/year-switch always re-measures the true max), then lock the
       wrap down to hug the card's actual computed height. Any real leftover
       space is left to sit below the whole block instead, which reads as
       normal empty space rather than a gap inside a group that should look
       attached. */
    /* Only called on year-switch and resize, NOT on every setActive — .book-
       detail's rendered height varies by book (title/author length changes
       how many lines it wraps to), and it sits in the same flex column as
       .carousel-wrap. Re-measuring on every active-book change was reading
       that leftover-space ceiling against the PREVIOUS book's detail height
       (render() rewrites .book-detail AFTER this ran), so card size lagged
       one book behind and looked like it randomly grew/shrank while paging
       through a year. Measuring once per year-view removes that feedback
       loop entirely — card size is now stable no matter which book is active. */
    carouselWrapEl.style.flex = '';
    carouselWrapEl.style.height = '';
    const wrapRect = carouselEl.getBoundingClientRect();
    if(wrapRect.height > 0 && wrapRect.width > 0){
      let h = wrapRect.height * 0.96;
      let w = h * (2/3);
      const maxW = wrapRect.width * 0.44;   // leave room either side for the fan
      if(w > maxW){ w = maxW; h = w * (3/2); }
      st.cardEls.forEach(el => { el.style.width = w + 'px'; el.style.height = h + 'px'; });
      st.sizedCardW = w;
      const boxH = h + 20;
      carouselWrapEl.style.flex = `0 0 ${boxH}px`;
      carouselWrapEl.style.height = boxH + 'px';
    } else if(!st.sizedCardW){
      st.sizedCardW = st.cardEls[0] ? st.cardEls[0].getBoundingClientRect().width : 190;
    }
  }
  function render(){
    const st = carousels[y];
    const step = Math.max(34, st.sizedCardW * 0.36);
    st.cardEls.forEach((el, i)=>{
      const offset = i - st.active;
      const abs = Math.abs(offset);
      const clamped = Math.max(-4, Math.min(4, offset));
      const x = clamped * step;
      const rot = clamped * 7;
      const scale = Math.max(0.62, 1 - abs*0.11);
      const z = 100 - abs;
      const opacity = abs > 4 ? 0 : Math.max(0.15, 1 - abs*0.22);
      el.style.transform = `translateX(${x}px) rotate(${rot}deg) scale(${scale})`;
      el.style.zIndex = z;
      el.style.opacity = opacity;
      el.classList.toggle('is-active', offset===0);
    });
    st.dotsEl.querySelectorAll('.dot').forEach(d=>{
      d.dataset.active = (+d.dataset.index === st.active);
    });
    const b = st.items[st.active];
    if(b.break){
      st.detailEl.innerHTML = `<div class="d-period">${b.period}</div><h3>${b.note||'Break'}</h3>`;
    } else {
      const gr = `https://www.goodreads.com/search?q=${encodeURIComponent(b.title+' '+b.author)}`;
      st.detailEl.innerHTML = `
        <div class="d-period">${b.period} ${y}</div>
        <h3>${b.title}</h3>
        <div class="d-author">${b.author}</div>
        <div class="d-sub">${b.country || ''}${b.published ? ' · first published '+b.published : ''}</div>
        <a class="d-link" href="${gr}" target="_blank" rel="noopener">View on Goodreads ↗</a>
      `;
    }
  }
  function layout(){ sizeCards(); render(); }
  carousels[y].layout = layout;
  carousels[y].render = render;
  layout();

  cardEls.forEach((el,i)=>{
    const editBtn = el.querySelector('.edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        openEditPop(el, items[i]);
      });
    }
  });

  /* Which card was tapped is resolved on pointerup rather than with a click
     listener on each card: as soon as a drag crosses the capture threshold the
     browser retargets the click to the carousel, so a per-card click handler
     silently never fires — a nudge of the mouse mid-click would do nothing. */
  let dragging = false, startX = 0, moved = 0, captured = false, downIdx = -1;
  carouselEl.addEventListener('pointerdown', (e)=>{
    dragging = true; startX = e.clientX; moved = 0; captured = false;
    const card = e.target.closest('.card');
    downIdx = (card && !e.target.closest('.edit-btn')) ? cardEls.indexOf(card) : -1;
  });
  carouselEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    moved = e.clientX - startX;
    if(!captured && Math.abs(moved) > 6){
      captured = true;
      carouselEl.classList.add('dragging');
      carouselEl.setPointerCapture(e.pointerId);
    }
  });
  function endDrag(isUp){
    if(!dragging) return;
    dragging = false;
    carouselEl.classList.remove('dragging');
    if(Math.abs(moved) > 40){
      shift(y, moved < 0 ? 1 : -1);
    } else if(isUp && downIdx >= 0 && Math.abs(moved) <= 6){
      // a genuine tap: centred card opens up, a fanned one just comes to the front
      if(downIdx === carousels[y].active){
        if(!items[downIdx].break) openBookModal(items[downIdx], y);
      } else {
        setActive(y, downIdx);
      }
    }
    captured = false; moved = 0; downIdx = -1;
  }
  carouselEl.addEventListener('pointerup', ()=> endDrag(true));
  carouselEl.addEventListener('pointercancel', ()=> endDrag(false));
  carouselEl.addEventListener('pointerleave', ()=>{ if(dragging) endDrag(false); });

  // keyboard: left/right arrows step through the year's books
  carouselEl.setAttribute('tabindex', '0');
  carouselEl.setAttribute('aria-label', `${y} carousel — use left and right arrow keys to browse`);
  carouselEl.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft'){ e.preventDefault(); shift(y, -1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); shift(y, 1); }
  });
});

function setActive(y, i){
  const st = carousels[y];
  st.active = Math.max(0, Math.min(st.items.length-1, i));
  st.render();
}
function shift(y, dir){
  const st = carousels[y];
  setActive(y, st.active + dir);
}

/* Stepping between books keeps you where you were reading. Restoring a raw
   scrollTop doesn't work — teasers, blurb counts and note counts all differ, so
   the same pixel offset lands somewhere unrelated in the next book. Instead
   remember WHICH section was at the top of the panel and how far into it you
   were, then put that same section back under the same point. Sections are
   listed in DOM order; if the next book doesn't have the one you were in (a
   book with no press quotes, say) we fall back to the nearest earlier section
   rather than overshooting past it. */
const MODAL_SECTIONS = ['mTeaser', 'mBlurbs', 'mNotes'];

function sectionTopIn(panel, el){
  return el.getBoundingClientRect().top - panel.getBoundingClientRect().top + panel.scrollTop;
}
function visibleSection(id){
  const el = document.getElementById(id);
  return (el && el.getClientRects().length) ? el : null;
}

function captureAnchor(){
  const panel = document.querySelector('.book-panel');
  if(panel.scrollTop < 40) return null;             // still at the top; just stay there
  for(let i = MODAL_SECTIONS.length - 1; i >= 0; i--){
    const el = visibleSection(MODAL_SECTIONS[i]);
    if(!el) continue;
    const top = sectionTopIn(panel, el);
    if(top <= panel.scrollTop + 80) return { index: i, delta: panel.scrollTop - top };
  }
  return null;
}

function restoreAnchor(anchor){
  const panel = document.querySelector('.book-panel');
  if(!anchor){ panel.scrollTop = 0; return; }
  for(let i = anchor.index; i >= 0; i--){
    const el = visibleSection(MODAL_SECTIONS[i]);
    if(!el) continue;
    const want = sectionTopIn(panel, el) + (i === anchor.index ? anchor.delta : 0);
    panel.scrollTop = Math.min(want, panel.scrollHeight - panel.clientHeight);
    return;
  }
  panel.scrollTop = 0;
}

// the year's books in carousel order, skipping the non-clickable break cards
function modalSiblings(){
  const st = carousels[currentModalYear];
  return st ? st.items.map((b, i)=>({b, i})).filter(x=>!x.b.break) : [];
}

function stepBook(dir){
  const sibs = modalSiblings();
  if(sibs.length < 2) return;
  const pos = sibs.findIndex(x => x.b === currentModalBook);
  if(pos < 0) return;
  const target = sibs[(pos + dir + sibs.length) % sibs.length];
  const anchor = captureAnchor();
  setActive(currentModalYear, target.i);          // keep the carousel behind in sync
  openBookModal(target.b, currentModalYear, {keepFocus: true});
  restoreAnchor(anchor);                          // after open, which would otherwise reset scroll
}

  bookModal.dataset.show = 'false';
  bookModal.setAttribute('aria-hidden', 'true');
  currentModalBook = null;
  currentModalSlug = null;
  renderFaves();   // a rating given inside the modal reorders the list behind it
  if(lastFocused) lastFocused.focus();
}

  /* arrows step between books while the modal is open — but not while typing a
     note, and not while the star slider has focus (it uses arrows to rate) */
  if(bookModal.dataset.show === 'true' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    const t = e.target;
    if(t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'
       || t.id === 'ratingInput' || t.id === 'noteRating') return;   // both star rows use arrows
    e.preventDefault();
    stepBook(e.key === 'ArrowRight' ? 1 : -1);
  }
});

// ---- edit mode ----
// Cover editing is for John only, not something a random visitor should stumble
// onto — the button stays out of the DOM's visible flow entirely unless the
// page is opened with ?edit in the URL (e.g. johnplusbooks.com/?edit).
const ADMIN_MODE = new URLSearchParams(location.search).has('edit');
const editModeBtn = document.getElementById('editModeBtn');
if(ADMIN_MODE) editModeBtn.style.display = '';
editModeBtn.addEventListener('click', ()=>{
  const on = document.body.classList.toggle('edit-mode');
  editModeBtn.dataset.on = on;
  editModeBtn.textContent = on ? 'Done editing' : 'Edit covers';
  document.getElementById('exportBtn').style.display = (ADMIN_MODE && Object.keys(getOverrides()).length) ? 'inline-block' : 'none';
});

const editPop = document.getElementById('editPop');
const editUrl = document.getElementById('editUrl');
let editingBook = null;
function openEditPop(cardEl, book){
  editingBook = book;
  const r = cardEl.getBoundingClientRect();
  editPop.style.left = (r.left + window.scrollX) + 'px';
  editPop.style.top = (r.bottom + window.scrollY + 8) + 'px';
  editUrl.value = getOverrides()[slug(book)] || '';
  editPop.dataset.show = 'true';
  editUrl.focus();
}
document.getElementById('editApply').addEventListener('click', ()=>{
  if(!editingBook) return;
  setOverride(slug(editingBook), editUrl.value.trim());
  editPop.dataset.show = 'false';
  carousels[editingBook.year].layout(); // relayout to refresh dots/detail
  rebuildCard(editingBook);
  document.getElementById('exportBtn').style.display = (ADMIN_MODE && Object.keys(getOverrides()).length) ? 'inline-block' : 'none';
});
document.getElementById('editReset').addEventListener('click', ()=>{
  if(!editingBook) return;
  setOverride(slug(editingBook), null);
  editPop.dataset.show = 'false';
  rebuildCard(editingBook);
  document.getElementById('exportBtn').style.display = (ADMIN_MODE && Object.keys(getOverrides()).length) ? 'inline-block' : 'none';
});
document.addEventListener('click', (e)=>{
  if(editPop.dataset.show === 'true' && !editPop.contains(e.target) && !e.target.closest('.edit-btn')){
    editPop.dataset.show = 'false';
  }
});
function rebuildCard(book){
  const st = carousels[book.year];
  const i = st.items.indexOf(book);
  const el = st.cardEls[i];
  const cover = coverFor(book);
  const img = el.querySelector('.cover-img');
  const ph = el.querySelector('.placeholder');
  if(cover){
    if(img){ img.src = cover; }
    else {
      el.querySelector('.placeholder')?.remove();
      const imgEl = document.createElement('img');
      imgEl.className = 'cover-img'; imgEl.loading='lazy'; imgEl.decoding='async';
      imgEl.src = cover; imgEl.alt = book.title+' cover';
      el.insertBefore(imgEl, el.firstChild);
    }
  } else if(!ph){
    img?.remove();
    const div = document.createElement('div');
    div.className = 'placeholder';
    div.innerHTML = `${ICON_BOOK}<div class="p-title">${book.title}</div><div class="p-author">${book.author}</div>`;
    el.insertBefore(div, el.firstChild);
  }
}

// ---- export overrides (modal, doesn't affect page layout/height) ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  document.getElementById('exportText').value = JSON.stringify(getOverrides(), null, 2);
  document.getElementById('exportBackdrop').dataset.show = 'true';
});
document.getElementById('closeExportBtn').addEventListener('click', ()=>{
  document.getElementById('exportBackdrop').dataset.show = 'false';
});
document.getElementById('exportBackdrop').addEventListener('click', (e)=>{
  if(e.target.id === 'exportBackdrop') document.getElementById('exportBackdrop').dataset.show = 'false';
});
document.getElementById('copyBtn').addEventListener('click', ()=>{
  const t = document.getElementById('exportText');
  t.select();
  navigator.clipboard?.writeText(t.value);
});
if(ADMIN_MODE && Object.keys(getOverrides()).length) document.getElementById('exportBtn').style.display = 'inline-block';

// icon strokes need currentColor fix for chevrons/pencil (inherit stroke)
document.querySelectorAll('.nav-btn svg, .edit-btn svg').forEach(svg=> svg.style.stroke = 'currentColor');

// ---- deep link straight to one book, e.g. johnplusbooks.com/#2021-january-the-devotion-of-suspect-x ----
// lets a specific pick be shared on its own (Telegram, etc.) rather than just linking the whole site
function openFromHash(){
  const wanted = location.hash.slice(1);
  if(!wanted) return;
  const b = DATA.find(x => !x.break && slug(x) === wanted);
  if(!b) return;
  showYear(b.year);
  const st = carousels[b.year];
  setActive(b.year, st.items.indexOf(b));
  openBookModal(b, b.year);
}
// the wordmark is the way back to the front of the site
document.getElementById('brandHome').addEventListener('click', ()=>{
  if(bookModal.dataset.show === 'true') closeBookModal();
  // drop any #book deep link, or openFromHash would immediately reopen that book
  if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  showYear(nowBook ? 'now' : years[0]);
});

openFromHash();
window.addEventListener('hashchange', openFromHash);
</script>
