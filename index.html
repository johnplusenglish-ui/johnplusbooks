<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book42 — the reading diary</title>
<meta name="description" content="Every monthly pick from Book42, our Telegram book club, since 2021 — a year-by-year gallery.">
<style>
/* Outfit, self-hosted — was Google Fonts, but that file is actually a single
   variable font (wght 100-900) reused for every weight Google served, so
   vendoring it is just two small files instead of a whole third-party round trip. */
@font-face{
  font-family:'Outfit';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url('fonts/outfit-latin.woff2') format('woff2-variations'),
      url('fonts/outfit-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face{
  font-family:'Outfit';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url('fonts/outfit-latin-ext.woff2') format('woff2-variations'),
      url('fonts/outfit-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
:root{
  --bg:#fbf9f5;
  --card-bg:#ffffff;
  --ink:#1b1b1f;
  --ink-soft:#5a5a63;
  --line:#e7e3da;
  --accent:#3159d1;
  --radius:20px;
  --shadow-lo:0 1px 2px rgba(20,20,30,.06);
  --shadow-md:0 12px 30px -12px rgba(20,20,30,.22);
  --shadow-hi:0 24px 60px -18px rgba(20,20,30,.32);
}
*{box-sizing:border-box}
html, body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Outfit',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  overflow:hidden;
}
img{max-width:100%;display:block}
a{color:inherit}

/* ---------- topbar ---------- */
.topbar{
  flex:none;
  display:flex; align-items:center; gap:1.25rem;
  padding:.9rem 1.5rem;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:.5rem; font-weight:800; font-size:1.1rem; letter-spacing:-.01em; white-space:nowrap}
.brand small{font-weight:500; font-size:.68rem; color:var(--ink-soft); letter-spacing:.08em; text-transform:uppercase}
.brand-42{color:#1592a8}
.year-nav{display:flex; gap:.4rem; overflow-x:auto; scrollbar-width:none; flex:1}
.year-nav::-webkit-scrollbar{display:none}
.year-nav button{
  flex:none;
  appearance:none; font:inherit;
  font-size:.85rem; font-weight:600;
  padding:.42rem .85rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  cursor:pointer;
  color:var(--ink-soft);
  transition:background .15s, color .15s, border-color .15s;
}
.year-nav button[data-active="true"]{
  background:var(--yr-color, var(--accent));
  border-color:var(--yr-color, var(--accent));
  color:#fff;
}
.editmode-btn{
  flex:none;
  font-size:.75rem; font-weight:600;
  padding:.42rem .8rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  cursor:pointer;
  color:var(--ink-soft);
}
.editmode-btn[data-on="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.tg-link{
  flex:none;
  display:inline-flex; align-items:center; gap:.42rem;
  font-size:.78rem; font-weight:600;
  padding:.42rem .8rem;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--ink-soft);
  text-decoration:none;
  white-space:nowrap;
  transition:color .15s, border-color .15s, background .15s;
}
.tg-link:hover{
  color:#229ED9;
  border-color:#229ED9;
  background:color-mix(in srgb, #229ED9 7%, transparent);
}
.tg-link svg{width:15px; height:15px; fill:currentColor; flex:none}

/* ---------- year section (one full-height panel per year, swapped via tabs) ---------- */
main#years{flex:1 1 auto; min-height:0; overflow:hidden}
.year-section{display:none; flex-direction:column; height:100%; padding:1rem 1.5rem 1.25rem; min-height:0}
.year-section.active{display:flex}
.year-head{flex:none; max-width:1180px; width:100%; margin:0 auto; display:flex; align-items:baseline; gap:1rem; margin-bottom:.6rem}
.year-head .num{font-size:clamp(2rem,5vw,3.2rem); font-weight:900; letter-spacing:-.03em; color:var(--yr-color); line-height:1}
.year-head .meta{font-size:.85rem; color:var(--ink-soft); font-weight:500}
.year-head .meta b{color:var(--ink); font-weight:700}

/* ---------- carousel ---------- */
.carousel-wrap{position:relative; flex:1 1 auto; min-height:0; display:flex}
.carousel{
  position:relative;
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  touch-action:pan-y;
  user-select:none;
  cursor:grab;
  outline:none;
}
.carousel.dragging{cursor:grabbing}
.card{
  position:absolute;
  /* height-driven so the cards grow to fill whatever vertical room the
     viewport allows — always as large as they can be without causing scroll */
  height:96%;
  width:auto;
  aspect-ratio:2/3;
  max-width:44vw;
  border-radius:5px;
  overflow:hidden;
  background:var(--card-bg);
  box-shadow:var(--shadow-md);
  transition:transform .38s cubic-bezier(.22,1,.36,1), opacity .38s ease, box-shadow .38s ease;
  will-change:transform;
  cursor:pointer;
}
.card.is-active{box-shadow:var(--shadow-hi); cursor:zoom-in}
.card.is-active.is-break{cursor:default}
.card .cover-img{width:100%; height:100%; object-fit:cover; background:#eee}
.card .placeholder{
  width:100%; height:100%;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:1.1rem;
  background:linear-gradient(160deg, color-mix(in srgb, var(--yr-color) 70%, #111) 0%, color-mix(in srgb, var(--yr-color) 35%, #111) 100%);
  color:#fff;
}
.card .placeholder .p-icon{opacity:.5; margin-bottom:auto}
.card .placeholder .p-title{font-weight:800; font-size:1rem; line-height:1.25}
.card .placeholder .p-author{font-size:.78rem; opacity:.8; margin-top:.3rem}
.card .badge{
  position:absolute; top:.6rem; left:.6rem;
  font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:rgba(255,255,255,.92); color:var(--ink);
  padding:.32rem .6rem; border-radius:999px;
}
.card .nf-badge{
  position:absolute; top:.6rem; right:.6rem;
  font-size:.62rem; font-weight:700;
  background:rgba(20,20,25,.75); color:#fff;
  padding:.32rem .55rem; border-radius:999px;
}
.card .gradient{
  position:absolute; inset:auto 0 0 0; height:55%;
  background:linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
  pointer-events:none;
}
.card .card-foot{
  position:absolute; left:0; right:0; bottom:0; padding:.85rem;
  color:#fff;
}
.card .card-foot .t{font-weight:700; font-size:.85rem; line-height:1.2}
.card .card-foot .a{font-size:.72rem; opacity:.85; margin-top:.15rem; font-style:italic}
.card.is-break{cursor:default}
.card .edit-btn{
  position:absolute; bottom:.6rem; right:.6rem;
  width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,.92); border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  opacity:0; transition:opacity .15s;
}
body.edit-mode .card.is-active .edit-btn{opacity:1}
.card .edit-btn svg{width:13px; height:13px; stroke:var(--ink)}

.carousel-nav{
  flex:none;
  display:flex; align-items:center; justify-content:center; gap:1rem;
  margin-top:.4rem;
}
.nav-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--card-bg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:border-color .15s, transform .1s;
}
.nav-btn:hover{border-color:var(--yr-color)}
.nav-btn:active{transform:scale(.92)}
.nav-btn svg{width:16px; height:16px; stroke:var(--ink)}
.dots{display:flex; gap:.4rem; flex-wrap:wrap; max-width:220px; justify-content:center}
.dot{width:6px; height:6px; border-radius:50%; background:var(--line); cursor:pointer; transition:background .15s, transform .15s}
.dot[data-active="true"]{background:var(--yr-color); transform:scale(1.5)}

.click-hint{
  flex:none;
  text-align:center;
  font-size:.68rem; font-weight:500; letter-spacing:.09em;
  color:var(--ink-soft); opacity:.5;
  margin-top:.5rem;
  pointer-events:none;
}

/* ---------- detail panel ---------- */
.book-detail{
  flex:none;
  max-width:640px; width:100%; margin:.5rem auto 0;
  padding:0 1.5rem 1.6rem;   /* room to breathe under the Goodreads link */
  text-align:center;
}
.book-detail .d-period{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yr-color)}
.book-detail h3{font-size:1.25rem; font-weight:800; letter-spacing:-.01em; margin:.3rem 0 .15rem}
.book-detail .d-author{font-size:.9rem; color:var(--ink-soft); font-style:italic}
.book-detail .d-sub{font-size:.78rem; color:var(--ink-soft); margin-top:.35rem}
.book-detail .d-link{
  display:inline-block; margin-top:.5rem; font-size:.76rem; font-weight:600;
  color:var(--yr-color); text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px;
}

/* ---------- export modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; z-index:520;
  background:rgba(20,20,25,.45);
  display:none; align-items:center; justify-content:center; padding:1.5rem;
}
.modal-backdrop[data-show="true"]{display:flex}
.modal-box{background:#fff; border-radius:16px; padding:1.4rem; width:100%; max-width:480px; box-shadow:var(--shadow-hi)}
.modal-box .modal-title{font-weight:700; font-size:.95rem; margin-bottom:.6rem}
.modal-box textarea{
  width:100%; height:140px; font-family:monospace; font-size:.72rem;
  padding:.7rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  resize:vertical;
}
.modal-actions{display:flex; gap:.5rem; margin-top:.7rem; justify-content:flex-end}
.modal-actions button{
  font-size:.75rem; font-weight:600; padding:.5rem 1rem;
  border-radius:8px; border:1px solid var(--line); background:var(--card-bg); cursor:pointer;
}
.modal-actions button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}

/* ---------- book detail modal ---------- */
.book-modal{
  /* must clear the carousel cards, which carry inline z-index up to 100 */
  position:fixed; inset:0; z-index:500;
  background:rgba(18,18,24,.55);
  backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center;
  padding:1.5rem;
  opacity:0; transition:opacity .18s ease;
}
.book-modal[data-show="true"]{display:flex; opacity:1}
.book-panel{
  position:relative;
  background:var(--card-bg);
  border-radius:10px;
  width:100%; max-width:840px;
  max-height:88vh;
  overflow-y:auto;
  box-shadow:var(--shadow-hi);
  padding:2rem;
  transform:translateY(8px) scale(.985);
  transition:transform .22s cubic-bezier(.22,1,.36,1);
}
.book-modal[data-show="true"] .book-panel{transform:none}
.book-close{
  position:absolute; top:.9rem; right:.9rem;
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--card-bg);
  font-size:1.15rem; line-height:1; color:var(--ink-soft);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.book-close:hover{background:var(--bg)}
.book-grid{display:flex; gap:2rem; align-items:flex-start}
.book-grid .m-cover{
  flex:none; width:230px; aspect-ratio:2/3;
  border-radius:5px; overflow:hidden; background:#eee;
  box-shadow:var(--shadow-md);
}
.book-grid .m-cover img{width:100%; height:100%; object-fit:cover}
.book-info{flex:1 1 auto; min-width:0}
.book-info .m-period{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yr-color)}
.book-info h2{font-size:1.7rem; font-weight:900; letter-spacing:-.015em; line-height:1.15; margin:.35rem 0 .25rem}
.book-info .m-author{font-size:1rem; color:var(--ink-soft); font-style:italic}
.book-info .m-sub{font-size:.8rem; color:var(--ink-soft); margin-top:.45rem}

/* ---------- star ratings ----------
   Each row stacks two identical strips of 5 stars: a grey background strip and
   a gold foreground strip clipped to a % width. Clipping a continuous strip
   (rather than styling 5 separate icons) is what lets a value like 3.7 render
   as a genuinely partial star, and lets the input track the pointer smoothly. */
.m-rating{display:none; align-items:center; gap:.9rem; flex-wrap:wrap; margin-top:.85rem}
.m-rating[data-ready="true"]{display:flex}
.rating-avg{display:flex; align-items:center; gap:.5rem}
.rating-avg-text{font-size:.78rem; color:var(--ink-soft)}
.rating-yours{display:flex; align-items:center; gap:.5rem; padding-left:.9rem; border-left:1px solid var(--line)}
.rating-yours-label{font-size:.72rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em}
.star-row{position:relative; display:inline-block; line-height:0}
.star-row-bg, .star-row-fg{display:flex; gap:1px}
.star-row-fg{position:absolute; inset:0 auto 0 0; overflow:hidden; white-space:nowrap}
.star-row svg{width:16px; height:16px; flex:none}
.star-row-bg svg{fill:var(--line)}
.star-row-fg svg{fill:#f0a72e}
.rating-input .star-row{cursor:pointer}
.rating-input .star-row svg{width:19px; height:19px}
.rating-input .star-row-fg svg{fill:var(--yr-color)}
.rating-input:focus-visible .star-row{outline:2px solid var(--yr-color); outline-offset:3px; border-radius:3px}
.rating-yours-note{font-size:.72rem; color:var(--ink-soft); opacity:0; transition:opacity .2s ease}
.rating-yours-note[data-show="true"]{opacity:1}

.m-genres{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.85rem}
.m-genres:empty{display:none}
.genre-tag{
  font-size:.7rem; font-weight:600; letter-spacing:.01em;
  color:var(--yr-color);
  background:color-mix(in srgb, var(--yr-color) 9%, var(--card-bg));
  padding:.28rem .6rem; border-radius:4px;
}
/* non-fiction rides in the same row as the genres, but neutral so it reads
   as a different kind of label rather than another genre */
.genre-tag.is-nf{
  color:var(--ink-soft);
  background:var(--bg);
  box-shadow:inset 0 0 0 1px var(--line);
}

.m-teaser{
  margin:1.1rem 0 0;
  font-size:.95rem; line-height:1.6; color:var(--ink);
  padding-left:.9rem; border-left:2px solid var(--yr-color);
}
.m-teaser:empty{display:none}

.m-blurbs{margin-top:1.5rem; display:flex; flex-direction:column; gap:.9rem}
.m-blurbs .blurbs-head{
  font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
}
.blurb{margin:0}
.blurb q{font-size:.92rem; line-height:1.5; color:var(--ink); font-style:italic; quotes:'"' '"'}
.blurb cite{
  display:block; margin-top:.3rem;
  font-size:.75rem; font-style:normal; font-weight:600; color:var(--ink-soft);
}
.m-link{
  display:inline-block; margin-top:1.4rem; font-size:.8rem; font-weight:600;
  color:var(--yr-color); text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px;
}
@media (max-width:680px){
  .book-panel{padding:1.4rem}
  .book-grid{flex-direction:column; gap:1.2rem; align-items:center}
  .book-grid .m-cover{width:170px}
  .book-info{text-align:center}
  .m-teaser{text-align:left}
  .m-blurbs{text-align:left}
}

/* ---------- edit popover ---------- */
.edit-pop{
  position:absolute; z-index:540; width:220px;
  background:#fff; border-radius:12px; box-shadow:var(--shadow-hi);
  padding:.8rem; font-size:.75rem; display:none;
}
.edit-pop[data-show="true"]{display:block}
.edit-pop input{width:100%; font-size:.75rem; padding:.4rem .5rem; border-radius:6px; border:1px solid var(--line); margin-bottom:.4rem}
.edit-pop .row{display:flex; gap:.4rem}
.edit-pop button{flex:1; font-size:.7rem; font-weight:600; padding:.4rem; border-radius:6px; border:1px solid var(--line); background:var(--bg); cursor:pointer}
.edit-pop button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}

@media (max-width:560px){
  .brand small{display:none}
  .tg-link span{display:none}          /* icon only once space is tight */
  .tg-link{padding:.42rem .55rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-name">book<span class="brand-42">42</span></span> <small>reading diary</small></div>
  <nav class="year-nav" id="yearNav"></nav>
  <a class="tg-link" href="https://t.me/book42channel" target="_blank" rel="noopener"
     title="Book42 on Telegram" aria-label="Book42 on Telegram">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    <span>Telegram</span>
  </a>
  <button class="editmode-btn" id="exportBtn" type="button" style="display:none">Export edits</button>
  <button class="editmode-btn" id="editModeBtn" type="button" style="display:none">Edit covers</button>
</header>

<main id="years"></main>

<div class="modal-backdrop" id="exportBackdrop">
  <div class="modal-box">
    <div class="modal-title">Your cover edits — paste this back to me to make permanent</div>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-actions">
      <button type="button" id="closeExportBtn">Close</button>
      <button type="button" class="primary" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<div class="book-modal" id="bookModal" aria-hidden="true">
  <div class="book-panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="book-close" id="bookClose" type="button" aria-label="Close">&times;</button>
    <div class="book-grid">
      <div class="m-cover"><img id="mCover" alt=""></div>
      <div class="book-info">
        <div class="m-period" id="mPeriod"></div>
        <h2 id="mTitle"></h2>
        <div class="m-author" id="mAuthor"></div>
        <div class="m-sub" id="mSub"></div>
        <div class="m-rating" id="mRating">
          <div class="rating-avg">
            <span class="star-row" id="ratingAvgStars" aria-hidden="true"></span>
            <span class="rating-avg-text" id="ratingAvgText"></span>
          </div>
          <div class="rating-yours">
            <span class="rating-yours-label">Your rating</span>
            <span class="star-row rating-input" id="ratingInput"
                  role="slider" tabindex="0" aria-label="Your rating"
                  aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="0"></span>
            <span class="rating-yours-note" id="ratingNote">Saved</span>
          </div>
        </div>
        <div class="m-genres" id="mGenres"></div>
        <p class="m-teaser" id="mTeaser"></p>
        <div class="m-blurbs" id="mBlurbs"></div>
        <a class="m-link" id="mLink" target="_blank" rel="noopener">View on Goodreads &#8599;</a>
      </div>
    </div>
  </div>
</div>

<div class="edit-pop" id="editPop">
  <input type="text" id="editUrl" placeholder="Paste image URL…">
  <div class="row">
    <button type="button" id="editReset">Reset</button>
    <button type="button" class="primary" id="editApply">Use</button>
  </div>

const BOOKINFO = {"The Devotion of Suspect X":{"teaser":"Yasuko's quiet Tokyo life shatters when her violent ex-husband turns up at her door. Her reclusive neighbour, a mathematics genius, offers to make the problem disappear.","blurbs":[{"quote":"Intricate and beguiling...if you like riddles inside enigmas, it will please you no end","attribution":"The Guardian","url":"https://www.waterstones.com/book/the-devotion-of-suspect-x/keigo-higashino/9780349123745"},{"quote":"The plot is taut and intriguing...Agatha Christie would be mightily impressed","attribution":"Financial Times","url":"https://www.waterstones.com/book/the-devotion-of-suspect-x/keigo-higashino/9780349123745"},{"quote":"...cold logic battles warm hearts throughout this elegant proof of the wages of sin","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9780312375065"}],"genres":["Crime","Mystery","Japanese Fiction"]},"Replay":{"teaser":"Jeff Winston dies of a heart attack at forty-three and wakes up eighteen again, in his college dorm, with every memory intact. Then it happens again.","blurbs":[{"quote":"This is one of the most elegant and moving time travels stories ever written","attribution":"Ernest Cline, author of Ready Player One","url":"https://store.gollancz.co.uk/products/replay"},{"quote":"Powerful ... compelling ... superb!","attribution":"Atlanta Journal","url":"https://store.gollancz.co.uk/products/replay"},{"quote":"Ken Grimwood's Replay is one of the freshest, most engaging novels","attribution":"Dean Koontz","url":"https://store.gollancz.co.uk/products/replay"}],"genres":["Science Fiction","Time Loop"]},"My Sweet Orange Tree":{"teaser":"Zezé is a mischievous, fiercely imaginative small boy in a poor Rio de Janeiro neighbourhood, who confides in a little orange tree. Then he meets a real friend.","blurbs":[{"quote":"Tender, joyful… It will suit thoughtful readers of 10-plus down to the ground","attribution":"The Guardian","url":"https://pushkinpress.com/book/my-sweet-orange-tree/"},{"quote":"Written with immense tenderness, My Sweet Orange Tree eschews simple nostalgia…","attribution":"The Irish Times","url":"https://pushkinpress.com/book/my-sweet-orange-tree/"},{"quote":"This is a story full of sorrowful tenderness. Little Zezé is so likeable","attribution":"Cao Wenxuan, winner of the Hans Christian Andersen Prize","url":"https://pushkinpress.com/book/my-sweet-orange-tree/"}],"genres":["Coming of Age","Literary Fiction","Brazilian"]},"Brave New World":{"teaser":"In a future World State, humans are bred in bottles, conditioned for contentment and kept docile by a drug called soma. One man begins to feel out of step.","blurbs":[{"quote":"A masterpiece of speculation... As vibrant, fresh, and somehow shocking…","attribution":"Margaret Atwood","url":"https://www.penguin.co.uk/books/56119/brave-new-world-by-aldous-huxley/9780099518471"},{"quote":"A grave warning... Provoking, stimulating, shocking and dazzling","attribution":"The Observer","url":"https://www.penguin.co.uk/books/56119/brave-new-world-by-aldous-huxley/9780099518471"},{"quote":"The most accomplished novel Huxley has yet written","attribution":"Rebecca West","url":"https://en.wikipedia.org/wiki/Brave_New_World"}],"genres":["Dystopia","Science Fiction","Classic"]},"Force of Nature":{"teaser":"Five colleagues set out on a corporate hiking retreat deep in the Australian bush. Only four walk out. Federal agent Aaron Falk has his own reason to care.","blurbs":[{"quote":"Jane Harper, the new Queen of Crime...Even more impressive than The Dry","attribution":"The Sunday Times","url":"https://www.waterstones.com/book/force-of-nature/jane-harper/9780349142128"},{"quote":"Powerful, intriguing and recommended...Harper is wonderful at evoking fear and unease","attribution":"The Times","url":"https://www.waterstones.com/book/force-of-nature/jane-harper/9780349142128"},{"quote":"Harper once again shows herself to be a storytelling force to be reckoned with","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781250105639"}],"genres":["Crime","Thriller"]},"The Murder of Roger Ackroyd":{"teaser":"In a quiet English village, a wealthy man is found stabbed in his study only hours after learning a dangerous secret. Hercule Poirot, retired next door, investigates.","blurbs":[{"quote":"A classic – the book has worthily earned its fame.","attribution":"Irish Independent","url":"https://www.waterstones.com/book/the-murder-of-roger-ackroyd/agatha-christie/9780007527526"},{"quote":"One of the landmarks of detective literature.","attribution":"H.R.F. Keating, Crime & Mystery: The 100 Best Books","url":"https://www.waterstones.com/book/the-murder-of-roger-ackroyd/agatha-christie/9780007527526"},{"quote":"Miss Christie is not only an expert technician and a remarkably good story-teller...","attribution":"The New York Times Book Review","url":"https://en.wikipedia.org/wiki/The_Murder_of_Roger_Ackroyd"}],"genres":["Crime","Golden Age Mystery","Classic"]},"Flowers for Algernon":{"teaser":"Charlie Gordon, a gentle bakery worker with an IQ of 68, volunteers for experimental surgery to make him clever. His own progress reports tell the story.","blurbs":[{"quote":"A masterpiece of poignant brilliance . . . heartbreaking, and utterly, completely brilliant","attribution":"The Guardian","url":"https://www.orionbooks.co.uk/titles/daniel-keyes/flowers-for-algernon-2/9781857989380/"},{"quote":"Strikingly original","attribution":"Publishers Weekly","url":"https://www.orionbooks.co.uk/titles/daniel-keyes/flowers-for-algernon-2/9781857989380/"},{"quote":"Heartbreaking and beautiful. Required reading, as far as I am concerned","attribution":"Wil Wheaton","url":"https://www.orionbooks.co.uk/titles/daniel-keyes/flowers-for-algernon-2/9781857989380/"}],"genres":["Science Fiction","Literary Fiction","Classic"]},"The Princess Bride":{"teaser":"Buttercup is the most beautiful woman in the world and her true love Westley is lost at sea. What follows involves pirates, giants, fencing, revenge and true love.","blurbs":[{"quote":"Nutball funny . . . A 'classic' medieval melodrama...","attribution":"Newsweek","url":"https://www.barnesandnoble.com/w/the-princess-bride-william-goldman/1100617233"},{"quote":"One of the most laconic, tightly-plotted tales of mythical morality you'll ever read","attribution":"Uncut","url":"https://www.waterstones.com/book/the-princess-bride/william-goldman/9780747545187"},{"quote":"There's nothing fluffy about The Princess Bride. The rocket-powered narrative tricks you...","attribution":"Neon","url":"https://www.waterstones.com/book/the-princess-bride/william-goldman/9780747545187"}],"genres":["Fantasy","Adventure","Comedy"]},"A Thousand Splendid Suns":{"teaser":"Two Afghan women, born a generation apart and strangers to each other, are thrown together in a single Kabul household as thirty years of war reshape their country.","blurbs":[{"quote":"A Thousand Splendid Suns is an ambitious work.","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/391566/a-thousand-splendid-suns-by-khaled-hosseini/"},{"quote":"Spectacular. . . . Hosseini's writing makes our hearts ache, our stomachs clench...","attribution":"USA Today","url":"https://www.penguinrandomhouse.com/books/391566/a-thousand-splendid-suns-by-khaled-hosseini/"},{"quote":"...a brave, honorable, big-hearted book","attribution":"The Washington Post Book World","url":"https://www.penguinrandomhouse.com/books/391566/a-thousand-splendid-suns-by-khaled-hosseini/"}],"genres":["Historical Fiction","Literary Fiction"]},"I'm Not Scared":{"teaser":"During a scorching 1978 summer, nine-year-old Michele roams the wheat fields around his tiny southern Italian village and stumbles on something hidden near an abandoned farmhouse.","blurbs":[{"quote":"A deft masterpiece with never a false note","attribution":"The Guardian","url":"https://canongate.co.uk/books/112-im-not-scared/"},{"quote":"The new Italian word for talent is Ammaniti","attribution":"The Times","url":"https://canongate.co.uk/books/112-im-not-scared/"},{"quote":"An exquisite parable","attribution":"Daily Telegraph","url":"https://canongate.co.uk/books/112-im-not-scared/"}],"genres":["Literary Thriller","Coming of Age","Italian Fiction"]},"Man's Search for Meaning":{"teaser":"A psychiatrist's account of surviving the Nazi concentration camps, and the therapy he built from it: the argument that our deepest drive is the search for meaning.","blurbs":[{"quote":"One of the great books of our time.","attribution":"Harold S. Kushner, author of When Bad Things Happen to Good People","url":"https://www.beacon.org/Mans-Search-for-Meaning-P602.aspx"},{"quote":"One of the outstanding contributions to psychological thought in the last fifty years.","attribution":"Carl R. Rogers","url":"https://www.beacon.org/Mans-Search-for-Meaning-P602.aspx"},{"quote":"[O]ne of the most significant books of the 20th century.","attribution":"O, the Oprah Magazine","url":"https://www.beacon.org/Mans-Search-for-Meaning-P602.aspx"}],"genres":["Memoir","Psychology"]},"Guards! Guards!":{"teaser":"Ankh-Morpork's shambolic Night Watch faces a dragon conjured by a secret society, reinforced by a hugely tall, dwarf-raised recruit who takes the law rather too seriously.","blurbs":[{"quote":"This is one of Pratchett's best books. Hilarious and highly recommended","attribution":"The Times","url":"https://www.penguin.co.uk/books/328779/guards-guards-by-terry-pratchett/9781804990674"},{"quote":"One of our greatest fantasists, and beyond a doubt the funniest","attribution":"George R.R. Martin","url":"https://www.penguin.co.uk/books/328779/guards-guards-by-terry-pratchett/9781804990674"},{"quote":"[Pratchett's] spectacular inventiveness makes the Discworld series one of the perennial joys of modern fiction","attribution":"Mail on Sunday","url":"https://www.penguin.co.uk/books/328779/guards-guards-by-terry-pratchett/9781804990674"}],"genres":["Fantasy","Comedy","Discworld"]},"A Gentleman in Moscow":{"teaser":"In 1922 an unrepentant Russian count is sentenced to house arrest in a grand Moscow hotel, and sets about making a life inside it while history churns outside.","blurbs":[{"quote":"The novel buzzes with the energy of numerous adventures, love affairs, [and] twists of fate.","attribution":"The Wall Street Journal","url":"https://www.penguinrandomhouse.com/books/311564/a-gentleman-in-moscow-by-amor-towles/"},{"quote":"How delightful that in an era as crude as ours this finely composed novel...","attribution":"The Washington Post","url":"https://www.penguinrandomhouse.com/books/311564/a-gentleman-in-moscow-by-amor-towles/"},{"quote":"This is an old fashioned sort of romance, filled with delicious detail.","attribution":"Louise Erdrich","url":"https://www.penguinrandomhouse.com/books/311564/a-gentleman-in-moscow-by-amor-towles/"}],"genres":["Historical Fiction","Literary Fiction"]},"Contact":{"teaser":"A radio astronomer hunting for extraterrestrial intelligence picks up an unmistakable signal from the star Vega, triggering a worldwide scientific, political and religious scramble to decode it.","blurbs":[{"quote":"The range and depth of ideas is quite uncommon","attribution":"The New York Times Book Review","url":"https://www.orbit-books.co.uk/titles/carl-sagan-4/contact/9780356518848/"},{"quote":"Sagan's informed and dramatically enacted speculations into the mysteries of the universe . . .","attribution":"Publishers Weekly","url":"https://www.orbit-books.co.uk/titles/carl-sagan-4/contact/9780356518848/"},{"quote":"Stunning and satisfying","attribution":"Los Angeles Times","url":"https://www.orbit-books.co.uk/titles/carl-sagan-4/contact/9780356518848/"}],"genres":["Science Fiction","First Contact"]},"My Brilliant Friend":{"teaser":"Two clever girls grow up in a poor, violent neighbourhood on the edge of 1950s Naples, their fierce friendship shaping them even as their futures start to diverge.","blurbs":[{"quote":"Ferrante has captured the intensity of childhood friendships – their all-consuming nature, the passions...","attribution":"The Guardian","url":"https://www.europaeditions.com/reviews/book/a75d5f12-500c-41ef-945a-01a401e449cf"},{"quote":"Cinematic in the density of its detail.","attribution":"Times Literary Supplement","url":"https://www.europaeditions.com/reviews/book/a75d5f12-500c-41ef-945a-01a401e449cf"},{"quote":"Ferrante, beautifully translated by Ann Goldstein...writes with a ferocious, intimate urgency.","attribution":"San Francisco Chronicle","url":"https://www.europaeditions.com/reviews/book/a75d5f12-500c-41ef-945a-01a401e449cf"}],"genres":["Literary Fiction","Coming of Age","Italian Fiction"]},"The House in the Cerulean Sea":{"teaser":"A rule-following caseworker for magical youth is sent to inspect a remote island orphanage housing six highly unusual children and their enigmatic guardian, and finds his careful world unsettled.","blurbs":[{"quote":"A witty, wholesome fantasy that's likely to cause heart-swelling","attribution":"The Washington Post","url":"https://www.waterstones.com/book/the-house-in-the-cerulean-sea/tj-klune/9781529087949"},{"quote":"I loved it. It is like being wrapped up in a big gay blanket.","attribution":"V. E. Schwab, author of Gallant","url":"https://www.waterstones.com/book/the-house-in-the-cerulean-sea/tj-klune/9781529087949"},{"quote":"This tale of found family is hopeful to its core.","attribution":"Publishers Weekly","url":"https://www.waterstones.com/book/the-house-in-the-cerulean-sea/tj-klune/9781529087949"}],"genres":["Fantasy","Romance","Feel-good"]},"The Story of a New Name":{"teaser":"The second Neapolitan novel follows Elena and Lila into young adulthood, as marriage, study and ambition pull the two friends along sharply different paths in and beyond Naples.","blurbs":[{"quote":"Imagine if Jane Austen got angry and you'll have some idea of how explosive...","attribution":"The Australian","url":"https://www.europaeditions.com/book/9781609451349/the-story-of-a-new-name"},{"quote":"one of the great novelists of our time","attribution":"The New York Times","url":"https://www.europaeditions.com/book/9781609451349/the-story-of-a-new-name"},{"quote":"Brilliant . . . captivating and insightful . . .","attribution":"Booklist (starred review)","url":"https://www.europaeditions.com/book/9781609451349/the-story-of-a-new-name"}],"genres":["Literary Fiction","Italian Fiction"]},"The Pleasures of Reading in an Age of Distraction":{"teaser":"A literature professor argues against dutiful, self-improving reading and makes the case for reading at whim: following delight and curiosity instead of lists, guilt or prescriptions.","blurbs":[{"quote":"Delightful yet discombobulating","attribution":"The Wall Street Journal","url":"https://www.waterstones.com/book/the-pleasures-of-reading-in-an-age-of-distraction/alan-jacobs/9780199747498"},{"quote":"what could be nicer to read than a book about how nice reading is?","attribution":"Steven Poole, The Guardian","url":"https://www.waterstones.com/book/the-pleasures-of-reading-in-an-age-of-distraction/alan-jacobs/9780199747498"},{"quote":"A vigorous and friendly exhortation to get back into the kind of reading...","attribution":"Library Journal","url":"https://www.waterstones.com/book/the-pleasures-of-reading-in-an-age-of-distraction/alan-jacobs/9780199747498"}],"genres":["Essays","Books About Books"]},"Billy Summers":{"teaser":"A sniper-for-hire with a personal code takes one last contract, moving into a quiet town under a false name and posing as a writer while he waits.","blurbs":[{"quote":"Murder most foul and mayhem most entertaining. Another worthy page-turner from a protean master.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/stephen-king/billy-summers/"},{"quote":"a dazzlingly shapeshifting novel that, like its antihero, only pretends to be easy to pigeonhole","attribution":"The Sunday Times","url":"https://bookmarks.reviews/reviews/billy-summers/"},{"quote":"…And it's [King's] best book in years","attribution":"The Guardian","url":"https://bookmarks.reviews/reviews/billy-summers/"}],"genres":["Thriller","Crime"]},"Moby-Dick":{"teaser":"Ishmael signs aboard the whaler Pequod and discovers that its captain, Ahab, has bent the whole voyage to one purpose: hunting the white whale that took his leg.","blurbs":[{"quote":"High philosophy, liberal feeling, abstruse metaphysics popularly phrased, soaring speculation, a style as many-coloured…","attribution":"London Morning Advertiser (1851)","url":"https://bookmarks.reviews/the-original-1851-reviews-of-moby-dick/"},{"quote":"the artist has succeeded in investing objects apparently the most unattractive with an absorbing fascination","attribution":"John Bull (1851)","url":"https://bookmarks.reviews/the-original-1851-reviews-of-moby-dick/"},{"quote":"surpasses any of the former productions of this highly successful author","attribution":"George Ripley, Harper's New Monthly Magazine (1851)","url":"https://bookmarks.reviews/the-original-1851-reviews-of-moby-dick/"}],"genres":["Classic","Adventure","Sea Story"]},"Beach Read":{"teaser":"A romance novelist who has stopped believing in love and a literary writer with writer's block end up neighbours for a summer, and dare each other to swap genres.","blurbs":[{"quote":"Readers are sure to fall hard for this meta, heartfelt take on the romance genre.","attribution":"Publishers Weekly (starred review)","url":"https://www.penguinrandomhouse.com/books/608898/beach-read-by-emily-henry/"},{"quote":"A heartfelt look at taking second chances, in life and in love.","attribution":"Kirkus Reviews","url":"https://www.penguinrandomhouse.com/books/608898/beach-read-by-emily-henry/"},{"quote":"That Henry can manage to both pack a fierce emotional wallop and spear literary posturing…","attribution":"Entertainment Weekly","url":"https://www.penguinrandomhouse.com/books/608898/beach-read-by-emily-henry/"}],"genres":["Romance","Contemporary"]},"The Silent Patient":{"teaser":"A celebrated London painter shoots her husband and then never speaks again. Years later a criminal psychotherapist takes a post at her secure unit, determined to make her talk.","blurbs":[{"quote":"That rarest of beasts: the perfect thriller.","attribution":"A. J. Finn, author of The Woman in the Window","url":"https://celadonbooks.com/book/the-silent-patient/"},{"quote":"Smart, sophisticated storytelling freighted with real suspense—a very fine novel by any standard.","attribution":"Lee Child","url":"https://celadonbooks.com/book/the-silent-patient/"},{"quote":"Alex Michaelides has written one of the best psychological thrillers I have ever read.","attribution":"Blake Crouch, author of Dark Matter","url":"https://celadonbooks.com/book/the-silent-patient/"}],"genres":["Psychological Thriller","Mystery"]},"Rock Paper Scissors":{"teaser":"A couple whose ten-year marriage is failing spend a weekend at a remote converted chapel in the Scottish Highlands. Both are keeping things back, and the snow is closing in.","blurbs":[{"quote":"This complicated gothic thriller of dueling spouses and homicidal writers is cleverly plotted…","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/alice-feeney/rock-paper-scissors-feeney/"},{"quote":"Feeney's signature misdirection sets up gasp-worthy twists down the stretch…","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781250266101"},{"quote":"This book was highly unpredictable with a unique premise.","attribution":"The Concord Insider","url":"https://www.theconcordinsider.com/2022/03/24/book-rock-paper-scissors/"}],"genres":["Psychological Thriller","Domestic Suspense"]},"Rebecca":{"teaser":"A shy young bride arrives at Manderley, her new husband's grand Cornish estate, and finds the house and its staff still ruled by the memory of his first wife.","blurbs":[{"quote":"One of the most influential novels of the twentieth century","attribution":"Sarah Waters","url":"https://www.virago.co.uk/titles/daphne-du-maurier-2/rebecca/9780349010267/"},{"quote":"Excellent entertainment... du Maurier created a scale by which modern women can measure their feelings.","attribution":"Stephen King","url":"https://www.hachettebookgroup.com/titles/daphne-du-maurier/rebecca/9780316575201/"},{"quote":"Rebecca is a masterpiece in which du Maurier pulls off several spectacular high-wire acts…","attribution":"Jim Crace, The Guardian","url":"https://www.virago.co.uk/titles/daphne-du-maurier-2/rebecca/9780349010267/"}],"genres":["Gothic","Suspense","Classic"]},"The Book Thief":{"teaser":"In Nazi Germany a foster girl outside Munich learns to read, steals books wherever she can find them, and shares them with the neighbours sheltering in the cellar. Death narrates.","blurbs":[{"quote":"Elegant, philosophical and moving...Beautiful and important.","attribution":"Kirkus Reviews (starred review)","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780375842207"},{"quote":"Brilliant and hugely ambitious…It's the kind of book that can be life-changing","attribution":"The New York Times","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780375842207"},{"quote":"Zusak doesn't sugarcoat anything, but he makes his ostensibly gloomy subject bearable…","attribution":"Time Magazine","url":"https://penguinrandomhousehighereducation.com/book/?isbn=9780375842207"}],"genres":["Historical Fiction","Second World War","Young Adult"]},"Call For The Dead":{"teaser":"A Foreign Office civil servant kills himself after a routine security interview, and George Smiley, quiet and unglamorous, refuses to accept the obvious explanation. Le Carré's first novel.","blurbs":[{"quote":"A subtle and acute story of counterespionage marked by restraint, indirection, and intelligence.","attribution":"The New York Times Book Review","url":"https://www.penguinrandomhouse.com/books/312131/call-for-the-dead-by-john-le-carre/"},{"quote":"Intelligent, thrilling, surprising … makes most cloak-and-dagger stuff taste of cardboard.","attribution":"Sunday Telegraph (London)","url":"https://www.penguinrandomhouse.com/books/312131/call-for-the-dead-by-john-le-carre/"},{"quote":"Brilliant. Realistic. Constant suspense…excellent writing.","attribution":"The Observer (London)","url":"https://www.penguinrandomhouse.com/books/312131/call-for-the-dead-by-john-le-carre/"}],"genres":["Spy Fiction","Crime"]},"The First Fifteen Lives of Harry August":{"teaser":"Harry August dies and is born again into the same life, over and over, remembering everything. In his eleventh life a dying girl brings him a message about the end of the world.","blurbs":[{"quote":"…is one of the top ten books I've ever read.","attribution":"James Dashner, author of The Maze Runner","url":"https://www.hachettebookgroup.com/titles/claire-north/the-first-fifteen-lives-of-harry-august/9780316399623/"},{"quote":"An astonishing re-invention of the time travel narrative. Bold, magical and masterful.","attribution":"Mike Carey","url":"https://www.hachettebookgroup.com/titles/claire-north/the-first-fifteen-lives-of-harry-august/9780316399623/"},{"quote":"A subtle study of friendship, love and the complexity of existence.","attribution":"Eric Brown, The Guardian","url":"https://www.hachettebookgroup.com/titles/claire-north/the-first-fifteen-lives-of-harry-august/9780316399623/"}],"genres":["Science Fiction","Time Loop"]},"One Hundred Years of Solitude":{"teaser":"Seven generations of the Buendía family rise and fall in Macondo, the remote town they founded, where the miraculous and the everyday are impossible to tell apart.","blurbs":[{"quote":"The greatest novel in any language of the last 50 years","attribution":"Salman Rushdie","url":"https://www.penguin.com.au/books/one-hundred-years-of-solitude-9780241968581"},{"quote":"Should be required reading for the entire human race","attribution":"The New York Times","url":"https://www.penguin.com.au/books/one-hundred-years-of-solitude-9780241968581"},{"quote":"The book that sort of saved my life","attribution":"Emma Thompson","url":"https://www.penguin.com.au/books/one-hundred-years-of-solitude-9780241968581"}],"genres":["Magical Realism","Classic","Latin American"]},"The Wind-Up Bird Chronicle":{"teaser":"An unemployed Tokyo man's search for his wife's missing cat pulls him into a widening mystery of strange callers, dry wells and unresolved wartime history.","blurbs":[{"quote":"Dreamlike and compelling…. Murakami is a genius.","attribution":"Chicago Tribune","url":"https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/"},{"quote":"Seductive…. A labyrinth designed by a master, at once familiar and irresistibly strange.","attribution":"San Francisco Chronicle","url":"https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/"},{"quote":"A significant advance in Murakami's art … a bold and generous book.","attribution":"The New York Times Book Review","url":"https://www.penguinrandomhouse.com/books/118727/the-wind-up-bird-chronicle-by-haruki-murakami/"}],"genres":["Magical Realism","Literary Fiction","Japanese Fiction"]},"East of Eden":{"teaser":"In California's Salinas Valley, two families across three generations replay the rivalry of Cain and Abel, wrestling with inheritance, jealousy and whether a person can choose to be good.","blurbs":[{"quote":"A novel planned on the grandest possible scale . . .","attribution":"The New York Herald Tribune","url":"https://www.penguinrandomhouse.com/books/354458/east-of-eden-by-john-steinbeck-introduction-by-david-wyatt-suggestions-for-further-explorationby-susan-shillinglaw/"},{"quote":"A fantasia and myth . . . A strange and original work of art","attribution":"The New York Times Book Review","url":"https://www.penguinrandomhouse.com/books/354458/east-of-eden-by-john-steinbeck-introduction-by-david-wyatt-suggestions-for-further-explorationby-susan-shillinglaw/"},{"quote":"A moving, crying pageant with wilderness strengths.","attribution":"Carl Sandburg","url":"https://www.penguinrandomhouse.com/books/354458/east-of-eden-by-john-steinbeck-introduction-by-david-wyatt-suggestions-for-further-explorationby-susan-shillinglaw/"}],"genres":["Literary Fiction","Family Saga","Classic"]},"Of Mice and Men":{"teaser":"Two migrant ranch hands, quick-witted George and the powerful, gentle Lennie, drift through Depression-era California chasing a shared dream of a small farm of their own.","blurbs":[{"quote":"Of Mice and Men is a thriller, a gripping tale running to novelette length…","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/354251/of-mice-and-men-by-john-steinbeck/"},{"quote":"Brutality and tenderness mingle in these strangely moving pages.","attribution":"Chicago Tribune","url":"https://www.penguinrandomhouse.com/books/354251/of-mice-and-men-by-john-steinbeck/"},{"quote":"A short tale of much power and beauty.","attribution":"Times Literary Supplement [London]","url":"https://www.penguinrandomhouse.com/books/354251/of-mice-and-men-by-john-steinbeck/"}],"genres":["Classic","Literary Fiction","Novella"]},"The Seven Husbands of Evelyn Hugo":{"teaser":"A reclusive Hollywood legend finally agrees to tell her life story, choosing an unknown magazine journalist to hear the truth behind her glamorous career and seven marriages.","blurbs":[{"quote":"Reid's heroine reveals her darkest secrets as if she were wiping off makeup…","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/taylor-jenkins-reid/the-seven-husbands-of-evelyn-hugo/"},{"quote":"Riveting, heart-wrenching and full of Old Hollywood glamour","attribution":"BuzzFeed","url":"https://www.simonandschuster.co.uk/books/The-Seven-Husbands-of-Evelyn-Hugo/Taylor-Jenkins-Reid/9781398515697"},{"quote":"This wildly addictive journey of a reclusive Hollywood starlet and her tumultuous Tinseltown journey…","attribution":"PopSugar","url":"https://www.simonandschuster.co.uk/books/The-Seven-Husbands-of-Evelyn-Hugo/Taylor-Jenkins-Reid/9781398515697"}],"genres":["Historical Fiction","Romance"]},"The Boy, the Mole, the Fox and the Horse":{"teaser":"An illustrated book of brief, hand-lettered conversations between four unlikely friends, wandering through ink-and-watercolour landscapes and talking about kindness, fear, courage and asking for help.","blurbs":[{"quote":"Simply, the world needs Charlie's work right now.","attribution":"Miranda Hart","url":"https://www.penguin.co.uk/books/439667/the-boy-the-mole-the-fox-and-the-horse-by-mackesy-charlie/9781529105100"},{"quote":"A wonderful work of art and a wonderful window into the human heart.","attribution":"Richard Curtis","url":"https://www.penguin.co.uk/books/439667/the-boy-the-mole-the-fox-and-the-horse-by-mackesy-charlie/9781529105100"},{"quote":"Those in need of peace will find it between the covers…","attribution":"The New York Times","url":"https://www.penguin.co.uk/books/439667/the-boy-the-mole-the-fox-and-the-horse-by-mackesy-charlie/9781529105100"}],"genres":["Illustrated","Philosophy","Feel-good"]},"Happy Place":{"teaser":"Harriet and Wyn broke up months ago but never told their closest friends, so they fake being a couple through one last annual week together in Maine.","blurbs":[{"quote":"This has the makings of a rom-com classic.","attribution":"Publishers Weekly","url":"https://www.penguinrandomhouse.com/books/704944/happy-place-by-emily-henry/"},{"quote":"Another knock-out from the champ. The woman doesn't miss.","attribution":"Taylor Jenkins Reid","url":"https://www.penguinrandomhouse.com/books/704944/happy-place-by-emily-henry/"},{"quote":"Henry's latest rom-com is a charming, heartwarming read about second-chance romance.","attribution":"USA Today","url":"https://www.penguinrandomhouse.com/books/704944/happy-place-by-emily-henry/"}],"genres":["Romance","Contemporary"]},"The Bitch":{"teaser":"On Colombia's storm-battered Pacific coast, a childless woman living in poverty takes in an orphaned puppy, and the fierce bond that grows between them unsettles everything around her.","blurbs":[{"quote":"Unforgettable. . . a powerful, jolting tale about class, motherhood and rage.","attribution":"The Guardian","url":"https://www.barnesandnoble.com/w/the-bitch-pilar-quintana/1133785089"},{"quote":"A perfect book.","attribution":"Kiran Desai, author of The Loneliness of Sonia and Sunny","url":"https://www.barnesandnoble.com/w/the-bitch-pilar-quintana/1133785089"},{"quote":"A somber and sensitive dog-and-owner tale scrubbed clean of the genre's usual sweetness.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/pilar-quintana/bitch-quintana/"}],"genres":["Literary Fiction","Colombian","Novella"]},"The Paper Menagerie and Other Stories":{"teaser":"Fifteen speculative short stories ranging across science fiction, fantasy and alternate history, returning again and again to family, memory, immigration and the weight of the past.","blurbs":[{"quote":"I have never been so moved by a collection of short fiction.","attribution":"Amal El-Mohtar, NPR","url":"https://www.npr.org/2016/03/13/468942030/no-paper-tiger-this-menagerie-is-full-of-fierce-feeling"},{"quote":"Gracefully written and often profoundly moving, these stories are high-water marks of contemporary speculative fiction.","attribution":"Publishers Weekly (starred review)","url":"https://kenliu.name/blog/book/the-paper-menagerie-and-other-stories/"},{"quote":"These remarkable stories highlight Liu's themes of family, love, and…","attribution":"Library Journal (starred review)","url":"https://kenliu.name/blog/book/the-paper-menagerie-and-other-stories/"}],"genres":["Science Fiction","Short Stories","Fantasy"]},"A Man Called Ove":{"teaser":"A curmudgeonly Swedish widower with strong opinions about rules, cars and neighbours finds his rigid solitude repeatedly invaded by the boisterous young family who move in next door.","blurbs":[{"quote":"...it would be hard to beat grumpy Ove and his hidden, generous heart.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/fredrik-backman/a-man-called-ove/"},{"quote":"...a fuzzy crowd-pleaser that serves up laughs to accompany a thoughtful reflection on loss...","attribution":"Publishers Weekly","url":"https://www.publishersweekly.com/9781476738024"},{"quote":"It's warm, funny, and ultimately almost unbearably moving.","attribution":"Daily Mail","url":"https://www.hachette.com.au/fredrik-backman/a-man-called-ove-the-global-bestselling-phenomenon"}],"genres":["Contemporary Fiction","Humour","Feel-good"]},"We Have Always Lived in the Castle":{"teaser":"Merricat Blackwood lives with her adored sister Constance and ailing uncle in a grand house shunned by the nearby village, until a cousin arrives and unsettles their cloistered routine.","blurbs":[{"quote":"Her greatest book ... at once whimsical and harrowing","attribution":"Donna Tartt","url":"https://www.penguin.co.uk/books/133431/we-have-always-lived-in-the-castle-by-jackson-shirley/9780241685044"},{"quote":"...you have missed out on something marvellous.","attribution":"Neil Gaiman","url":"https://www.penguin.co.uk/books/133431/we-have-always-lived-in-the-castle-by-jackson-shirley/9780241685044"},{"quote":"A masterpiece of Gothic suspense.","attribution":"Joyce Carol Oates","url":"https://www.penguin.co.uk/books/133431/we-have-always-lived-in-the-castle-by-jackson-shirley/9780241685044"}],"genres":["Gothic","Mystery","Classic"]},"How to Know a Person":{"teaser":"Brooks argues that truly seeing another person is a learnable skill, drawing on psychology, philosophy and his own failures to offer practical ways to listen, converse and understand.","blurbs":[{"quote":"A hands-on guide to making meaningful human connections.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/david-brooks/how-to-know-a-person/"},{"quote":"Original and useful… Brooks is a chatty, likeable guide","attribution":"The TLS (Times Literary Supplement)","url":"https://www.penguin.com.au/books/how-to-know-a-person-9780241670293"},{"quote":"I raced through the book, which is well-structured and engagingly written","attribution":"Sophie McBain, The New Statesman","url":"https://www.penguin.com.au/books/how-to-know-a-person-9780241670293"}],"genres":["Psychology","Relationships"]},"The Secret History":{"teaser":"A scholarship student joins an elite, insular circle of classics undergraduates at a small Vermont college, where an intoxicating world of Greek and privilege drifts toward moral catastrophe.","blurbs":[{"quote":"Powerful . . . Enthralling . . . A ferociously well-paced entertainment.","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/176619/the-secret-history-by-donna-tartt/"},{"quote":"A beautifully written story, well-told, funny, sad, scary, and impossible to leave alone...","attribution":"John Grisham","url":"https://www.penguinrandomhouse.com/books/176619/the-secret-history-by-donna-tartt/"},{"quote":"A smart, craftsman-like, viscerally compelling novel.","attribution":"Time","url":"https://www.penguinrandomhouse.com/books/176619/the-secret-history-by-donna-tartt/"}],"genres":["Literary Fiction","Dark Academia","Mystery"]},"The Stranger":{"teaser":"In French Algiers, an emotionally detached young clerk drifts through his mother's funeral, an easy love affair, and a sun-struck act of violence that leaves society to judge his indifference.","blurbs":[{"quote":"Matthew Ward has done Camus and us a great service.","attribution":"Chicago Sun-Times","url":"https://www.penguinrandomhouse.com/books/23477/the-stranger-by-albert-camus-translated-by-matthew-ward-introduction-by-keith-gore/"},{"quote":"No book in contemporary literature points with such soberness and directness...","attribution":"The New Republic","url":"https://newrepublic.com/article/115492/albert-camus-stranger"}],"genres":["Classic","Philosophical Fiction","Existentialism"]},"The Remains of the Day":{"teaser":"An ageing English butler takes a motoring holiday through the West Country in 1956, reflecting on decades of service at Darlington Hall and on the housekeeper he once worked beside.","blurbs":[{"quote":"An intricate and dazzling novel.","attribution":"The New York Times","url":"https://www.penguinrandomhouse.com/books/85611/the-remains-of-the-day-by-kazuo-ishiguro-introduction-by-salman-rushdie/"},{"quote":"A perfect novel. I couldn't put it down.","attribution":"Ann Beattie","url":"https://www.penguinrandomhouse.com/books/85611/the-remains-of-the-day-by-kazuo-ishiguro-introduction-by-salman-rushdie/"},{"quote":"Brilliant and quietly devastating.","attribution":"Newsweek","url":"https://www.penguinrandomhouse.com/books/85611/the-remains-of-the-day-by-kazuo-ishiguro-introduction-by-salman-rushdie/"}],"genres":["Literary Fiction","Historical Fiction"]},"Solaris":{"teaser":"A psychologist arrives at a research station orbiting a planet covered by a vast, possibly sentient ocean, where the crew are being confronted by impossible visitors drawn from their memories.","blurbs":[{"quote":"It all gleams with portent.","attribution":"Kirkus Reviews","url":"https://www.kirkusreviews.com/book-reviews/stanislaw-lem/solaris/"},{"quote":"A novel that makes you reevaluate the nature of intelligence itself.","attribution":"Anne McCaffrey","url":"https://www.abebooks.com/9780156027601/Solaris-Novel-Lem-Stanislaw-0156027607/plp"},{"quote":"Solaris, a quintessential novel of science fiction's New Wave movement...","attribution":"Reactor","url":"https://reactormag.com/2019/08/01/embracing-the-impossible-puzzle-of-stanislaw-lems-solaris/"}],"genres":["Science Fiction","Philosophical Fiction"]},"Piranesi":{"teaser":"A man lives alone in an infinite labyrinth of statue-filled halls washed by tides, keeping meticulous journals, until signs of another presence begin to unsettle his ordered wo function slug(b){
  return (b.year+'-'+b.period+'-'+(b.title||'break')).toLowerCase().replace(/[^a-z0-9]+/g,'-');
}

/* ---------- star ratings (Supabase, no accounts) ----------
   Anyone can rate; a random id cached in this browser's localStorage identifies
   the DEVICE, not a person, so a return visit updates its own vote instead of
   duplicating it. That's the whole boundary a no-login system can offer — see
   the RLS policies in supabase_setup.sql for the actual enforcement.
   SUPABASE_URL/SUPABASE_ANON_KEY start blank; until they're filled in, the
   feature just stays invisible (see .m-rating[data-ready]) — the rest of the
   site works exactly as before. */
const SUPABASE_URL = 'https://uovqsqnxcgvefxpxntcj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VTOzRUebaH_xQAs4wngfug_jCVCeCFB';
const RATINGS_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

const VOTER_KEY = 'jpbooks-voter-id';
function getVoterId(){
  let id = localStorage.getItem(VOTER_KEY);
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'v-'+Date.now()+'-'+Math.random().toString(16).slice(2));
    localStorage.setItem(VOTER_KEY, id);
  }
  return id;
}

const STAR_PATH = 'M12 2.5l2.9 6.06 6.6.82-4.85 4.6 1.28 6.6L12 17.5l-5.93 3.08 1.28-6.6L2.5 9.38l6.6-.82Z';
function starRowSVG(){
  return Array.from({length:5}, ()=>`<svg viewBox="0 0 24 24"><path d="${STAR_PATH}"/></svg>`).join('');
}
function starRowHTML(){
  return `<span class="star-row-bg">${starRowSVG()}</span><span class="star-row-fg" style="width:0%">${starRowSVG()}</span>`;
}
function setStarFill(rowEl, fraction){
  const fg = rowEl && rowEl.querySelector('.star-row-fg');
  if(fg) fg.style.width = (Math.max(0, Math.min(1, fraction)) * 100) + '%';
}

let ratingsCache = {};             // bookSlug -> { sum, count, mine }
let currentModalSlug = null;       // which book the open modal's rating row talks to
let currentModalBook = null;

async function loadRatings(){
  if(!RATINGS_ENABLED) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/book_ratings?select=book_slug,voter_id,rating`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(!res.ok) return;
    const rows = await res.json();
    const me = getVoterId();
    const next = {};
    rows.forEach(r=>{
      const s = next[r.book_slug] || (next[r.book_slug] = {sum:0, count:0, mine:0});
      s.sum += Number(r.rating); s.count += 1;
      if(r.voter_id === me) s.mine = Number(r.rating);
    });
    ratingsCache = next;
  } catch(e){ /* offline, or not configured yet — the widget just stays hidden this visit */ }
  // a modal may already be open and waiting on this fetch to resolve
  if(currentModalBook) renderRatingUI(currentModalBook, currentModalSlug);
}

function aggFor(bslug){
  return ratingsCache[bslug] || (ratingsCache[bslug] = {sum:0, count:0, mine:0});
}

function renderRatingUI(book, bslug){
  const wrap = document.getElementById('mRating');
  if(!RATINGS_ENABLED){ wrap.dataset.ready = 'false'; return; }
  wrap.dataset.ready = 'true';

  const agg = aggFor(bslug);
  const avg = agg.count ? agg.sum / agg.count : 0;

  const avgRow = document.getElementById('ratingAvgStars');
  avgRow.innerHTML = starRowHTML();
  setStarFill(avgRow, avg / 5);
  document.getElementById('ratingAvgText').textContent =
    agg.count ? `${avg.toFixed(1)} (${agg.count} rating${agg.count===1?'':'s'})` : 'No ratings yet';

  const inputRow = document.getElementById('ratingInput');
  inputRow.innerHTML = starRowHTML();
  setStarFill(inputRow, (agg.mine || 0) / 5);
  inputRow.setAttribute('aria-valuenow', agg.mine || 0.5);
  inputRow.setAttribute('aria-valuetext', agg.mine ? `${agg.mine} stars` : 'not yet rated');
  document.getElementById('ratingNote').dataset.show = 'false';
}

function commitRating(value){
  if(!currentModalSlug) return;
  submitRating(currentModalSlug, value);            // updates ratingsCache optimistically, then POSTs
  renderRatingUI(currentModalBook, currentModalSlug); // re-render both the input and the average from that update
  const note = document.getElementById('ratingNote');
  note.dataset.show = 'true';
  clearTimeout(commitRating._t);
  commitRating._t = setTimeout(()=>{ note.dataset.show = 'false'; }, 1800);
}

async function submitRating(bookSlug, value){
  const agg = aggFor(bookSlug);
  // optimistic: the UI reflects the new vote immediately, the network call trails behind
  agg.sum += agg.mine ? (value - agg.mine) : value;
  if(!agg.mine) agg.count += 1;
  agg.mine = value;

  if(!RATINGS_ENABLED) return;
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/book_ratings`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ book_slug: bookSlug, voter_id: getVoterId(), rating: value })
    });
  } catch(e){ /* the optimistic local update stands for this visit either way */ }
}

function ratingValueFromEvent(rowEl, e){
  const r = rowEl.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const frac = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return Math.max(0.5, Math.min(5, Math.ceil(frac * 10) / 2));   // snapped to the nearest half star
}

const OVERRIDES_KEY = 'jpbooks-cover-overrides';
function getOverrides(){ try{ return JSON.parse(localStorage.getItem(OVERRIDES_KEY)||'{}'); }catch(e){ return {}; } }
function setOverride(key, url){
  const o = getOverrides();
  if(url) o[key] = url; else delete o[key];
  localStorage.setItem(OVERRIDES_KEY, JSON.stringify(o));
}
function coverFor(b){
  const o = getOverrides();
  const k = slug(b);
  if(o[k]) return o[k];
  return b.cover || null;
}

const ICON_BOOK = `<svg class="p-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>`;
const ICON_CHEV_L = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
const ICON_CHEV_R = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
const ICON_PENCIL = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

const yearsRoot = document.getElementById('years');
const carousels = {}; // year -> {active, items, els}

years.forEach(y=>{
  /* The newest year is the one still in progress, so it opens on the most
     recent pick — you land on "what we're reading now". Finished years stay in
     reading order, which is how a diary reads back. */
  const isCurrentYear = (y === years[0]);
  const items = isCurrentYear
    ? DATA.filter(b=>b.year===y).slice().reverse()
    : DATA.filter(b=>b.year===y);
  const color = YEAR_COLORS[y] || '#333';

  const section = document.createElement('section');
  section.className = 'year-section';
  section.id = 'y'+y;
  section.style.setProperty('--yr-color', color);

  const nonBreakCount = items.filter(b=>!b.break).length;
  section.innerHTML = `
    <div class="year-head">
      <span class="num">${y}</span>
      <span class="meta"><b>${nonBreakCount}</b> book${nonBreakCount===1?'':'s'}</span>
    </div>
    <div class="carousel-wrap">
      <div class="carousel" data-year="${y}"></div>
    </div>
    <div class="click-hint">click for more</div>
    <div class="carousel-nav">
      <button class="nav-btn" data-dir="-1" data-year="${y}">${ICON_CHEV_L}</button>
      <div class="dots" data-year="${y}"></div>
      <button class="nav-btn" data-dir="1" data-year="${y}">${ICON_CHEV_R}</button>
    </div>
    <div class="book-detail" data-year="${y}"></div>
  `;
  yearsRoot.appendChild(section);

  const carouselEl = section.querySelector('.carousel');
  const dotsEl = section.querySelector('.dots');
  const detailEl = section.querySelector('.book-detail');

  const cardEls = items.map((b, i)=>{
    const el = document.createElement('div');
    el.className = 'card' + (b.break ? ' is-break' : '');
    el.dataset.index = i;

    if(b.break){
      el.innerHTML = `
        <div class="placeholder">
          ${ICON_BOOK}
          <div class="p-title">${b.note || 'Break'}</div>
          <div class="p-author">${b.period}</div>
        </div>
      `;
    } else {
      const cover = coverFor(b);
      const coverHtml = cover
        ? `<img class="cover-img" src="${cover}" alt="${b.title} cover" loading="lazy" decoding="async">`
        : `<div class="placeholder">${ICON_BOOK}<div class="p-title">${b.title}</div><div class="p-author">${b.author}</div></div>`;
      el.innerHTML = `
        ${coverHtml}
        <div class="gradient"></div>
        <span class="badge">${b.period}</span>
        ${b.nonfiction ? '<span class="nf-badge">Non-fiction</span>' : ''}
        <div class="card-foot">
          <div class="t">${b.title}</div>
          <div class="a">${b.author}</div>
        </div>
        <button class="edit-btn" type="button" aria-label="Edit cover">${ICON_PENCIL}</button>
      `;
    }
    carouselEl.appendChild(el);
    return el;
  });

  items.forEach((b,i)=>{
    if(b.break) return;
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.dataset.index = i;
    dot.addEventListener('click', ()=> setActive(y, i));
    dotsEl.appendChild(dot);
  });

  carousels[y] = { items, cardEls, active: 0, dotsEl, detailEl, carouselEl };

  function layout(){
    const st = carousels[y];
    /* card width is height-driven now, so the fan spacing has to be measured
       rather than hard-coded — otherwise big cards overlap into a solid block */
    const cardW = st.cardEls[0] ? st.cardEls[0].getBoundingClientRect().width : 190;
    const step = Math.max(34, cardW * 0.36);
    st.cardEls.forEach((el, i)=>{
      const offset = i - st.active;
      const abs = Math.abs(offset);
      const clamped = Math.max(-4, Math.min(4, offset));
      const x = clamped * step;
      const rot = clamped * 7;
      const scale = Math.max(0.62, 1 - abs*0.11);
      const z = 100 - abs;
      const opacity = abs > 4 ? 0 : Math.max(0.15, 1 - abs*0.22);
      el.style.transform = `translateX(${x}px) rotate(${rot}deg) scale(${scale})`;
      el.style.zIndex = z;
      el.style.opacity = opacity;
      el.classList.toggle('is-active', offset===0);
    });
    st.dotsEl.querySelectorAll('.dot').forEach(d=>{
      d.dataset.active = (+d.dataset.index === st.active);
    });
    const b = st.items[st.active];
    if(b.break){
      st.detailEl.innerHTML = `<div class="d-period">${b.period}</div><h3>${b.note||'Break'}</h3>`;
    } else {
      const gr = `https://www.goodreads.com/search?q=${encodeURIComponent(b.title+' '+b.author)}`;
      st.detailEl.innerHTML = `
        <div class="d-period">${b.period} ${y}</div>
        <h3>${b.title}</h3>
        <div class="d-author">${b.author}</div>
        <div class="d-sub">${b.country || ''}${b.published ? ' · first published '+b.published : ''}</div>
        <a class="d-link" href="${gr}" target="_blank" rel="noopener">View on Goodreads ↗</a>
      `;
    }
  }
  carousels[y].layout = layout;
  layout();

  cardEls.forEach((el,i)=>{
    const editBtn = el.querySelector('.edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        openEditPop(el, items[i]);
      });
    }
  });

  /* Which card was tapped is resolved on pointerup rather than with a click
     listener on each card: as soon as a drag crosses the capture threshold the
     browser retargets the click to the carousel, so a per-card click handler
     silently never fires — a nudge of the mouse mid-click would do nothing. */
  let dragging = false, startX = 0, moved = 0, captured = false, downIdx = -1;
  carouselEl.addEventListener('pointerdown', (e)=>{
    dragging = true; startX = e.clientX; moved = 0; captured = false;
    const card = e.target.closest('.card');
    downIdx = (card && !e.target.closest('.edit-btn')) ? cardEls.indexOf(card) : -1;
  });
  carouselEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    moved = e.clientX - startX;
    if(!captured && Math.abs(moved) > 6){
      captured = true;
      carouselEl.classList.add('dragging');
      carouselEl.setPointerCapture(e.pointerId);
    }
  });
  function endDrag(isUp){
    if(!dragging) return;
    dragging = false;
    carouselEl.classList.remove('dragging');
    if(Math.abs(moved) > 40){
      shift(y, moved < 0 ? 1 : -1);
    } else if(isUp && downIdx >= 0 && Math.abs(moved) <= 6){
      // a genuine tap: centred card opens up, a fanned one just comes to the front
      if(downIdx === carousels[y].active){
        if(!items[downIdx].break) openBookModal(items[downIdx], y);
      } else {
        setActive(y, downIdx);
      }
    }
    captured = false; moved = 0; downIdx = -1;
  }
  carouselEl.addEventListener('pointerup', ()=> endDrag(true));
  carouselEl.addEventListener('pointercancel', ()=> endDrag(false));
  carouselEl.addEventListener('pointerleave', ()=>{ if(dragging) endDrag(false); });

  // keyboard: left/right arrows step through the year's books
  carouselEl.setAttribute('tabindex', '0');
  carouselEl.setAttribute('aria-label', `${y} carousel — use left and right arrow keys to browse`);
  carouselEl.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft'){ e.preventDefault(); shift(y, -1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); shift(y, 1); }
  });
});

function setActive(y, i){
  const st = carousels[y];
  st.active = Math.max(0, Math.min(st.items.length-1, i));
  st.layout();
}
function shift(y, dir){
  const st = carousels[y];
  setActive(y, st.active + dir);
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    shift(+btn.dataset.year, +btn.dataset.dir);
  });
});

// card size follows viewport height, so the fan spacing must be recomputed on resize
let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ years.forEach(y=> carousels[y].layout()); }, 120);
});

// open on the most recent year, tabs run newest → oldest
showYear(years[0]);

// ---- book modal ----
const bookModal   = document.getElementById('bookModal');
const mTeaser     = document.getElementById('mTeaser');
const mBlurbs     = document.getElementById('mBlurbs');
let lastFocused = null;

function openBookModal(b, y){
  const info = BOOKINFO[b.title] || {};

  document.getElementById('mCover').src = coverFor(b) || '';
  document.getElementById('mCover').alt = b.title + ' cover';
  document.getElementById('mPeriod').textContent = `${b.period} ${y}`;
  document.getElementById('mTitle').textContent  = b.title;
  document.getElementById('mAuthor').textContent = b.author;
  document.getElementById('mSub').textContent =
    `${b.country || ''}${b.published ? ' · first published ' + b.published : ''}`;

  const link = document.getElementById('mLink');
  link.href = `https://www.goodreads.com/search?q=${encodeURIComponent(b.title + ' ' + b.author)}`;

  mTeaser.textContent = info.teaser || '';

  document.getElementById('mGenres').innerHTML =
    (b.nonfiction ? '<span class="genre-tag is-nf">Non-fiction</span>' : '') +
    (info.genres || []).map(g=>`<span class="genre-tag">${g}</span>`).join('');

  const blurbs = info.blurbs || [];
  if(blurbs.length){
    mBlurbs.innerHTML =
      '<div class="blurbs-head">What the reviews said</div>' +
      blurbs.map(bl=>
        `<blockquote class="blurb"><q>${bl.quote}</q><cite>— ${bl.attribution}</cite></blockquote>`
      ).join('');
    mBlurbs.style.display = 'flex';
  } else {
    mBlurbs.innerHTML = '';
    mBlurbs.style.display = 'none';
  }

  const section = document.getElementById('y'+y);
  bookModal.style.setProperty('--yr-color', getComputedStyle(section).getPropertyValue('--yr-color'));

  currentModalBook = b;
  currentModalSlug = slug(b);
  renderRatingUI(b, currentModalSlug);

  lastFocused = document.activeElement;
  bookModal.dataset.show = 'true';
  bookModal.setAttribute('aria-hidden', 'false');
  document.getElementById('bookClose').focus();
}

function closeBookModal(){
  bookModal.dataset.show = 'false';
  bookModal.setAttribute('aria-hidden', 'true');
  currentModalBook = null;
  currentModalSlug = null;
  if(lastFocused) lastFocused.focus();
}

document.getElementById('bookClose').addEventListener('click', closeBookModal);
bookModal.addEventListener('click', (e)=>{ if(e.target === bookModal) closeBookModal(); });

// ---- rating input: hover previews, click or arrow keys commit immediately ----
const ratingInputEl = document.getElementById('ratingInput');
ratingInputEl.addEventListener('mousemove', (e)=>{
  setStarFill(ratingInputEl, ratingValueFromEvent(ratingInputEl, e) / 5);
});
ratingInputEl.addEventListener('mouseleave', ()=>{
  if(!currentModalSlug) return;
  setStarFill(ratingInputEl, (aggFor(currentModalSlug).mine || 0) / 5);
});
ratingInputEl.addEventListener('click', (e)=> commitRating(ratingValueFromEvent(ratingInputEl, e)));
ratingInputEl.addEventListener('keydown', (e)=>{
  if(!currentModalSlug) return;
  const mine = aggFor(currentModalSlug).mine || 0;
  if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); commitRating(Math.min(5, mine + 0.5)); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); commitRating(Math.max(0.5, (mine || 0.5) - 0.5)); }
});

loadRatings();
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && bookModal.dataset.show === 'true') closeBookModal();
});

// ---- edit mode ----
// Cover editing is for John only, not something a random visitor should stumble
// onto — the button stays out of the DOM's visible flow entirely unless the
// page is opened with ?edit in the URL (e.g. johnplusbooks.com/?edit).
const ADMIN_MODE = new URLSearchParams(location.search).has('edit');
const editModeBtn = document.getElementById('editModeBtn');
if(ADMIN_MODE) editModeBtn.style.display = '';
editModeBtn.addEventListener('click', ()=>{
  const on = document.body.classList.toggle('edit-mode');
  editModeBtn.dataset.on = on;
  editModeBtn.textContent = on ? 'Done editing' : 'Edit covers';
  document.getElementById('exportBtn').style.display = (ADMIN_MODE && Object.keys(getOverrides()).length) ? 'inline-block' : 'none';
});

const editPop = document.getElementById('editPop');
const editUrl = document.getElementById('editUrl');
let editingBook = null;
function openEditPop(cardEl, book){
  editingBook = book;
  const r = cardEl.getBoundingClientRect();
  editPop.style.left = (r.left + window.scrollX) + 'px';
  editPop.style.top = (r.bottom + window.scrollY + 8) + 'px';
  editUrl.value = getOverrides()[slug(book)] || '';
  editPop.dataset.show = 'true';
  editUrl.focus();
}
document.getElementById('editApply').addEventListener('click', ()=>{
  if(!editingBook) return;
  setOverride(slug(editingBook), editUrl.value.trim());
  editPop.dataset.show = 'false';
  carousels[editingBook.year].layout(); // relayout to refresh dots/detail
  rebuildCard(editingBook);
  document.getElementById('exportBtn').style.display = (ADMIN_MODE && Object.keys(getOverrides()).length) ? 'inline-block' : 'none';
});
document.getElementById('editReset').addEventListener('click', ()=>{
  if(!editingBook) return;
  setOverride(slug(editingBook), null);
  editPop.dataset.show = 'false';
  rebuildCard(editingBook);
  document.getElementById('exportBtn').style.display = (ADMIN_MODE && Object.keys(getOverrides()).length) ? 'inline-block' : 'none';
});
document.addEventListener('click', (e)=>{
  if(editPop.dataset.show === 'true' && !editPop.contains(e.target) && !e.target.closest('.edit-btn')){
    editPop.dataset.show = 'false';
  }
});
function rebuildCard(book){
  const st = carousels[book.year];
  const i = st.items.indexOf(book);
  const el = st.cardEls[i];
  const cover = coverFor(book);
  const img = el.querySelector('.cover-img');
  const ph = el.querySelector('.placeholder');
  if(cover){
    if(img){ img.src = cover; }
    else {
      el.querySelector('.placeholder')?.remove();
      const imgEl = document.createElement('img');
      imgEl.className = 'cover-img'; imgEl.loading='lazy'; imgEl.decoding='async';
      imgEl.src = cover; imgEl.alt = book.title+' cover';
      el.insertBefore(imgEl, el.firstChild);
    }
  } else if(!ph){
    img?.remove();
    const div = document.createElement('div');
    div.className = 'placeholder';
    div.innerHTML = `${ICON_BOOK}<div class="p-title">${book.title}</div><div class="p-author">${book.author}</div>`;
    el.insertBefore(div, el.firstChild);
  }
}

// ---- export overrides (modal, doesn't affect page layout/height) ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  document.getElementById('exportText').value = JSON.stringify(getOverrides(), null, 2);
  document.getElementById('exportBackdrop').dataset.show = 'true';
});
document.getElementById('closeExportBtn').addEventListener('click', ()=>{
  document.getElementById('exportBackdrop').dataset.show = 'false';
});
document.getElementById('exportBackdrop').addEventListener('click', (e)=>{
  if(e.target.id === 'exportBackdrop') document.getElementById('exportBackdrop').dataset.show = 'false';
});
document.getElementById('copyBtn').addEventListener('click', ()=>{
  const t = document.getElementById('exportText');
  t.select();
  navigator.clipboard?.writeText(t.value);
});
if(ADMIN_MODE && Object.keys(getOverrides()).length) document.getElementById('exportBtn').style.display = 'inline-block';

// icon strokes need currentColor fix for chevrons/pencil (inherit stroke)
document.querySelectorAll('.nav-btn svg, .edit-btn svg').forEach(svg=> svg.style.stroke = 'currentColor');

// ---- deep link straight to one book, e.g. johnplusbooks.com/#2021-january-the-devotion-of-suspect-x ----
// lets a specific pick be shared on its own (Telegram, etc.) rather than just linking the whole site
function openFromHash(){
  const wanted = location.hash.slice(1);
  if(!wanted) return;
  const b = DATA.find(x => !x.break && slug(x) === wanted);
  if(!b) return;
  showYear(b.year);
  const st = carousels[b.year];
  setActive(b.year, st.items.indexOf(b));
  openBookModal(b, b.year);
}
openFromHash();
window.addEventListener('hashchange', openFromHash);
</script>
</body>
